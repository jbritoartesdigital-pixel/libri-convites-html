name: Publicar Libri Convites

on:
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      # ==================================================
      # 1. BAIXAR O REPOSITÓRIO
      # ==================================================
      - name: Baixar arquivos do GitHub
        uses: actions/checkout@v6

      # ==================================================
      # 2. PREPARAR PYTHON
      # ==================================================
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==================================================
      # 3. INSTALAR PILLOW
      # ==================================================
      - name: Instalar otimizador de imagens
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      # ==================================================
      # 4. OTIMIZAR TODAS AS PREVIEWS
      #
      # ACEITA:
      # preview.png
      # preview.jpg
      # preview.jpeg
      #
      # E SEMPRE GERA:
      # preview-otimizada.jpg
      #
      # O arquivo original NÃO é alterado.
      # ==================================================
      - name: Criar previews otimizadas
        run: |
          python <<'PYTHON'
          from pathlib import Path
          from PIL import Image, ImageOps

          TAMANHO_ALVO_KB = 550
          LARGURA_MAXIMA = 1200
          QUALIDADE_INICIAL = 92
          QUALIDADE_MINIMA = 60
          PASSO_QUALIDADE = 2
          FATOR_REDUCAO_EXTRA = 0.90
          LARGURA_MINIMA = 700

          formatos_aceitos = {".png", ".jpg", ".jpeg"}

          previews = [
              arquivo
              for arquivo in Path(".").glob("*/imagens/preview.*")
              if arquivo.suffix.lower() in formatos_aceitos
          ]

          if not previews:
              print("Nenhuma preview encontrada.")
              raise SystemExit(0)

          print(f"{len(previews)} preview(s) encontrada(s).")

          def salvar_jpg(imagem, destino, qualidade):
              imagem.save(
                  destino,
                  "JPEG",
                  quality=qualidade,
                  optimize=True,
                  progressive=True,
                  subsampling="4:2:0",
              )

          for origem in previews:
              destino = origem.parent / "preview-otimizada.jpg"

              print()
              print("--------------------------------")
              print(f"Original: {origem}")

              with Image.open(origem) as original:
                  original = ImageOps.exif_transpose(original)

                  if original.mode in ("RGBA", "LA"):
                      fundo = Image.new(
                          "RGB",
                          original.size,
                          "white"
                      )

                      if original.mode == "RGBA":
                          fundo.paste(
                              original,
                              mask=original.getchannel("A")
                          )
                      else:
                          fundo.paste(
                              original.convert("RGB")
                          )

                      imagem = fundo

                  else:
                      imagem = original.convert("RGB")

                  if imagem.width > LARGURA_MAXIMA:
                      nova_altura = round(
                          imagem.height
                          * LARGURA_MAXIMA
                          / imagem.width
                      )

                      imagem = imagem.resize(
                          (
                              LARGURA_MAXIMA,
                              nova_altura
                          ),
                          Image.Resampling.LANCZOS,
                      )

                  qualidade_usada = QUALIDADE_INICIAL

                  for qualidade in range(
                      QUALIDADE_INICIAL,
                      QUALIDADE_MINIMA - 1,
                      -PASSO_QUALIDADE,
                  ):
                      salvar_jpg(
                          imagem,
                          destino,
                          qualidade
                      )

                      tamanho_kb = (
                          destino.stat().st_size
                          / 1024
                      )

                      qualidade_usada = qualidade

                      if tamanho_kb <= TAMANHO_ALVO_KB:
                          break

                  tamanho_kb = (
                      destino.stat().st_size
                      / 1024
                  )

                  while (
                      tamanho_kb > TAMANHO_ALVO_KB
                      and imagem.width > LARGURA_MINIMA
                  ):
                      nova_largura = max(
                          LARGURA_MINIMA,
                          round(
                              imagem.width
                              * FATOR_REDUCAO_EXTRA
                          ),
                      )

                      nova_altura = round(
                          imagem.height
                          * nova_largura
                          / imagem.width
                      )

                      imagem = imagem.resize(
                          (
                              nova_largura,
                              nova_altura
                          ),
                          Image.Resampling.LANCZOS,
                      )

                      salvar_jpg(
                          imagem,
                          destino,
                          QUALIDADE_MINIMA
                      )

                      qualidade_usada = QUALIDADE_MINIMA

                      tamanho_kb = (
                          destino.stat().st_size
                          / 1024
                      )

                  tamanho_final = (
                      destino.stat().st_size
                      / 1024
                  )

                  print(f"Gerado: {destino}")
                  print(
                      "Dimensão final: "
                      f"{imagem.width}x{imagem.height}"
                  )
                  print(
                      "Qualidade JPEG: "
                      f"{qualidade_usada}"
                  )
                  print(
                      "Tamanho final: "
                      f"{tamanho_final:.0f} KB"
                  )

                  if tamanho_final <= TAMANHO_ALVO_KB:
                      print("STATUS: OK")
                  else:
                      print(
                          "STATUS: arquivo ainda ficou "
                          "acima do alvo."
                      )

          print()
          print("Otimização concluída.")
          PYTHON

      # ==================================================
      # 5. PREPARAR WRANGLER UMA VEZ E REAPROVEITAR CACHE
      #
      # O runtime fica fora da pasta publicada,
      # então node_modules nunca vai para o Cloudflare.
      # ==================================================
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Restaurar cache do Wrangler
        id: wrangler-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/libri-wrangler
            ~/.npm
          key: ${{ runner.os }}-node24-wrangler-4.129.0-v1

      - name: Instalar Wrangler
        if: steps.wrangler-cache.outputs.cache-hit != 'true'
        env:
          npm_config_audit: "false"
          npm_config_fund: "false"
          npm_config_update_notifier: "false"
        run: |
          npm install \
            --prefix "${{ runner.temp }}/libri-wrangler" \
            --no-audit \
            --no-fund \
            --save-exact \
            wrangler@4.129.0

      # ==================================================
      # 6. PUBLICAR NO CLOUDFLARE PAGES
      # ==================================================
      - name: Publicar no Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN:
            ${{ secrets.CLOUDFLARE_API_TOKEN }}

          CLOUDFLARE_ACCOUNT_ID:
            ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

          WRANGLER_SEND_METRICS: "false"

        run: |
          "${{ runner.temp }}/libri-wrangler/node_modules/.bin/wrangler" \
            pages deploy . \
            --project-name=libri-convites \
            --branch=main \
            --commit-dirty=true
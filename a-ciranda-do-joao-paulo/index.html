  <script>

    }).then((resposta) => {

  <style>
    :root {
      --fundo: #000;
      --transicao-video: 240ms;

      /* fallbacks; CONFIG.tema sobrescreve */
      --tema-escuro: #203B52;
      --tema-principal: #C47A5A;
      --tema-claro: #F5F1EB;
      --tema-acento: #D4B06A;
      --tema-superficie: #F5F1EB;
      --tema-texto: #594139;

      --branco: #fff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--fundo);
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: Arial, Helvetica, sans-serif;

      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    img,
    video {
      display: block;

      -webkit-user-drag: none;
      user-drag: none;
    }

    button,
    a {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      appearance: none;
      -webkit-appearance: none;
    }

    /* ==================================================
       TELAS 9:16
    ================================================== */

    .tela {
      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background: var(--fundo);
    }

    @supports (height: 100dvh) {
      .tela {
        height: 100dvh;
      }
    }

    .quadro {
      position: relative;

      width: max(
        100vw,
        calc(100vh * 9 / 16)
      );

      height: max(
        100vh,
        calc(100vw * 16 / 9)
      );

      flex: 0 0 auto;

      overflow: hidden;
      background: #000;
    }

    @supports (height: 100dvh) {
      .quadro {
        width: max(
          100vw,
          calc(100dvh * 9 / 16)
        );

        height: max(
          100dvh,
          calc(100vw * 16 / 9)
        );
      }
    }

    .arte,
    #video {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    /* ==================================================
       CARD FINAL
    ================================================== */

    #finalTela {
      z-index: 20;

      visibility: visible;
      opacity: 1;

      pointer-events: none;
    }

    #finalTela.ativo {
      pointer-events: auto;
    }

    /* ==================================================
       VIDEO
    ================================================== */

    #videoTela {
      z-index: 30;

      visibility: hidden;
      opacity: 0;

      pointer-events: none;

      background: transparent;

      transition:
        opacity var(--transicao-video) ease;
    }

    #videoTela.ativo {
      visibility: visible;
      opacity: 1;

      pointer-events: auto;
    }

    #videoTela.saindo {
      opacity: 0;
      pointer-events: none;
    }

    #video {
      background: transparent;
    }

    /* ==================================================
       CAPA
    ================================================== */

    #capaTela {
      z-index: 50;

      visibility: visible;
      opacity: 1;

      transition:
        opacity 180ms ease;
    }

    #capaTela.saindo {
      opacity: 0;
      pointer-events: none;
    }

    #abrirConvite {
      position: absolute;
      inset: 0;

      z-index: 100;

      width: 100%;
      height: 100%;

      padding: 0;
      margin: 0;
      border: 0;

      background: transparent;

      cursor: pointer;
      touch-action: manipulation;
    }

    /* ==================================================
       PULAR ABERTURA
    ================================================== */

    #pular {
      position: fixed;

      right: max(
        16px,
        calc(env(safe-area-inset-right) + 16px)
      );

      bottom: max(
        20px,
        calc(env(safe-area-inset-bottom) + 20px)
      );

      z-index: 500;

      padding: 9px 14px;

      border: 1px solid rgba(255,255,255,.55);
      border-radius: 999px;

      background: rgba(0,0,0,.48);

      color: #fff;

      font-size: 13px;

      cursor: pointer;

      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 160ms ease;
    }

    #pular.visivel {
      opacity: 1;
      visibility: visible;
    }

    /* ==================================================
       HOTSPOT
    ================================================== */

    .hotspot {
      position: absolute;

      z-index: 300;

      display: block;

      padding: 0;
      margin: 0;
      border: 0;

      background: transparent;

      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }

    /* ==================================================
       CONTROLE DE SOM
    ================================================== */

    #controleSom {
      position: fixed;

      top: max(
        14px,
        calc(env(safe-area-inset-top) + 8px)
      );

      right: max(
        16px,
        calc(env(safe-area-inset-right) + 16px)
      );

      z-index: 400;

      width: 38px;
      height: 38px;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 0;

      border:
        1px solid rgba(255,255,255,.30);

      border-radius: 50%;

      background:
        rgba(0,0,0,.38);

      color: #fff;

      cursor: pointer;

      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    #controleSom.visivel {
      display: flex;
    }

    #controleSom svg {
      width: 20px;
      height: 20px;

      fill: none;

      stroke: currentColor;
      stroke-width: 1.8;

      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #iconeMudo {
      display: none;
    }

    #controleSom.mudo #iconeSom {
      display: none;
    }

    #controleSom.mudo #iconeMudo {
      display: block;
    }

    /* ==================================================
       RSVP | POP-UP LIMPO
    ================================================== */

    .rsvp-modal {
      position: fixed;
      inset: 0;

      z-index: 1400;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        max(8px, env(safe-area-inset-top))
        max(8px, env(safe-area-inset-right))
        max(8px, env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));

      background:
        color-mix(
          in srgb,
          var(--tema-escuro) 70%,
          transparent
        );

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity 180ms ease,
        visibility 180ms ease;
    }

    .rsvp-modal.aberto {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .rsvp-shell {
      position: relative;

      width: min(98vw, 680px);
      height: min(96dvh, 900px);
      max-height: calc(100dvh - 16px);

      overflow: hidden;

      border:
        1px solid
        color-mix(
          in srgb,
          var(--tema-principal) 24%,
          transparent
        );

      border-radius: 28px;

      background:
        var(--tema-superficie);

      box-shadow:
        0 24px 74px rgba(0,0,0,.34);

      transform:
        translateY(6px)
        scale(.995);

      transition:
        transform 180ms ease;
    }

    .rsvp-modal.aberto .rsvp-shell {
      transform:
        translateY(0)
        scale(1);
    }

    #fecharRsvp {
      position: absolute;

      top: max(
        10px,
        env(safe-area-inset-top)
      );

      right: 10px;

      z-index: 6;

      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      border:
        1px solid
        color-mix(
          in srgb,
          var(--tema-principal) 18%,
          transparent
        );

      border-radius: 50%;

      background:
        color-mix(
          in srgb,
          var(--tema-superficie) 92%,
          #fff
        );

      color:
        var(--tema-texto);

      box-shadow:
        0 4px 18px rgba(0,0,0,.14);

      font-size: 28px;
      line-height: 1;

      cursor: pointer;

      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    #rsvpLoading {
      position: absolute;
      inset: 0;

      z-index: 2;

      display: grid;
      place-items: center;

      padding: 24px;

      background:
        var(--tema-superficie);

      color:
        var(--tema-texto);

      font-size: 15px;
      text-align: center;

      transition:
        opacity 160ms ease,
        visibility 160ms ease;
    }

    #rsvpLoading.oculto {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #rsvpFrame {
      position: absolute;
      inset: 0;

      z-index: 1;

      width: 100%;
      height: 100%;

      border: 0;

      background:
        var(--tema-superficie);

      opacity: 0;

      transition:
        opacity 160ms ease;
    }

    #rsvpFrame.pronto {
      opacity: 1;
    }

    /*
      Fallback técnico preservado.
      Não cria faixa/rodapé visual no RSVP.
    */
    #rsvpFallback {
      display: none !important;
    }

    /* ==================================================
       FOCUS
    ================================================== */

    .hotspot:focus-visible,
    #abrirConvite:focus-visible,
    #pular:focus-visible,
    #controleSom:focus-visible,
    #fecharRsvp:focus-visible {
      outline:
        2px solid rgba(255,255,255,.96);

      outline-offset: -3px;
    }

    /* ==================================================
       REDUCED MOTION
    ================================================== */

    @media (prefers-reduced-motion: reduce) {
      #capaTela,
      #videoTela,
      #pular,
      .rsvp-modal,
      .rsvp-shell,
      #rsvpFrame,
      #rsvpLoading {
        transition-duration:
          1ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- ==================================================

  <button

    <svg

  </button>

  <!-- ==================================================
       LIBRI RSVP
  ================================================== -->

  <div
    id="modalRsvp"
    class="rsvp-modal"
    role="dialog"
    aria-modal="true"
    aria-label="Confirmar presença"
  >

    <div class="rsvp-shell">

      <button
        id="fecharRsvp"
        type="button"
        aria-label="Fechar confirmação"
      >
        &times;
      </button>

      <div
        id="rsvpLoading"
        role="status"
        aria-live="polite"
      >
        Carregando confirma&#231;&#227;o...
      </div>

      <iframe
        id="rsvpFrame"
        title="Confirmação de presença"
        loading="eager"
        referrerpolicy="strict-origin-when-cross-origin"

      <a
        id="rsvpFallback"
        target="_blank"
        rel="noopener noreferrer"
      >
        Abrir confirma&#231;&#227;o em nova p&#225;gina
      </a>

    </div>
  </div>

  <!-- ==================================================
       AUDIO
  ================================================== -->

  <audio
    id="musica"
    preload="metadata"
    loop
  ></audio>

  <!-- ==================================================
       MOTOR
  ================================================== -->

  <script>
    window.CONFIG_PROMISE
      .then((CONFIG) => {

        "use strict";

        /* ==================================================
           TEMA
        ================================================== */

        if (CONFIG.tema) {

          const raiz =
            document.documentElement;

          const mapaTema = {
            escuro:
              "--tema-escuro",

            principal:
              "--tema-principal",

            claro:
              "--tema-claro",

            acento:
              "--tema-acento",

            superficie:
              "--tema-superficie",

            texto:
              "--tema-texto"
          };

          for (
            const [chave, variavel]
            of Object.entries(mapaTema)
          ) {

            if (CONFIG.tema[chave]) {
              raiz.style.setProperty(
                variavel,
                CONFIG.tema[chave]
              );
            }

          }

        }

        /* ==================================================
           DOM
        ================================================== */

        const capaTela =
          document.getElementById(
            "capaTela"
          );

        const videoTela =
          document.getElementById(
            "videoTela"
          );

        const finalTela =
          document.getElementById(
            "finalTela"
          );

        const capaImagem =
          document.getElementById(
            "capaImagem"
          );

        const finalImagem =
          document.getElementById(
            "finalImagem"
          );

        const video =
          document.getElementById(
            "video"
          );

        const musica =
          document.getElementById(
            "musica"
          );

        const abrirConvite =
          document.getElementById(
            "abrirConvite"
          );

        const pular =
          document.getElementById(
            "pular"
          );

        const controleSom =
          document.getElementById(
            "controleSom"
          );

        const hotspotConfirmacao =
          document.getElementById(
            "hotspotConfirmacao"
          );

        /* RSVP */

        const modalRsvp =
          document.getElementById(
            "modalRsvp"
          );

        const fecharRsvp =
          document.getElementById(
            "fecharRsvp"
          );

        const rsvpFrame =
          document.getElementById(
            "rsvpFrame"
          );

        const rsvpLoading =
          document.getElementById(
            "rsvpLoading"
          );

        const rsvpFallback =
          document.getElementById(
            "rsvpFallback"
          );

        /* ==================================================
           ESTADO
        ================================================== */

        let conviteAberto = false;

        let finalAtivo = false;

        let finalizando = false;

        let somLigado = true;

        let audioDisponivel = true;

        let midiaAquecida = false;

        let timerPular = null;

        let timerRsvpFallback = null;

        let rafAudio = null;

        let ultimoAjusteSincronia = 0;

        let videoRsvpEstavaTocando = false;

        let videoEstavaTocando = false;

        let musicaEstavaTocando = false;

        /* ==================================================
           URLS
        ================================================== */

        const urlArquivo =
          (caminho) =>
            `${caminho}?v=${
              encodeURIComponent(
                CONFIG.versaoArquivos
              )
            }`;

        function urlMidia(arquivo) {

          const partes =
            String(arquivo)
              .split("/")
              .map(
                (parte) =>
                  encodeURIComponent(parte)
              )
              .join("/");

          return (
            `${CONFIG.hostMidia}/` +
            `${CONFIG.pastaCliente}/` +
            `${partes}?v=` +
            `${encodeURIComponent(
              CONFIG.versaoMidia
            )}`
          );

        }

        /* ==================================================
           RESOLVER IMAGENS
        ================================================== */

        const EXTENSOES_IMAGEM = [
          ".jpg",
          ".jpeg",
          ".png",
          ".webp",
          ".avif"
        ];

        function temExtensaoImagem(
          caminho
        ) {

          const limpo =
            String(caminho || "")
              .split("?")[0]
              .split("#")[0];

          return (
            /\.(?:jpe?g|png|webp|avif)$/i
              .test(limpo)
          );

        }

        async function resolverImagem(
          elemento,
          caminhoBase
        ) {

          if (
            !elemento ||
            !caminhoBase
          ) {
            return false;
          }

          const bases =
            Array.isArray(caminhoBase)
              ? caminhoBase.filter(Boolean)
              : [caminhoBase];

          const candidatos = [];

          for (const base of bases) {

            if (
              temExtensaoImagem(base)
            ) {

              candidatos.push(base);

            } else {

              for (
                const extensao
                of EXTENSOES_IMAGEM
              ) {

                candidatos.push(
                  `${base}${extensao}`
                );

              }

            }

          }

          for (
            const candidato
            of candidatos
          ) {

            const carregou =
              await new Promise(
                (resolve) => {

                  const aoCarregar =
                    async () => {

                      elemento
                        .removeEventListener(
                          "error",
                          aoFalhar
                        );

                      if (
                        typeof elemento.decode
                        === "function"
                      ) {

                        await elemento
                          .decode()
                          .catch(() => {});

                      }

                      resolve(true);

                    };

                  const aoFalhar =
                    () => {

                      elemento
                        .removeEventListener(
                          "load",
                          aoCarregar
                        );

                      resolve(false);

                    };

                  elemento
                    .addEventListener(
                      "load",
                      aoCarregar,
                      { once: true }
                    );

                  elemento
                    .addEventListener(
                      "error",
                      aoFalhar,
                      { once: true }
                    );

                  elemento.src =
                    urlArquivo(
                      candidato
                    );

                }
              );

            if (carregou) {

              elemento.dataset
                .arquivoResolvido =
                  candidato;

              return candidato;

            }

          }

          console.warn(
            "[Libri] Imagem não encontrada:",
            caminhoBase
          );

          return false;

        }

        /* ==================================================
           IMAGENS
        ================================================== */

        const capaCarregada =
          resolverImagem(
            capaImagem,
            CONFIG.capaArquivo
          );

        let finalCarregado =
          null;

        function carregarFinal() {

          if (!finalCarregado) {

            finalCarregado =
              resolverImagem(
                finalImagem,
                CONFIG.finalArquivo
              );

          }

          return finalCarregado;

        }

        /* ==================================================
           HOTSPOT
        ================================================== */

        function posicionar(
          elemento,
          dados
        ) {

          if (
            !elemento ||
            !dados
          ) {
            return;
          }

          elemento.style.left =
            dados.left;

          elemento.style.top =
            dados.top;

          elemento.style.width =
            dados.width;

          elemento.style.height =
            dados.height;

        }

        posicionar(
          hotspotConfirmacao,
          CONFIG.hotspotsFinal
            ?.confirmacao
        );

        /* ==================================================
           MIDIA
        ================================================== */

        function aquecerMidia() {

          if (midiaAquecida) {
            return;
          }

          midiaAquecida = true;

          video.src =
            urlMidia(
              CONFIG.videoArquivo
            );

          musica.src =
            urlMidia(
              CONFIG.musicaArquivo
            );

          video.preload =
            CONFIG.preloadInteligente
              ? "auto"
              : "metadata";

          musica.preload =
            "metadata";

          video.load();
          musica.load();

        }

        /* ==================================================
           CAPA
        ================================================== */

        function esconderCapa() {

          if (
            capaTela.classList
              .contains("saindo")
          ) {
            return;
          }

          capaTela.classList
            .add("saindo");

          setTimeout(() => {

            capaTela.style
              .visibility =
                "hidden";

          }, 200);

        }

        /* ==================================================
           PRIMEIRO FRAME REAL
        ================================================== */

        function aguardarPrimeiroFrame(
          timeoutMs = 2600
        ) {

          return new Promise(
            (resolve) => {

              let finalizado = false;

              let timer = null;

              const done =
                (resultado = true) => {

                  if (finalizado) {
                    return;
                  }

                  finalizado = true;

                  clearTimeout(timer);

                  resolve(resultado);

                };

              timer =
                setTimeout(
                  () => done(false),
                  timeoutMs
                );

              if (
                typeof video
                  .requestVideoFrameCallback
                === "function"
              ) {

                video
                  .requestVideoFrameCallback(
                    () => done(true)
                  );

                return;

              }

              if (
                video.readyState >= 2
              ) {

                requestAnimationFrame(
                  () => done(true)
                );

                return;

              }

              video.addEventListener(
                "loadeddata",
                () => done(true),
                { once: true }
              );

            }
          );

        }

        /* ==================================================
           AUDIO
        ================================================== */

        function tempoEsperadoMusica() {

          let esperado =
            Math.max(
              0,
              video.currentTime +
              CONFIG.inicioMusica
            );

          if (
            Number.isFinite(
              musica.duration
            ) &&
            musica.duration > 0
          ) {

            esperado %=
              musica.duration;

          }

          return esperado;

        }

        function iniciarMusicaSilenciosa() {

          musica.volume = 0.001;

          try {

            musica.currentTime =
              Math.max(
                0,
                CONFIG.inicioMusica
              );

          } catch (_) {}

          const tentativa =
            musica.play();

          if (
            tentativa &&
            typeof tentativa.catch
            === "function"
          ) {

            tentativa.catch(
              () => {

                audioDisponivel =
                  false;

                controleSom.classList
                  .remove("visivel");

              }
            );

          }

        }

        function subirMusica() {

          cancelAnimationFrame(
            rafAudio
          );

          if (
            !audioDisponivel ||
            musica.paused
          ) {
            return;
          }

          const duracao =
            Math.max(
              120,
              Number(
                CONFIG.transicaoAudio
              ) || 260
            );

          const inicio =
            performance.now();

          const volumeInicial =
            musica.volume;

          const volumeFinal =
            somLigado
              ? CONFIG.volumeMusica
              : 0;

          function passo(agora) {

            const progresso =
              Math.min(
                1,
                (
                  agora - inicio
                ) / duracao
              );

            musica.volume =
              volumeInicial +
              (
                volumeFinal -
                volumeInicial
              ) * progresso;

            if (
              progresso < 1
            ) {

              rafAudio =
                requestAnimationFrame(
                  passo
                );

            }

          }

          rafAudio =
            requestAnimationFrame(
              passo
            );

        }

        function manterSincronia(
          forcar = false
        ) {

          if (
            !audioDisponivel ||
            finalAtivo ||
            video.paused ||
            musica.paused
          ) {
            return;
          }

          const agora =
            performance.now();

          if (
            !forcar &&
            (
              agora -
              ultimoAjusteSincronia
            ) < 1000
          ) {
            return;
          }

          ultimoAjusteSincronia =
            agora;

          const esperado =
            tempoEsperadoMusica();

          const diferenca =
            Math.abs(
              musica.currentTime -
              esperado
            );

          if (
            forcar ||
            diferenca > 0.35
          ) {

            try {

              musica.currentTime =
                esperado;

            } catch (_) {}

          }

        }

        /* ==================================================
           FINAL
        ================================================== */

        async function finalizarVideo() {

          if (
            finalizando ||
            finalAtivo
          ) {
            return;
          }

          finalizando = true;

          clearTimeout(
            timerPular
          );

          pular.classList
            .remove("visivel");

          const finalOk =
            await carregarFinal();

          /*
            Se o card final não carregar,
            preservar a tela visual atual.
          */
          if (!finalOk) {

            console.warn(
              "[Libri] Card final não carregou."
            );

            finalizando = false;

            return;

          }

          finalTela.classList
            .add("ativo");

          videoTela.classList
            .add("saindo");

          setTimeout(() => {

            video.pause();

            videoTela.classList
              .remove(
                "ativo",
                "saindo"
              );

            videoTela.style
              .visibility =
                "hidden";

          }, 240);

          esconderCapa();

          finalAtivo = true;
          finalizando = false;

          /*
            HARD LOCK:
            Não reiniciar,
            não dar seek,
            não resetar a música.
          */

          if (
            audioDisponivel
          ) {

            musica.volume =
              somLigado
                ? CONFIG.volumeMusica
                : 0;

            if (musica.paused) {

              musica
                .play()
                .catch(() => {});

            }

            controleSom.classList
              .add("visivel");

          }

        }

        /* ==================================================
           INICIAR CONVITE
        ================================================== */

        async function iniciarConvite() {

          if (conviteAberto) {
            return;
          }

          conviteAberto = true;

          /*
            O clique do usuário
            satisfaz autoplay.
          */

          aquecerMidia();

          await capaCarregada
            .catch(() => false);

          iniciarMusicaSilenciosa();

          try {

            video.currentTime = 0;

          } catch (_) {}

          videoTela.style
            .visibility =
              "visible";

          videoTela.classList
            .add("ativo");

          const tentativa =
            video.play();

          if (
            tentativa &&
            typeof tentativa.catch
            === "function"
          ) {

            try {

              await tentativa;

            } catch (erro) {

              console.warn(
                "[Libri] Vídeo não iniciou:",
                erro
              );

              await finalizarVideo();

              return;

            }

          }

          const primeiroFrame =
            await aguardarPrimeiroFrame();

          if (!primeiroFrame) {

            console.warn(
              "[Libri] Primeiro frame não confirmado."
            );

            await finalizarVideo();

            return;

          }

          manterSincronia(true);

          esconderCapa();

          subirMusica();

          if (
            audioDisponivel
          ) {

            controleSom.classList
              .add("visivel");

          }

          clearTimeout(
            timerPular
          );

          timerPular =
            setTimeout(
              () => {

                if (
                  !finalAtivo &&
                  !finalizando
                ) {

                  pular.classList
                    .add("visivel");

                }

              },
              Number(
                CONFIG.tempoPular
              ) || 5000
            );

          /*
            Card final pode carregar
            durante o vídeo.
          */
          carregarFinal();

        }

        /* ==================================================
           SOM
        ================================================== */

        function alternarSom() {

          if (!audioDisponivel) {
            return;
          }

          somLigado =
            !somLigado;

          musica.volume =
            somLigado
              ? CONFIG.volumeMusica
              : 0;

          controleSom.classList
            .toggle(
              "mudo",
              !somLigado
            );

        }

        /* ==================================================
           RSVP
        ================================================== */

        function urlRsvpEmbed() {

          const url =
            new URL(
              CONFIG.linkConfirmacao
            );

          url.searchParams.set(
            "embed",
            "1"
          );

          return url.toString();

        }

        function mostrarRsvpCarregado() {

          clearTimeout(
            timerRsvpFallback
          );

          timerRsvpFallback = null;

          rsvpLoading.classList
            .add("oculto");

          rsvpFrame.classList
            .add("pronto");

        }

        function abrirRsvp() {

          /*
            No Card Final o vídeo
            normalmente já encerrou,
            mas o motor permanece seguro.
          */

          videoRsvpEstavaTocando =
            Boolean(
              video &&
              !video.paused &&
              !finalAtivo
            );

          if (
            videoRsvpEstavaTocando
          ) {

            video.pause();

          }

          /*
            HARD LOCK:
            a música NÃO pausa,
            NÃO reinicia,
            NÃO muda de posição
            e NÃO perde volume.
          */

          clearTimeout(
            timerRsvpFallback
          );

          timerRsvpFallback = null;

          rsvpLoading.classList
            .remove("oculto");

          rsvpFrame.classList
            .remove("pronto");

          rsvpFallback.href =
            CONFIG.linkConfirmacao;

          modalRsvp.classList
            .add("aberto");

          fecharRsvp.focus();

          requestAnimationFrame(
            () => {

              rsvpFrame.src =
                urlRsvpEmbed();

            }
          );

          /*
            Mesmo se libri-rsvp-ready
            não chegar, não manter
            loading infinito.
          */

          timerRsvpFallback =
            setTimeout(
              mostrarRsvpCarregado,
              3500
            );

        }

        function fecharRsvpModal() {

          clearTimeout(
            timerRsvpFallback
          );

          timerRsvpFallback = null;

          modalRsvp.classList
            .remove("aberto");

          if (
            videoRsvpEstavaTocando &&
            !finalAtivo
          ) {

            video
              .play()
              .catch(() => {});

          }

          videoRsvpEstavaTocando =
            false;

          setTimeout(
            () => {

              if (
                !modalRsvp.classList
                  .contains("aberto")
              ) {

                rsvpFrame.src =
                  "about:blank";

                rsvpFrame.classList
                  .remove("pronto");

                rsvpLoading.classList
                  .remove("oculto");

              }

            },
            220
          );

        }

        /* ==================================================
           VISIBILIDADE DA PÁGINA
        ================================================== */

        function tratarVisibilidade() {

          if (document.hidden) {

            videoEstavaTocando =
              !video.paused &&
              !finalAtivo &&
              !finalizando;

            musicaEstavaTocando =
              !musica.paused;

            if (
              videoEstavaTocando
            ) {

              video.pause();

            }

            if (
              musicaEstavaTocando
            ) {

              musica.pause();

            }

            return;

          }

          if (
            videoEstavaTocando &&
            !finalAtivo
          ) {

            video
              .play()
              .catch(() => {});

          }

          if (
            musicaEstavaTocando &&
            audioDisponivel
          ) {

            musica
              .play()
              .catch(() => {});

          }

          videoEstavaTocando =
            false;

          musicaEstavaTocando =
            false;

        }

        /* ==================================================
           EVENTOS PRINCIPAIS
        ================================================== */

        abrirConvite
          .addEventListener(
            "click",
            iniciarConvite
          );

        pular
          .addEventListener(
            "click",
            finalizarVideo
          );

        controleSom
          .addEventListener(
            "click",
            alternarSom
          );

        hotspotConfirmacao
          .addEventListener(
            "click",
            abrirRsvp
          );

        /* ==================================================
           RSVP | EVENTOS
        ================================================== */

        fecharRsvp
          .addEventListener(
            "click",
            fecharRsvpModal
          );

        modalRsvp
          .addEventListener(
            "click",
            (event) => {

              if (
                event.target ===
                modalRsvp
              ) {

                fecharRsvpModal();

              }

            }
          );

        rsvpFrame
          .addEventListener(
            "load",
            () => {

              if (
                !modalRsvp.classList
                  .contains("aberto")
              ) {
                return;
              }

              if (
                !rsvpFrame.src ||
                rsvpFrame.src ===
                  "about:blank"
              ) {
                return;
              }

              mostrarRsvpCarregado();

            }
          );

        window
          .addEventListener(
            "message",
            (event) => {

              if (
                event.origin !==
                "https://confirmacao.libriconvites.com.br"
              ) {
                return;
              }

              if (
                event.source !==
                rsvpFrame.contentWindow
              ) {
                return;
              }

              const data =
                event.data;

              if (
                !data ||
                data.source !==
                  "libri-rsvp"
              ) {
                return;
              }

              if (
                data.type ===
                "libri-rsvp-ready"
              ) {

                mostrarRsvpCarregado();

                return;

              }

              if (
                data.type ===
                "libri-rsvp-complete"
              ) {

                modalRsvp.dataset
                  .status =
                    data.status || "";

                /*
                  Não fechar automaticamente.
                  Mantém a mensagem de sucesso
                  do RSVP visível.
                */

                return;

              }

              if (
                data.type ===
                "libri-rsvp-close"
              ) {

                fecharRsvpModal();

              }

            }
          );

        /* ==================================================
           ESC
        ================================================== */

        document
          .addEventListener(
            "keydown",
            (event) => {

              if (
                event.key !==
                "Escape"
              ) {
                return;
              }

              if (
                modalRsvp.classList
                  .contains("aberto")
              ) {

                fecharRsvpModal();

              }

            }
          );

        /* ==================================================
           VIDEO
        ================================================== */

        video
          .addEventListener(
            "timeupdate",
            () => {

              if (
                finalizando ||
                finalAtivo
              ) {
                return;
              }

              manterSincronia();

              if (
                Number.isFinite(
                  video.duration
                ) &&
                video.duration > 0 &&
                (
                  video.duration -
                  video.currentTime
                ) <= 0.45
              ) {

                finalizarVideo();

              }

            }
          );

        video
          .addEventListener(
            "ended",
            finalizarVideo
          );

        video
          .addEventListener(
            "error",
            async () => {

              if (
                conviteAberto &&
                !finalAtivo
              ) {

                await finalizarVideo();

              }

            }
          );

        /* ==================================================
           AUDIO
        ================================================== */

        musica
          .addEventListener(
            "error",
            () => {

              audioDisponivel =
                false;

              controleSom.classList
                .remove("visivel");

            }
          );

        /* ==================================================
           APP VISIBILITY
        ================================================== */

        document
          .addEventListener(
            "visibilitychange",
            tratarVisibilidade
          );

        window
          .addEventListener(
            "pageshow",
            (event) => {

              if (
                event.persisted &&
                finalAtivo &&
                audioDisponivel
              ) {

                musica.volume =
                  somLigado
                    ? CONFIG.volumeMusica
                    : 0;

                musica
                  .play()
                  .catch(() => {});

              }

            }
          );

        /* ==================================================
           PROTEÇÕES SIMPLES
        ================================================== */

        document
          .addEventListener(
            "contextmenu",
            (event) => {

              event.preventDefault();

            }
          );

        document
          .addEventListener(
            "dragstart",
            (event) => {

              event.preventDefault();

            }
          );

      })
      .catch((erro) => {

        console.error(
          "[Libri] Falha ao iniciar convite:",
          erro
        );

        document.body.innerHTML = `
          <div
            style="
              min-height:100dvh;
              display:grid;
              place-items:center;
              background:#000;
              color:#fff;
              font:16px Arial;
              padding:24px;
              text-align:center;
            "
          >
            N&#227;o foi poss&#237;vel carregar o convite.
          </div>
        `;

      });
  </script>

</body>
</html>

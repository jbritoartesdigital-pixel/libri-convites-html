      box-shadow: 0 6px 20px rgba(0,0,0,.12);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .recado-card {
      position: relative;
      width: min(90vw, 430px);
      padding: 44px 26px 28px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--tema-principal) 38%, #fff);
      border-radius: 30px;
      background:
        radial-gradient(circle at 14% 10%, color-mix(in srgb, var(--tema-principal) 28%, transparent), transparent 34%),
        radial-gradient(circle at 88% 92%, color-mix(in srgb, var(--tema-acento) 28%, transparent), transparent 38%),
        linear-gradient(145deg, var(--tema-superficie), var(--tema-claro));
      color: var(--tema-texto);
      box-shadow: 0 24px 74px rgba(0,0,0,.34);
      text-align: center;
      transform: translateY(8px) scale(.99);
      transition: transform 180ms ease;
    }

    .recado-modal.aberto .recado-card { transform: translateY(0) scale(1); }

    .recado-coracao {
      width: 58px;
      height: 58px;
      margin: 0 auto 15px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: color-mix(in srgb, var(--tema-principal) 72%, #fff);
      box-shadow: 0 10px 26px color-mix(in srgb, var(--tema-principal) 22%, transparent);
      font-size: 29px;
    }

    #recadoTexto {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(18px, 5vw, 22px);
      line-height: 1.45;
      font-weight: 600;
      text-wrap: balance;
    }

    @media (max-width: 390px) {
      .idioma-opcoes { width: 86%; gap: 9px; }
      .idioma-botao { min-height: 50px; padding: 0 12px; font-size: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #idiomaTela,
      .rsvp-modal,
      .rsvp-shell,
      .recado-modal,
      .recado-card {
        transition-duration: 1ms !important;
      }
    }

  </style>
</head>

<body>

    <div class="quadro">

  <section id="finalTela" class="tela" aria-label="Convite final">
    <div class="quadro">
      <img
        id="finalImagem"
        class="arte"
        alt="Antonella • 1 | convite final"
        draggable="false"
      >

      <button
        id="hotspotConfirmacao"

        type="button"
        aria-label="Confirmar presen&#231;a"
      ></button>

      <button
        id="hotspotLocalizacao"
        class="hotspot"
        type="button"
        aria-label="Ver localiza&#231;&#227;o"
      ></button>

      <button
        id="hotspotFiltro"
        class="hotspot"
        type="button"
        aria-label="Abrir filtro especial"
      ></button>

      <button
        id="hotspotPresentes"
        class="hotspot"
        type="button"
        aria-label="Ver sugest&#245;es de presentes"
      ></button>

      <button
        id="controleSom"

        <svg id="iconeSom" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
          <path d="M16 9.5c.8.7 1.2 1.5 1.2 2.5s-.4 1.8-1.2 2.5"></path>
          <path d="M18.5 7c1.5 1.3 2.3 3 2.3 5s-.8 3.7-2.3 5"></path>
        </svg>
        <svg id="iconeMudo" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z"></path>

  <section id="videoTela" class="tela" aria-label="V&#237;deo de abertura">
    <div class="quadro">
      <video
        id="video"
        playsinline
        webkit-playsinline
        preload="metadata"
        disablepictureinpicture

      >

      <button

        aria-label="Abrir convite"

  <div id="modalLocalizacao" class="modal" role="dialog" aria-modal="true" aria-labelledby="tituloLocalizacao">
    <div class="modal-card">
      <button id="fecharLocalizacao" class="modal-fechar" type="button" aria-label="Fechar localiza&#231;&#227;o">&times;</button>

      <div class="modal-conteudo">

            <circle cx="12" cy="10" r="2.2"></circle>
          </svg>
        </div>
        <h2 id="tituloLocalizacao" class="modal-titulo"></h2>
        <div class="localizacao-divisor" aria-hidden="true"></div>

        <div class="modal-acoes">
          <button id="abrirGoogleMaps" class="acao-principal" type="button"></button>
          <button id="abrirWaze" class="acao-rota" type="button"></button>

      </div>
    </div>

  <div id="modalRsvp" class="rsvp-modal" role="dialog" aria-modal="true" aria-label="Confirmação de presença | RSVP">
    <div class="rsvp-shell">
      <button id="fecharRsvp" class="modal-fechar" type="button" aria-label="Fechar confirmação | Close RSVP">&times;</button>
      <iframe id="rsvpFrame" title="Confirmação de presença | RSVP" allow="clipboard-write"></iframe>

      <div class="recado-coracao" aria-hidden="true">💛</div>

    </div>

  <div id="modalPresentes" class="presentes-modal" role="dialog" aria-modal="true" aria-label="Sugest&#245;es de presentes">
    <div class="presentes-shell">
      <button id="fecharPresentes" class="modal-fechar" type="button" aria-label="Fechar sugest&#245;es de presentes">&times;</button>
      <img id="presentesImagem" alt="Sugest&#245;es de presentes" draggable="false">
    </div>
  </div>

  <audio id="musica" preload="metadata" loop></audio>

  <script>
    window.CONFIG_PROMISE.then((CONFIG) => {
      "use strict";

      if (CONFIG.tema) {
        const raiz = document.documentElement;
        const mapaTema = {
          escuro: "--tema-escuro",
          principal: "--tema-principal",
          claro: "--tema-claro",
          acento: "--tema-acento",
          superficie: "--tema-superficie",
          texto: "--tema-texto"
        };
        for (const [chave, variavel] of Object.entries(mapaTema)) {
          if (CONFIG.tema[chave]) raiz.style.setProperty(variavel, CONFIG.tema[chave]);
        }
      }

      const idiomaTela = document.getElementById("idiomaTela");
      const idiomaImagem = document.getElementById("idiomaImagem");
      const escolherPt = document.getElementById("escolherPt");
      const escolherEn = document.getElementById("escolherEn");

      const capaTela = document.getElementById("capaTela");
      const videoTela = document.getElementById("videoTela");
      const finalTela = document.getElementById("finalTela");

      const capaImagem = document.getElementById("capaImagem");
      const finalImagem = document.getElementById("finalImagem");
      const video = document.getElementById("video");
      const musica = document.getElementById("musica");

      const abrirConvite = document.getElementById("abrirConvite");
      const pular = document.getElementById("pular");
      const controleSom = document.getElementById("controleSom");
      const hotspotLocalizacao = document.getElementById("hotspotLocalizacao");
      const hotspotConfirmacao = document.getElementById("hotspotConfirmacao");
      const hotspotPresentes = document.getElementById("hotspotPresentes");
      const hotspotFiltro = document.getElementById("hotspotFiltro");

      const modalLocalizacao = document.getElementById("modalLocalizacao");
      const tituloLocalizacao = document.getElementById("tituloLocalizacao");
      const enderecoTexto = document.getElementById("enderecoTexto");
      const abrirGoogleMaps = document.getElementById("abrirGoogleMaps");
      const abrirWaze = document.getElementById("abrirWaze");
      const fecharLocalizacao = document.getElementById("fecharLocalizacao");

      const modalRsvp = document.getElementById("modalRsvp");
      const fecharRsvp = document.getElementById("fecharRsvp");
      const rsvpFrame = document.getElementById("rsvpFrame");
      const rsvpLoading = document.getElementById("rsvpLoading");
      const rsvpFallback = document.getElementById("rsvpFallback");

      const modalRecado = document.getElementById("modalRecado");
      const fecharRecado = document.getElementById("fecharRecado");
      const recadoTexto = document.getElementById("recadoTexto");

      const modalPresentes = document.getElementById("modalPresentes");
      const presentesImagem = document.getElementById("presentesImagem");
      const fecharPresentes = document.getElementById("fecharPresentes");

      let idiomaAtual = null;
      let idiomaDados = null;
      let popupAmareloExibido = false;

      let conviteAberto = false;
      let finalAtivo = false;
      let finalizando = false;
      let somLigado = true;
      let audioDisponivel = true;
      let midiaAquecida = false;

      let timerPular = null;
      let rafFim = null;
      let rafAudio = null;
      let ultimoAjusteSincronia = 0;

      let videoEstavaTocando = false;
      let musicaEstavaTocando = false;

      const urlArquivo = (caminho) =>
        `${caminho}?v=${encodeURIComponent(CONFIG.versaoArquivos)}`;

      function caminhoImagem(arquivo) {
        const caminho = String(arquivo || "").replace(/^\.\//, "");
        const pasta = String(CONFIG.pastaImagens || "imagens").replace(/^\/+|\/+$/g, "");

        if (!caminho) return caminho;
        if (/^(?:https?:)?\/\//i.test(caminho) || caminho.startsWith("data:") || caminho.startsWith("blob:")) {
          return caminho;
        }
        if (caminho === pasta || caminho.startsWith(`${pasta}/`)) return caminho;

        return `${pasta}/${caminho}`;
      }

      function urlMidia(arquivo) {
        /* Ao abrir o index diretamente no computador, usa os arquivos da mesma pasta.
           Publicado no site, continua usando o host de midia oficial. */
        if (window.location.protocol === "file:") {
          return urlArquivo(arquivo);
        }

        const partes = arquivo
          .split("/")
          .map((parte) => encodeURIComponent(parte))
          .join("/");

        return `${CONFIG.hostMidia}/${CONFIG.pastaCliente}/${partes}?v=${encodeURIComponent(CONFIG.versaoMidia)}`;
      }

      const EXTENSOES_IMAGEM = [".jpg", ".jpeg", ".png", ".webp", ".avif"];

      function temExtensaoImagem(caminho) {
        const limpo = String(caminho || "")
          .split("?")[0]
          .split("#")[0];

        return /\.(?:jpe?g|png|webp|avif)$/i.test(limpo);
      }

      async function resolverImagem(elemento, caminhoBase) {
        if (!elemento || !caminhoBase) return false;

        const bases = Array.isArray(caminhoBase)
          ? caminhoBase.filter(Boolean)
          : [caminhoBase];

        const candidatos = [];

        for (const base of bases) {
          if (temExtensaoImagem(base)) {
            candidatos.push(base);
          } else {
            for (const extensao of EXTENSOES_IMAGEM) {
              candidatos.push(`${base}${extensao}`);
            }
          }
        }

        for (const candidato of candidatos) {
          const carregou = await new Promise((resolve) => {
            const aoCarregar = async () => {
              elemento.removeEventListener("error", aoFalhar);

              if (typeof elemento.decode === "function") {
                await elemento.decode().catch(() => {});
              }

              resolve(true);
            };

            const aoFalhar = () => {
              elemento.removeEventListener("load", aoCarregar);
              resolve(false);
            };

            elemento.addEventListener("load", aoCarregar, { once: true });
            elemento.addEventListener("error", aoFalhar, { once: true });
            elemento.src = urlArquivo(caminhoImagem(candidato));
          });

          if (carregou) {
            elemento.dataset.arquivoResolvido = candidato;
            return candidato;
          }
        }

        console.warn("[Libri] Imagem n\xe3o encontrada:", caminhoBase);
        return false;
      }

      let capaCarregada = Promise.resolve(false);
      let finalCarregado = null;
      let presentesCarregado = null;

      const carregarFinal = () => {
        if (!idiomaDados) return Promise.resolve(false);
        if (!finalCarregado) finalCarregado = resolverImagem(finalImagem, idiomaDados.finalArquivo || CONFIG.finalArquivo);
        return finalCarregado;
      };

      const carregarPresentes = () => {
        if (!idiomaDados || !idiomaDados.presentesArquivo) return Promise.resolve(false);
        if (!presentesCarregado) presentesCarregado = resolverImagem(presentesImagem, idiomaDados.presentesArquivo);
        return presentesCarregado;
      };

      function configurarTextosDoIdioma() {
        const ingles = idiomaAtual === "en";
        document.documentElement.lang = ingles ? "en" : "pt-BR";

        pular.textContent = ingles ? "Skip intro" : "Pular abertura";
        pular.setAttribute("aria-label", ingles ? "Skip intro" : "Pular abertura");
        abrirConvite.setAttribute("aria-label", ingles ? "Open invitation" : "Abrir convite");
        hotspotConfirmacao.setAttribute("aria-label", ingles ? "RSVP now" : "Confirmar agora");
        hotspotLocalizacao.setAttribute("aria-label", ingles ? "Get directions" : "Como chegar");
        hotspotFiltro.setAttribute("aria-label", ingles ? "Open special filter" : "Abrir filtro especial");
        hotspotPresentes.setAttribute("aria-label", ingles ? "Gift suggestions" : "Sugestões de presentes");
        presentesImagem.alt = ingles ? "Antonella gift suggestions" : "Sugestões de presentes da Antonella";

        abrirGoogleMaps.textContent = (idiomaDados.botoes && idiomaDados.botoes.mapa)
          ? idiomaDados.botoes.mapa
          : (ingles ? "Open in Google Maps" : "Abrir no Google Maps");

        rsvpLoading.textContent = ingles ? "Loading RSVP..." : "Carregando confirmação...";
        rsvpFallback.textContent = ingles ? "Open in new page" : "Abrir em nova página";
      }

      async function selecionarIdioma(codigo) {
        if (idiomaAtual) return;

        const dados = CONFIG.idiomas && CONFIG.idiomas[codigo];
        if (!dados) return;

        idiomaAtual = codigo;
        idiomaDados = dados;
        popupAmareloExibido = false;

        configurarTextosDoIdioma();

        finalCarregado = null;
        presentesCarregado = null;
        capaCarregada = resolverImagem(capaImagem, idiomaDados.capaArquivo || CONFIG.capaArquivo);

        video.src = urlMidia(idiomaDados.videoArquivo || CONFIG.videoArquivo);
        musica.src = urlMidia(CONFIG.musicaArquivo);
        video.preload = "metadata";
        musica.preload = "metadata";
        video.load();
        musica.load();

        await capaCarregada.catch(() => false);

        idiomaTela.classList.add("saindo");
        setTimeout(() => {
          idiomaTela.style.visibility = "hidden";
        }, 200);

        if (!CONFIG.preloadInteligente) {
          carregarFinal().catch(() => false);
          carregarPresentes().catch(() => false);
        }

        setTimeout(aquecerMidia, 180);
      }

      function aquecerMidia() {
        if (!idiomaDados || midiaAquecida) return;
        midiaAquecida = true;
        video.preload = "auto";
        musica.preload = "auto";
        video.load();
        musica.load();
      }

      resolverImagem(
        idiomaImagem,
        (CONFIG.seletorIdioma && CONFIG.seletorIdioma.fundoArquivo) || "fundo"
      ).catch(() => false);

      function posicionar(elemento, dados) {
        elemento.style.left = dados.left;
        elemento.style.top = dados.top;
        elemento.style.width = dados.width;
        elemento.style.height = dados.height;
      }

      posicionar(hotspotConfirmacao, CONFIG.hotspotsFinal.confirmacao);
      posicionar(hotspotLocalizacao, CONFIG.hotspotsFinal.localizacao);
      posicionar(hotspotPresentes, CONFIG.hotspotsFinal.presentes);
      posicionar(hotspotFiltro, CONFIG.hotspotsFinal.filtro);
      tituloLocalizacao.textContent = CONFIG.local.nome;
      enderecoTexto.innerHTML = [
        CONFIG.local.linha1,
        CONFIG.local.linha2,
        CONFIG.local.linha3
      ].filter(Boolean).join("<br>");

      if (CONFIG.linkWaze) {
        abrirWaze.textContent = (CONFIG.botoes && CONFIG.botoes.waze) || "Waze";
      } else {
        abrirWaze.style.display = "none";
      }

      function esconderCapa() {
        if (capaTela.classList.contains("saindo")) return;

        capaTela.classList.add("saindo");

        setTimeout(() => {
          capaTela.style.visibility = "hidden";
        }, 200);
      }

      function aguardarPrimeiroFrame(timeoutMs = 2600) {
        return new Promise((resolve) => {
          let finalizado = false;
          let timer = null;

          const done = () => {
            if (finalizado) return;
            finalizado = true;
            clearTimeout(timer);
            resolve(true);
          };

          timer = setTimeout(() => {
            if (finalizado) return;
            finalizado = true;
            resolve(false);
          }, timeoutMs);

          if (typeof video.requestVideoFrameCallback === "function") {
            video.requestVideoFrameCallback(() => done());
            return;
          }

          if (video.readyState >= 2) {
            requestAnimationFrame(done);
            return;
          }

          video.addEventListener("loadeddata", done, { once: true });
        });
      }

      function tempoEsperadoMusica() {
        let esperado = Math.max(0, video.currentTime + CONFIG.inicioMusica);

        if (Number.isFinite(musica.duration) && musica.duration > 0) {
          esperado %= musica.duration;
        }

        return esperado;
      }

      function iniciarMusicaSilenciosa() {
        musica.volume = 0.001;

        try {
          musica.currentTime = Math.max(0, CONFIG.inicioMusica);
        } catch (_) {}

        const tentativa = musica.play();

        if (tentativa && typeof tentativa.catch === "function") {
          tentativa.catch(() => {
            audioDisponivel = false;
            controleSom.classList.remove("visivel");
          });
        }
      }

      function manterSincronia(forcar = false) {
        if (
          !audioDisponivel ||
          finalAtivo ||
          video.paused ||
          musica.paused
        ) {
          return;
        }

        const agora = performance.now();

        if (!forcar && agora - ultimoAjusteSincronia < 1000) {
          return;
        }

        ultimoAjusteSincronia = agora;

        const esperado = tempoEsperadoMusica();
        const diferenca = Math.abs(musica.currentTime - esperado);

        if (forcar || diferenca > 0.35) {
          try {
            musica.currentTime = esperado;
          } catch (_) {}
        }
      }

      function transicaoSuaveAudio(aoFinalizar) {
        cancelAnimationFrame(rafAudio);

        if (!audioDisponivel || musica.paused) {
          aoFinalizar();
          return;
        }

        const duracao = Math.max(120, CONFIG.transicaoAudio);
        const inicio = performance.now();
        const volumeVideoInicial = video.volume;
        const volumeMusicaInicial = musica.volume;
        const volumeMusicaFinal = somLigado ? CONFIG.volumeMusica : 0;

        const animar = (agora) => {
          const progresso = Math.min(1, (agora - inicio) / duracao);
          const suave = progresso * progresso * (3 - 2 * progresso);

          video.volume = Math.max(0, volumeVideoInicial * (1 - suave));
          musica.volume = volumeMusicaInicial + (volumeMusicaFinal - volumeMusicaInicial) * suave;

          if (progresso < 1) {
            rafAudio = requestAnimationFrame(animar);
            return;
          }

          video.volume = 0;
          musica.volume = volumeMusicaFinal;
          aoFinalizar();
        };

        rafAudio = requestAnimationFrame(animar);
      }

      async function iniciarConvite() {
        if (conviteAberto || !idiomaDados) return;
        conviteAberto = true;

        aquecerMidia();

        await capaCarregada.catch(() => false);
        carregarFinal().catch(() => false);
        carregarPresentes().catch(() => false);

        videoTela.style.visibility = "visible";
        videoTela.classList.remove("saindo");
        videoTela.classList.add("ativo");

        iniciarMusicaSilenciosa();
        video.volume = 1;

        try {
          video.currentTime = 0;
        } catch (_) {}

        const primeiroFrame = aguardarPrimeiroFrame();

        try {
          await video.play();
          const framePronto = await primeiroFrame;
          if (!framePronto) throw new Error("Primeiro frame indispon\xedvel");
        } catch (_) {
          /* Fallback sem tela preta: mantém a capa até o card final estar pronto. */
          await carregarFinal().catch(() => false);

          finalTela.classList.add("ativo");
          finalAtivo = true;
          finalizando = false;

          video.pause();
          videoTela.classList.remove("ativo");
          videoTela.classList.remove("saindo");
          videoTela.style.visibility = "hidden";

          if (audioDisponivel) {
            musica.volume = somLigado ? CONFIG.volumeMusica : 0;
            controleSom.classList.add("visivel");
          }

          esconderCapa();
          agendarRecadoAutomatico();
          return;
        }

        esconderCapa();

        pular.classList.add("visivel");
        clearTimeout(timerPular);
        timerPular = setTimeout(() => {
          pular.classList.remove("visivel");
        }, CONFIG.tempoPular);

        acompanharFinal();
      }

      function acompanharFinal() {
        cancelAnimationFrame(rafFim);

        const verificar = () => {
          if (finalizando || finalAtivo) return;

          manterSincronia();

          if (Number.isFinite(video.duration) && video.duration > 0) {
            const restante = video.duration - video.currentTime;

            if (restante > 0 && restante <= 0.45) {
              finalizarVideo();
              return;
            }
          }

          rafFim = requestAnimationFrame(verificar);
        };

        rafFim = requestAnimationFrame(verificar);
      }

      async function finalizarVideo() {
        if (finalizando || finalAtivo) return;

        manterSincronia(true);

        finalizando = true;
        clearTimeout(timerPular);
        cancelAnimationFrame(rafFim);
        pular.classList.remove("visivel");

        await carregarFinal().catch(() => false);

        finalTela.classList.add("ativo");
        videoTela.classList.add("saindo");

        transicaoSuaveAudio(() => {
          video.pause();

          videoTela.classList.remove("ativo");
          videoTela.classList.remove("saindo");
          videoTela.style.visibility = "hidden";

          video.volume = 1;
          finalAtivo = true;
          finalizando = false;

          if (audioDisponivel) {
            controleSom.classList.add("visivel");
          }

          agendarRecadoAutomatico();
        });
      }

      function abrirLocalizacao() {
        modalLocalizacao.classList.add("aberto");
        fecharLocalizacao.focus();
      }

      function fecharLocalizacaoModal() {
        modalLocalizacao.classList.remove("aberto");
      }

      function abrirDestino(url) {
        const link = document.createElement("a");
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        document.body.appendChild(link);
        link.click();
        link.remove();
      }

      function urlRsvpEmbed() {
        const base = String(CONFIG.linkConfirmacao || "").trim();
        if (!base) return "";
        return `${base}${base.includes("?") ? "&" : "?"}embed=1`;
      }

      function abrirRsvp() {
        const url = urlRsvpEmbed();
        if (!url) return;

        rsvpFrame.classList.remove("carregado");
        rsvpFrame.src = url;
        modalRsvp.classList.add("aberto");
        fecharRsvp.focus();
      }

      function fecharRsvpModal() {
        modalRsvp.classList.remove("aberto");
        rsvpFrame.classList.remove("carregado");
        setTimeout(() => { rsvpFrame.src = "about:blank"; }, 180);
      }

      function abrirRsvpExterno() {
        if (CONFIG.linkConfirmacao) abrirDestino(CONFIG.linkConfirmacao);
      }

      function abrirFiltro() {
        if (CONFIG.linkFiltro) abrirDestino(CONFIG.linkFiltro);
      }

      async function abrirPresentes() {
        modalPresentes.classList.add("aberto");
        fecharPresentes.focus();
        await carregarPresentes().catch(() => false);
      }

      function fecharPresentesModal() {
        modalPresentes.classList.remove("aberto");
      }

      function agendarRecadoAutomatico() {
        if (
          popupAmareloExibido ||
          !CONFIG.popupAmarelo ||
          !CONFIG.popupAmarelo.ativo ||
          !CONFIG.popupAmarelo.automaticoAposVideo ||
          !idiomaAtual
        ) return;

        popupAmareloExibido = true;
        setTimeout(abrirRecadoAutomatico, 320);
      }

      function abrirRecadoAutomatico() {
        if (!CONFIG.popupAmarelo || !idiomaAtual) return;
        const texto = CONFIG.popupAmarelo[idiomaAtual];
        if (!texto) return;

        recadoTexto.textContent = texto;
        modalRecado.classList.add("aberto");
        fecharRecado.focus();
      }

      function fecharRecadoModal() {
        modalRecado.classList.remove("aberto");
      }

      function alternarSom() {
        if (!audioDisponivel) return;

        somLigado = !somLigado;
        musica.volume = somLigado ? CONFIG.volumeMusica : 0;
        controleSom.classList.toggle("mudo", !somLigado);
      }

      function tratarVisibilidade() {
        if (document.hidden) {
          videoEstavaTocando = !video.paused && !finalAtivo && !finalizando;
          musicaEstavaTocando = !musica.paused;

          if (videoEstavaTocando) video.pause();
          if (musicaEstavaTocando) musica.pause();
          return;
        }

        if (videoEstavaTocando && !finalAtivo) {
          video.play().then(acompanharFinal).catch(() => {});
        }

        if (musicaEstavaTocando && audioDisponivel) {
          musica.play().catch(() => {});
        }

        videoEstavaTocando = false;
        musicaEstavaTocando = false;
      }

      escolherPt.addEventListener("click", () => selecionarIdioma("pt-BR"));
      escolherEn.addEventListener("click", () => selecionarIdioma("en"));
      abrirConvite.addEventListener("click", iniciarConvite);
      pular.addEventListener("click", finalizarVideo);
      controleSom.addEventListener("click", alternarSom);

      hotspotConfirmacao.addEventListener("click", abrirRsvp);
      hotspotLocalizacao.addEventListener("click", abrirLocalizacao);
      hotspotPresentes.addEventListener("click", abrirPresentes);
      hotspotFiltro.addEventListener("click", abrirFiltro);

      abrirGoogleMaps.addEventListener("click", () => abrirDestino(CONFIG.linkMapa));
      abrirWaze.addEventListener("click", () => { if (CONFIG.linkWaze) abrirDestino(CONFIG.linkWaze); });
      rsvpFrame.addEventListener("load", () => {
        if (rsvpFrame.src && rsvpFrame.src !== "about:blank") {
          rsvpFrame.classList.add("carregado");
        }
      });
      fecharRsvp.addEventListener("click", fecharRsvpModal);
      rsvpFallback.addEventListener("click", abrirRsvpExterno);
      modalRsvp.addEventListener("click", (event) => {
        if (event.target === modalRsvp) fecharRsvpModal();
      });

      fecharRecado.addEventListener("click", fecharRecadoModal);
      modalRecado.addEventListener("click", (event) => {
        if (event.target === modalRecado) fecharRecadoModal();
      });

      fecharLocalizacao.addEventListener("click", fecharLocalizacaoModal);

      modalLocalizacao.addEventListener("click", (event) => {
        if (event.target === modalLocalizacao) {
          fecharLocalizacaoModal();
        }
      });

      fecharPresentes.addEventListener("click", fecharPresentesModal);

      modalPresentes.addEventListener("click", (event) => {
        if (event.target === modalPresentes) {
          fecharPresentesModal();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;

        if (modalRsvp.classList.contains("aberto")) {
          fecharRsvpModal();
          return;
        }

        if (modalRecado.classList.contains("aberto")) {
          fecharRecadoModal();
          return;
        }

        if (modalPresentes.classList.contains("aberto")) {
          fecharPresentesModal();
          return;
        }

        if (modalLocalizacao.classList.contains("aberto")) {
          fecharLocalizacaoModal();
        }
      });

      video.addEventListener("timeupdate", () => {
        if (finalizando || finalAtivo) return;

        manterSincronia();

        if (
          Number.isFinite(video.duration) &&
          video.duration > 0 &&
          (video.duration - video.currentTime) <= 0.45
        ) {
          finalizarVideo();
        }
      });

      video.addEventListener("ended", finalizarVideo);

      video.addEventListener("error", () => {
        if (conviteAberto && !finalAtivo) {
          esconderCapa();
          finalizarVideo();
        }
      });

      musica.addEventListener("error", () => {
        audioDisponivel = false;
        controleSom.classList.remove("visivel");
      });

      document.addEventListener("visibilitychange", tratarVisibilidade);

      window.addEventListener("pageshow", (event) => {
        if (event.persisted && finalAtivo && audioDisponivel) {
          musica.volume = somLigado ? CONFIG.volumeMusica : 0;
          musica.play().catch(() => {});
        }
      });

      document.addEventListener("contextmenu", (event) => {
        event.preventDefault();
      });

      document.addEventListener("dragstart", (event) => {
        event.preventDefault();
      });
    }).catch((erro) => {
      console.error("[Libri] Falha ao iniciar convite:", erro);
      document.body.innerHTML = `<div style="min-height:100dvh;display:grid;place-items:center;background:#000;color:#fff;font:16px Arial;padding:24px;text-align:center">N&#227;o foi poss&#237;vel carregar o convite.</div>`;
    });
  </script>
</body>
</html>

  <script>
    /* ==================================================

    const CONFIG = {
      titulo: "Convite do Frederico",

      video: "https://midia.libriconvites.com.br/frederico/abertura.mp4?v=1",
      musica: "https://midia.libriconvites.com.br/frederico/musica-pooh.mp3?v=1",

      /*
         O vídeo pode ter 34 s, 40 s etc.
         O motor usa a duração REAL automaticamente.
      */
      inicioMusica: 0,
      volumeMusica: 0.35,
      tempoPular: 5000,

      linkLocalizacao: "https://maps.app.goo.gl/VyDaebhCdKtzMcHG8?g_st=iw",

      linkConfirmacao: "https://confirmar-libriconvites-com-br-235139281365.us-east1.run.app/confirmar/1-aninho-do-frederico",

      linkInstagram: "https://www.instagram.com/s/aGlnaGxpZ2h0OjE4MTQ2MDIyNzE4NDgzNzQz?story_media_id=3963056643062752175_11300432708&igsh=cXA4eWNvZHgyaDcx",

      hotspotsFinal: {
        localizacao: {
          left: "51%",

        },

    };

    /* ==================================================

  </script>

  <style>
    :root {
      --fundo: #000;
      --transicao-video: 240ms;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--fundo);
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    img,
    video {
      display: block;
      -webkit-user-drag: none;
      user-drag: none;
    }

    button {
      font: inherit;
      appearance: none;
      -webkit-appearance: none;
    }

    /* ==================================================
       TELA CHEIA 9:16 EM COVER
    ================================================== */

    .tela {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--fundo);
    }

    @supports (height: 100dvh) {
      .tela {
        height: 100dvh;
      }
    }

    .quadro {
      position: relative;
      width: max(100vw, calc(100vh * 9 / 16));
      height: max(100vh, calc(100vw * 16 / 9));
      flex: 0 0 auto;
      overflow: hidden;
      background: #000;
    }

    @supports (height: 100dvh) {
      .quadro {
        width: max(100vw, calc(100dvh * 9 / 16));
        height: max(100dvh, calc(100vw * 16 / 9));
      }
    }

    .arte,
    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ==================================================
       FINAL

       Fica pronto atrás do vídeo desde o começo.
       Assim não existe vídeo -> preto -> card.
    ================================================== */

    #finalTela {
      z-index: 20;
      visibility: visible;
      opacity: 1;
      pointer-events: none;
      background: #000;
    }

    #finalTela.ativo {
      pointer-events: auto;
    }

    /* ==================================================
       VÍDEO
    ================================================== */

    #videoTela {
      z-index: 30;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      background: transparent;
      transition: opacity var(--transicao-video) ease;
    }

    #videoTela.ativo {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    #videoTela.saindo {
      opacity: 0;
      pointer-events: none;
    }

    #video {
      background: transparent;
    }

    /* ==================================================
       CAPA
    ================================================== */

    #capaTela {
      z-index: 50;
      visibility: visible;
      opacity: 1;
      transition: opacity 180ms ease;
    }

    #capaTela.saindo {
      opacity: 0;
      pointer-events: none;
    }

    #abrirConvite {
      position: absolute;
      inset: 0;
      z-index: 100;
      width: 100%;
      height: 100%;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      cursor: pointer;
    }

    /* ==================================================
       PULAR
    ================================================== */

    #pular {
      position: absolute;
      right: 18px;
      bottom: max(90px, calc(env(safe-area-inset-bottom) + 70px));
      z-index: 200;

      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 999px;

      padding: 9px 14px;

      background: rgba(0, 0, 0, 0.48);
      color: #fff;

      font-size: 13px;

      cursor: pointer;

      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);

      opacity: 0;
      visibility: hidden;

      transition: opacity 160ms ease;
    }

    #pular.visivel {
      opacity: 1;
      visibility: visible;
    }

    /* ==================================================
       HOTSPOTS
    ================================================== */

    .hotspot {
      position: absolute;
      z-index: 300;
      display: block;

      padding: 0;
      margin: 0;
      border: 0;

      background: rgba(0, 0, 0, 0);

      cursor: pointer;

      pointer-events: auto;
      touch-action: manipulation;
    }

    /* ==================================================
       PÁGINA DO FILTRO
    ================================================== */

    #paginaFiltro {
      z-index: 500;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      background: #000;
      transition: opacity 160ms ease;
    }

    #paginaFiltro.ativa {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    /* ==================================================
       SOM
    ================================================== */

    #controleSom {
      position: absolute;

      top: max(14px, calc(env(safe-area-inset-top) + 8px));
      right: 14px;

      z-index: 400;

      width: 38px;
      height: 38px;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 0;

      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;

      background: rgba(0, 0, 0, 0.38);
      color: #fff;

      cursor: pointer;

      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    #controleSom.visivel {
      display: flex;
    }

    #controleSom svg {
      width: 20px;
      height: 20px;

      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;

      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #iconeMudo {
      display: none;
    }

    #controleSom.mudo #iconeSom {
      display: none;
    }

    #controleSom.mudo #iconeMudo {
      display: block;
    }
  </style>
</head>

<body>

  <!-- ==================================================
       CARD FINAL
       JÁ CARREGADO ATRÁS DO VÍDEO
  ================================================== -->

  <section id="finalTela" class="tela">
    <div class="quadro">

      <img
        id="finalImagem"

        src="imagens/final.jpg?v=1"

      >

        id="hotspotLocalizacao"

      <button

      <button
        id="hotspotFiltro"

        type="button"
        aria-label="Filtro do Instagram"
      ></button>

      <button
        id="controleSom"
        type="button"
        aria-label="Ativar ou silenciar música"
      >

        <svg id="iconeSom" viewBox="0 0 24 24">
          <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
          <path d="M16 9.5c.8.7 1.2 1.5 1.2 2.5s-.4 1.8-1.2 2.5"></path>
          <path d="M18.5 7c1.5 1.3 2.3 3 2.3 5s-.8 3.7-2.3 5"></path>

        <svg id="iconeMudo" viewBox="0 0 24 24">
          <path d="M4 9v6h4l5 4V5L8 9H4z"></path>

      </button>

  </section>


  <!-- ==================================================
       VÍDEO
  ================================================== -->

  <section id="videoTela" class="tela">
    <div class="quadro">

      <video
        id="video"
        src="https://midia.libriconvites.com.br/frederico/abertura.mp4?v=1"
        playsinline
        webkit-playsinline
        preload="auto"
        disablepictureinpicture
        controlslist="nodownload noplaybackrate noremoteplayback"
      ></video>

      <button
        id="pular"
        type="button"
        aria-label="Pular abertura"
      >
        Pular abertura
      </button>

  </section>


  <!-- ==================================================
       CAPA
  ================================================== -->

  <section id="capaTela" class="tela">
    <div class="quadro">

      <img
        class="arte"
        src="imagens/capa.jpg?v=1"
        alt="O Bosque Encantado do Frederico"
        draggable="false"
      >

      <button
        id="abrirConvite"
        type="button"
        aria-label="Abrir convite"
      ></button>

    </div>
  </section>


  <!-- ==================================================
       FILTRO DO INSTAGRAM
  ================================================== -->

  <section id="paginaFiltro" class="tela">
    <div class="quadro">

      <img
        id="imagemFiltro"
        class="arte"
        src="imagens/filtro.png?v=1"
        alt="Filtro do Instagram"
        draggable="false"
      >

      <button
        id="voltarFiltro"

        aria-label="Voltar"
      ></button>

      <button
        id="abrirInstagram"
        class="hotspot"
        type="button"
        aria-label="Ir para o Instagram"
      ></button>

    </div>

  <!-- ==================================================
       MÚSICA
  ================================================== -->

  <audio
    id="musica"
    src="https://midia.libriconvites.com.br/frederico/musica-pooh.mp3?v=1"
    preload="auto"
    loop
  ></audio>


  <script>
    (() => {
      "use strict";

      const capaTela = document.getElementById("capaTela");
      const videoTela = document.getElementById("videoTela");
      const finalTela = document.getElementById("finalTela");
      const paginaFiltro = document.getElementById("paginaFiltro");

      const finalImagem = document.getElementById("finalImagem");
      const imagemFiltro = document.getElementById("imagemFiltro");

      const video = document.getElementById("video");
      const musica = document.getElementById("musica");

      const abrirConvite = document.getElementById("abrirConvite");
      const pular = document.getElementById("pular");
      const controleSom = document.getElementById("controleSom");

      const hotspotLocalizacao = document.getElementById("hotspotLocalizacao");
      const hotspotConfirmacao = document.getElementById("hotspotConfirmacao");
      const hotspotFiltro = document.getElementById("hotspotFiltro");

      const voltarFiltro = document.getElementById("voltarFiltro");
      const abrirInstagram = document.getElementById("abrirInstagram");

      let conviteAberto = false;
      let finalAtivo = false;
      let finalizando = false;

      let somLigado = true;
      let audioDisponivel = true;

      let timerPular = null;
      let rafFim = null;

      let videoEstavaTocando = false;
      let musicaEstavaTocando = false;


      /* ==================================================
         PRÉ-DECODIFICAR
      ================================================== */

      function decodificarImagem(imagem) {
        if (
          imagem &&
          typeof imagem.decode === "function"
        ) {
          imagem.decode().catch(() => {});
        }
      }

      decodificarImagem(finalImagem);
      decodificarImagem(imagemFiltro);


      /* ==================================================
         HOTSPOTS
      ================================================== */

      function posicionar(elemento, dados) {
        elemento.style.left = dados.left;
        elemento.style.top = dados.top;
        elemento.style.width = dados.width;
        elemento.style.height = dados.height;
      }

      posicionar(
        hotspotLocalizacao,
        CONFIG.hotspotsFinal.localizacao
      );

      posicionar(
        hotspotConfirmacao,
        CONFIG.hotspotsFinal.confirmacao
      );

      posicionar(
        hotspotFiltro,
        CONFIG.hotspotsFinal.filtro
      );

      posicionar(
        voltarFiltro,
        CONFIG.hotspotsFiltro.voltar
      );

      posicionar(
        abrirInstagram,
        CONFIG.hotspotsFiltro.instagram
      );


      /* ==================================================
         ÁUDIO
      ================================================== */

      function iniciarMusicaSilenciosa() {
        musica.volume = 0.001;

        const tentativa = musica.play();

        if (
          tentativa &&
          typeof tentativa.catch === "function"
        ) {
          tentativa.catch(() => {
            audioDisponivel = false;
          });
        }
      }


      function continuarMusica(tempoVideo) {
        if (!audioDisponivel) return;

        let tempo = Math.max(
          0,
          tempoVideo + CONFIG.inicioMusica
        );

        if (
          Number.isFinite(musica.duration) &&
          musica.duration > 0
        ) {
          tempo %= musica.duration;
        }

        try {
          musica.currentTime = tempo;
        } catch (_) {}

        musica.volume =
          somLigado
            ? CONFIG.volumeMusica
            : 0;

        musica.play().catch(() => {
          audioDisponivel = false;
          controleSom.classList.remove("visivel");
        });
      }


      /* ==================================================
         CAPA
      ================================================== */

      function esconderCapa() {
        if (
          capaTela.classList.contains(
            "saindo"
          )
        ) {
          return;
        }

        capaTela.classList.add(
          "saindo"
        );

        setTimeout(() => {
          capaTela.style.visibility =
            "hidden";
        }, 200);
      }


      /* ==================================================
         ABRIR
      ================================================== */

      async function iniciarConvite() {
        if (conviteAberto) return;

        conviteAberto = true;

        videoTela.style.visibility =
          "visible";

        videoTela.classList.remove(
          "saindo"
        );

        videoTela.classList.add(
          "ativo"
        );

        iniciarMusicaSilenciosa();

        try {
          await video.play();
        } catch (_) {
          finalizarVideo();
          esconderCapa();
          return;
        }

        esconderCapa();

        pular.classList.add(
          "visivel"
        );

        clearTimeout(timerPular);

        timerPular = setTimeout(() => {
          pular.classList.remove(
            "visivel"
          );
        }, CONFIG.tempoPular);

        acompanharFinalVideo();
      }


      /* ==================================================
         VÍDEO → FINAL SEM TELA PRETA

         Não importa se o vídeo tem 6, 34 ou 60 segundos.
         A duração é lida diretamente do arquivo.
      ================================================== */

      function acompanharFinalVideo() {
        cancelAnimationFrame(rafFim);

        const verificar = () => {
          if (
            finalizando ||
            finalAtivo
          ) {
            return;
          }

          if (
            Number.isFinite(video.duration) &&
            video.duration > 0
          ) {
            const restante =
              video.duration -
              video.currentTime;

            if (
              restante > 0 &&
              restante <= 0.40
            ) {
              finalizarVideo();
              return;
            }
          }

          rafFim =
            requestAnimationFrame(
              verificar
            );
        };

        rafFim =
          requestAnimationFrame(
            verificar
          );
      }


      function finalizarVideo() {
        if (
          finalizando ||
          finalAtivo
        ) {
          return;
        }

        finalizando = true;

        clearTimeout(timerPular);
        cancelAnimationFrame(rafFim);

        pular.classList.remove(
          "visivel"
        );

        /*
           O card já está atrás do vídeo.
           Ativamos os hotspots e retiramos
           somente a camada de vídeo.
        */
        finalTela.classList.add(
          "ativo"
        );

        const tempoVideo =
          Number.isFinite(
            video.currentTime
          )
            ? video.currentTime
            : 0;

        videoTela.classList.add(
          "saindo"
        );

        setTimeout(() => {
          video.pause();

          videoTela.classList.remove(
            "ativo"
          );

          videoTela.classList.remove(
            "saindo"
          );

          videoTela.style.visibility =
            "hidden";

          finalAtivo = true;
          finalizando = false;

          continuarMusica(
            tempoVideo
          );

          if (audioDisponivel) {
            controleSom.classList.add(
              "visivel"
            );
          }
        }, 250);
      }


      /* ==================================================
         FILTRO
      ================================================== */

      function abrirPaginaFiltro() {
        paginaFiltro.classList.add(
          "ativa"
        );

        controleSom.classList.remove(
          "visivel"
        );
      }


      function fecharPaginaFiltro() {
        paginaFiltro.classList.remove(
          "ativa"
        );

        if (
          finalAtivo &&
          audioDisponivel
        ) {
          controleSom.classList.add(
            "visivel"
          );
        }
      }


      /* ==================================================
         LINKS
      ================================================== */

      function abrirLink(link) {
        if (!link) return;
        window.location.href = link;
      }


      /* ==================================================
         SOM
      ================================================== */

      function alternarSom() {
        if (!audioDisponivel) return;

        somLigado = !somLigado;

        musica.volume =
          somLigado
            ? CONFIG.volumeMusica
            : 0;

        controleSom.classList.toggle(
          "mudo",
          !somLigado
        );
      }


      /* ==================================================
         VISIBILIDADE
      ================================================== */

      function tratarVisibilidade() {
        if (document.hidden) {
          videoEstavaTocando =
            !video.paused &&
            !finalAtivo &&
            !finalizando;

          musicaEstavaTocando =
            !musica.paused;

          if (videoEstavaTocando) {
            video.pause();
          }

          if (musicaEstavaTocando) {
            musica.pause();
          }

          return;
        }

        if (
          videoEstavaTocando &&
          !finalAtivo
        ) {
          video
            .play()
            .then(
              acompanharFinalVideo
            )
            .catch(() => {});
        }

        if (
          musicaEstavaTocando &&
          audioDisponivel
        ) {
          musica
            .play()
            .catch(() => {});
        }

        videoEstavaTocando = false;
        musicaEstavaTocando = false;
      }


      /* ==================================================
         EVENTOS
      ================================================== */

      abrirConvite.addEventListener(
        "click",
        iniciarConvite
      );

      pular.addEventListener(
        "click",
        finalizarVideo
      );

      video.addEventListener(
        "playing",
        esconderCapa
      );

      video.addEventListener(
        "timeupdate",
        () => {
          if (
            finalizando ||
            finalAtivo
          ) {
            return;
          }

          if (
            Number.isFinite(
              video.duration
            ) &&
            video.duration > 0
          ) {
            const restante =
              video.duration -
              video.currentTime;

            if (restante <= 0.40) {
              finalizarVideo();
            }
          }
        }
      );

      video.addEventListener(
        "ended",
        finalizarVideo
      );


      /*
         CARD FINAL
      */

      hotspotLocalizacao.addEventListener(
        "click",
        event => {
          event.preventDefault();
          event.stopPropagation();

          abrirLink(
            CONFIG.linkLocalizacao
          );
        }
      );

      hotspotConfirmacao.addEventListener(
        "click",
        event => {
          event.preventDefault();
          event.stopPropagation();

          abrirLink(
            CONFIG.linkConfirmacao
          );
        }
      );

      hotspotFiltro.addEventListener(
        "click",
        event => {
          event.preventDefault();
          event.stopPropagation();

          abrirPaginaFiltro();
        }
      );


      /*
         PÁGINA FILTRO
      */

      voltarFiltro.addEventListener(
        "click",
        fecharPaginaFiltro
      );

      abrirInstagram.addEventListener(
        "click",
        () => {
          abrirLink(
            CONFIG.linkInstagram
          );
        }
      );


      /*
         SOM
      */

      controleSom.addEventListener(
        "click",
        alternarSom
      );


      /*
         VISIBILIDADE
      */

      document.addEventListener(
        "visibilitychange",
        tratarVisibilidade
      );


      /*
         BLOQUEIOS CASUAIS
      */

      document.addEventListener(
        "contextmenu",
        event => {
          event.preventDefault();
        }
      );

      document.addEventListener(
        "dragstart",
        event => {
          event.preventDefault();
        }
      );

    })();
  </script>

</body>

  <script>

    (() => {

      "use strict";


      /* ==================================================
         ELEMENTOS
      ================================================== */

      const capaTela =
        document.getElementById(
          "capaTela"
        );


      const videoTela =
        document.getElementById(
          "videoTela"
        );


      const finalTela =
        document.getElementById(
          "finalTela"
        );


      const paginaFiltro =
        document.getElementById(
          "paginaFiltro"
        );


      const finalImagem =
        document.getElementById(
          "finalImagem"
        );


      const imagemFiltro =
        document.getElementById(
          "imagemFiltro"
        );


      const video =
        document.getElementById(
          "video"
        );


      const musica =
        document.getElementById(
          "musica"
        );


      const abrirConvite =
        document.getElementById(
          "abrirConvite"
        );


      const pular =
        document.getElementById(
          "pular"
        );


      const controleSom =
        document.getElementById(
          "controleSom"
        );


      const hotspotLocalizacao =
        document.getElementById(
          "hotspotLocalizacao"
        );


      const hotspotConfirmacao =
        document.getElementById(
          "hotspotConfirmacao"
        );


      const hotspotFiltro =
        document.getElementById(
          "hotspotFiltro"
        );


      const voltarFiltro =
        document.getElementById(
          "voltarFiltro"
        );


      const abrirInstagram =
        document.getElementById(
          "abrirInstagram"
        );


      /* ==================================================
         ESTADO
      ================================================== */

      let conviteAberto =
        false;


      let finalAtivo =
        false;


      let finalizando =
        false;


      let somLigado =
        true;


      let audioDisponivel =
        true;


      let timerPular =
        null;


      let rafFim =
        null;


      let rafAudio =
        null;


      let ultimoAjusteSincronia =
        0;


      let videoEstavaTocando =
        false;


      let musicaEstavaTocando =
        false;


      /* ==================================================
         PRÉ-CARREGAR
      ================================================== */

      function decodificarImagem(
        imagem
      ) {

        if (
          imagem
          &&
          typeof imagem.decode ===
          "function"
        ) {

          imagem
            .decode()
            .catch(
              () => {}
            );

        }

      }


      decodificarImagem(
        finalImagem
      );


      decodificarImagem(
        imagemFiltro
      );


      /* ==================================================
         HOTSPOTS
      ================================================== */

      function posicionar(
        elemento,
        dados
      ) {

        elemento.style.left =
          dados.left;


        elemento.style.top =
          dados.top;


        elemento.style.width =
          dados.width;


        elemento.style.height =
          dados.height;

      }


      posicionar(
        hotspotLocalizacao,
        CONFIG.hotspotsFinal.localizacao
      );


      posicionar(
        hotspotConfirmacao,
        CONFIG.hotspotsFinal.confirmacao
      );


      posicionar(
        hotspotFiltro,
        CONFIG.hotspotsFinal.filtro
      );


      posicionar(
        voltarFiltro,
        CONFIG.hotspotsFiltro.voltar
      );


      posicionar(
        abrirInstagram,
        CONFIG.hotspotsFiltro.instagram
      );


      /* ==================================================
         CAPA
      ================================================== */

      function esconderCapa() {

        if (
          capaTela
            .classList
            .contains(
              "saindo"
            )
        ) {

          return;

        }


        capaTela
          .classList
          .add(
            "saindo"
          );


        setTimeout(
          () => {

            capaTela.style.visibility =
              "hidden";

          },
          200
        );

      }


      /* ==================================================
         MÚSICA CONTÍNUA

         O MP3 começa no mesmo toque que o vídeo
         e permanece tocando em volume quase zero.
      ================================================== */

      function iniciarMusicaSilenciosa() {

        musica.volume =
          0.001;


        try {

          musica.currentTime =
            Math.max(
              0,
              CONFIG.inicioMusica
            );

        }

        catch (_) {}


        const tentativa =
          musica.play();


        if (
          tentativa
          &&
          typeof tentativa.catch ===
          "function"
        ) {

          tentativa.catch(
            () => {

              audioDisponivel =
                false;

            }
          );

        }

      }


      /* ==================================================
         SINCRONIA DURANTE O VÍDEO

         Se houver drift, corrige enquanto
         a música está inaudível.

         NÃO corrige na entrada do card.
      ================================================== */

      function manterSincronia() {

        if (
          !audioDisponivel
          ||
          finalAtivo
          ||
          finalizando
          ||
          video.paused
          ||
          musica.paused
        ) {

          return;

        }


        const agora =
          performance.now();


        if (
          agora
          -
          ultimoAjusteSincronia
          <
          1000
        ) {

          return;

        }


        ultimoAjusteSincronia =
          agora;


        const esperado =
          video.currentTime
          +
          CONFIG.inicioMusica;


        const diferenca =
          Math.abs(
            musica.currentTime
            -
            esperado
          );


        if (
          diferenca > 0.35
        ) {

          try {

            musica.currentTime =
              esperado;

          }

          catch (_) {}

        }

      }


      /* ==================================================
         TROCA SUAVE DE ÁUDIO

         Vídeo ↓
         MP3 ↑

         Sem reiniciar música.
      ================================================== */

      function transicaoSuaveAudio(
        aoFinalizar
      ) {

        cancelAnimationFrame(
          rafAudio
        );


        if (
          !audioDisponivel
        ) {

          video.volume =
            0;


          aoFinalizar();


          return;

        }


        const duracao =
          Math.max(
            120,
            CONFIG.transicaoAudio
          );


        const inicio =
          performance.now();


        const volumeVideoInicial =
          video.volume;


        const volumeMusicaInicial =
          musica.volume;


        const volumeMusicaFinal =
          somLigado
            ?
            CONFIG.volumeMusica
            :
            0;


        const animar =
          agora => {

            const progresso =
              Math.min(
                1,
                (
                  agora
                  -
                  inicio
                )
                /
                duracao
              );


            const suave =
              progresso
              *
              progresso
              *
              (
                3
                -
                2
                *
                progresso
              );


            video.volume =
              Math.max(
                0,
                volumeVideoInicial
                *
                (
                  1
                  -
                  suave
                )
              );


            musica.volume =
              volumeMusicaInicial
              +
              (
                volumeMusicaFinal
                -
                volumeMusicaInicial
              )
              *
              suave;


            if (
              progresso < 1
            ) {

              rafAudio =
                requestAnimationFrame(
                  animar
                );


              return;

            }


            video.volume =
              0;


            musica.volume =
              volumeMusicaFinal;


            aoFinalizar();

          };


        rafAudio =
          requestAnimationFrame(
            animar
          );

      }


      /* ==================================================
         ABRIR CONVITE
      ================================================== */

      async function iniciarConvite() {

        if (
          conviteAberto
        ) {

          return;

        }


        conviteAberto =
          true;


        videoTela.style.visibility =
          "visible";


        videoTela
          .classList
          .remove(
            "saindo"
          );


        videoTela
          .classList
          .add(
            "ativo"
          );


        iniciarMusicaSilenciosa();


        video.volume =
          1;


        try {

          await video.play();

        }

        catch (_) {

          finalizarVideo();

          esconderCapa();

          return;

        }


        esconderCapa();


        pular
          .classList
          .add(
            "visivel"
          );


        clearTimeout(
          timerPular
        );


        timerPular =
          setTimeout(
            () => {

              pular
                .classList
                .remove(
                  "visivel"
                );

            },
            CONFIG.tempoPular
          );


        acompanharFinal();

      }


      /* ==================================================
         VÍDEO → FINAL
      ================================================== */

      function acompanharFinal() {

        cancelAnimationFrame(
          rafFim
        );


        const verificar =
          () => {

            if (
              finalizando
              ||
              finalAtivo
            ) {

              return;

            }


            manterSincronia();


            if (
              Number.isFinite(
                video.duration
              )
              &&
              video.duration > 0
            ) {

              const restante =
                video.duration
                -
                video.currentTime;


              if (
                restante > 0
                &&
                restante <= 0.45
              ) {

                finalizarVideo();

                return;

              }

            }


            rafFim =
              requestAnimationFrame(
                verificar
              );

          };


        rafFim =
          requestAnimationFrame(
            verificar
          );

      }


      /* ==================================================
         FINAL SEM CORTE NA MÚSICA
      ================================================== */

      function finalizarVideo() {

        if (
          finalizando
          ||
          finalAtivo
        ) {

          return;

        }


        finalizando =
          true;


        clearTimeout(
          timerPular
        );


        cancelAnimationFrame(
          rafFim
        );


        pular
          .classList
          .remove(
            "visivel"
          );


        finalTela
          .classList
          .add(
            "ativo"
          );


        videoTela
          .classList
          .add(
            "saindo"
          );


        /*
           NÃO mexemos em:
           musica.currentTime
           musica.play()

           Ela já está tocando.
        */

        transicaoSuaveAudio(
          () => {

            video.pause();


            videoTela
              .classList
              .remove(
                "ativo"
              );


            videoTela
              .classList
              .remove(
                "saindo"
              );


            videoTela.style.visibility =
              "hidden";


            video.volume =
              1;


            finalAtivo =
              true;


            finalizando =
              false;


            if (
              audioDisponivel
            ) {

              controleSom
                .classList
                .add(
                  "visivel"
                );

            }

          }
        );

      }


      /* ==================================================
         FILTRO
      ================================================== */

      function abrirPaginaFiltro() {

        paginaFiltro
          .classList
          .add(
            "ativa"
          );


        controleSom
          .classList
          .remove(
            "visivel"
          );

      }


      function fecharPaginaFiltro() {

        paginaFiltro
          .classList
          .remove(
            "ativa"
          );


        if (
          finalAtivo
          &&
          audioDisponivel
        ) {

          controleSom
            .classList
            .add(
              "visivel"
            );

        }

      }


      /* ==================================================
         LINKS
      ================================================== */

      function abrirLink(
        link
      ) {

        if (
          !link
        ) {

          return;

        }


        window.location.href =
          link;

      }


      /* ==================================================
         SOM
      ================================================== */

      function alternarSom() {

        if (
          !audioDisponivel
        ) {

          return;

        }


        somLigado =
          !somLigado;


        musica.volume =
          somLigado
            ?
            CONFIG.volumeMusica
            :
            0;


        controleSom
          .classList
          .toggle(
            "mudo",
            !somLigado
          );

      }


      /* ==================================================
         VISIBILIDADE
      ================================================== */

      function tratarVisibilidade() {

        if (
          document.hidden
        ) {

          videoEstavaTocando =
            !video.paused
            &&
            !finalAtivo
            &&
            !finalizando;


          musicaEstavaTocando =
            !musica.paused;


          if (
            videoEstavaTocando
          ) {

            video.pause();

          }


          if (
            musicaEstavaTocando
          ) {

            musica.pause();

          }


          return;

        }


        if (
          videoEstavaTocando
          &&
          !finalAtivo
        ) {

          video
            .play()
            .then(
              acompanharFinal
            )
            .catch(
              () => {}
            );

        }


        if (
          musicaEstavaTocando
          &&
          audioDisponivel
        ) {

          musica
            .play()
            .catch(
              () => {}
            );

        }


        videoEstavaTocando =
          false;


        musicaEstavaTocando =
          false;

      }


      /* ==================================================
         EVENTOS
      ================================================== */

      abrirConvite
        .addEventListener(
          "click",
          iniciarConvite
        );


      pular
        .addEventListener(
          "click",
          finalizarVideo
        );


      video
        .addEventListener(
          "playing",
          esconderCapa
        );


      video
        .addEventListener(
          "timeupdate",
          () => {

            if (
              finalizando
              ||
              finalAtivo
            ) {

              return;

            }


            manterSincronia();


            if (
              Number.isFinite(
                video.duration
              )
              &&
              video.duration > 0
              &&
              (
                video.duration
                -
                video.currentTime
              )
              <=
              0.45
            ) {

              finalizarVideo();

            }

          }
        );


      video
        .addEventListener(
          "ended",
          finalizarVideo
        );


      /* ==================================================
         CARD FINAL
      ================================================== */

      hotspotLocalizacao
        .addEventListener(
          "click",
          event => {

            event.preventDefault();

            event.stopPropagation();


            abrirLink(
              CONFIG.linkLocalizacao
            );

          }
        );


      hotspotConfirmacao
        .addEventListener(
          "click",
          event => {

            event.preventDefault();

            event.stopPropagation();


            abrirLink(
              CONFIG.linkConfirmacao
            );

          }
        );


      hotspotFiltro
        .addEventListener(
          "click",
          event => {

            event.preventDefault();

            event.stopPropagation();


            abrirPaginaFiltro();

          }
        );


      /* ==================================================
         FILTRO
      ================================================== */

      voltarFiltro
        .addEventListener(
          "click",
          fecharPaginaFiltro
        );


      abrirInstagram
        .addEventListener(
          "click",
          () => {

            abrirLink(
              CONFIG.linkInstagram
            );

          }
        );


      /* ==================================================
         SOM
      ================================================== */

      controleSom
        .addEventListener(
          "click",
          alternarSom
        );


      /* ==================================================
         APP
      ================================================== */

      document
        .addEventListener(
          "visibilitychange",
          tratarVisibilidade
        );


      /* ==================================================
         BLOQUEIOS CASUAIS
      ================================================== */

      document
        .addEventListener(
          "contextmenu",
          event => {

            event.preventDefault();

          }
        );


      document
        .addEventListener(
          "dragstart",
          event => {

            event.preventDefault();

          }
        );


    })();

  </script>

</body>

</html>

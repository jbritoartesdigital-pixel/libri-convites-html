  <script>

    (function prepararImagens() {

      const arquivos = [
        CONFIG.capaArquivo,
        CONFIG.finalArquivo,
        CONFIG.presentesArquivo
      ];


      arquivos.forEach(function(arquivo) {

        const link =
          document.createElement("link");

        link.rel =
          "preload";

        link.as =
          "image";

        link.href =
          arquivo +
          "?v=" +
          encodeURIComponent(
            CONFIG.versaoArquivos
          );

        document.head.appendChild(link);

      });

    })();

  </script>

  <script>


    /* ==================================================
       MOTOR DO CONVITE
       ================================================== */


    document.title =
      CONFIG.tituloPagina;



    /* ELEMENTOS */

    const capa =
      document.getElementById("capa");

    const video =
      document.getElementById("video");

    const musica =
      document.getElementById("musica");

    const videoTela =
      document.getElementById("videoTela");

    const carregando =
      document.getElementById("carregando");

    const pular =
      document.getElementById("pular");

    const erroVideo =
      document.getElementById("erroVideo");

    const finalTela =
      document.getElementById("finalTela");

    const final =
      document.getElementById("final");

    const popupPresentes =
      document.getElementById("popupPresentes");

    const imagemPresentes =
      document.getElementById("imagemPresentes");

    const botaoPresentes =
      document.getElementById("botaoPresentes");

    const botaoConfirmar =
      document.getElementById("botaoConfirmar");

    const botaoLocalizacao =
      document.getElementById("botaoLocalizacao");

    const controleSom =
      document.getElementById("controleSom");

    const iconeSomLigado =
      document.getElementById("iconeSomLigado");

    const iconeSomDesligado =
      document.getElementById("iconeSomDesligado");



    /* ESTADO */

    let temporizadorPularIniciado =
      false;

    let conviteFinalAberto =
      false;

    let musicaSilenciadaPeloUsuario =
      false;

    let musicaDisponivel =
      true;

    let retomarMusicaAoVoltar =
      false;

    let retomarVideoAoVoltar =
      false;



    /* ==================================================
       URLS
       ================================================== */

    function arquivoLocal(arquivo) {

      const separador =
        arquivo.includes("?")
          ? "&"
          : "?";


      return (
        arquivo
        +
        separador
        +
        "v="
        +
        encodeURIComponent(
          CONFIG.versaoArquivos
        )
      );

    }



    function caminhoSeguro(valor) {

      return String(valor)
        .split("/")
        .filter(Boolean)
        .map(
          function(parte) {

            return encodeURIComponent(parte);

          }
        )
        .join("/");

    }



    function urlMidia(arquivo) {

      const host =
        CONFIG.hostMidia
          .replace(/\/+$/, "");


      const pasta =
        caminhoSeguro(
          CONFIG.pastaCliente
        );


      const nome =
        caminhoSeguro(
          arquivo
        );


      return (
        host
        +
        "/"
        +
        pasta
        +
        "/"
        +
        nome
      );

    }



    /* ==================================================
       CONFIGURAÇÕES
       ================================================== */

    function aplicarConfiguracoes() {

      capa.src =
        arquivoLocal(
          CONFIG.capaArquivo
        );


      final.src =
        arquivoLocal(
          CONFIG.finalArquivo
        );


      imagemPresentes.src =
        arquivoLocal(
          CONFIG.presentesArquivo
        );


      video.src =
        urlMidia(
          CONFIG.videoArquivo
        );


      musica.src =
        urlMidia(
          CONFIG.musicaArquivo
        );


      musica.volume =
        0.001;


      const botoes =
        CONFIG.botoes;


      const todosBotoes = [

        botaoPresentes,

        botaoConfirmar,

        botaoLocalizacao

      ];


      todosBotoes.forEach(

        function(botao) {

          botao.style.left =
            botoes.esquerda;

          botao.style.width =
            botoes.largura;

          botao.style.height =
            botoes.altura;

        }

      );


      botaoPresentes.style.top =
        botoes.presentesTopo;


      botaoConfirmar.style.top =
        botoes.confirmarTopo;


      botaoLocalizacao.style.top =
        botoes.localizacaoTopo;

    }


    aplicarConfiguracoes();



    /* ==================================================
       PRELOAD EXTRA
       ================================================== */

    function prepararImagensFinais() {

      const imagens = [

        arquivoLocal(
          CONFIG.finalArquivo
        ),

        arquivoLocal(
          CONFIG.presentesArquivo
        )

      ];


      imagens.forEach(

        function(src) {

          const imagem =
            new Image();

          imagem.src =
            src;

        }

      );

    }


    prepararImagensFinais();



    /* ==================================================
       DISPONIBILIDADE DO ÁUDIO
       ================================================== */

    musica.addEventListener(

      "error",

      function() {

        musicaDisponivel =
          false;

        controleSom.style.display =
          "none";

      }

    );


    musica.addEventListener(

      "canplay",

      function() {

        musicaDisponivel =
          true;

      }

    );



    /* ==================================================
       TEMPO DA MÚSICA
       ================================================== */

    function tempoDaMusica() {

      let tempo =
        CONFIG.inicioMusica
        +
        video.currentTime;


      if (
        Number.isFinite(
          musica.duration
        )
        &&
        musica.duration > 0
      ) {

        const trechoDisponivel =
          musica.duration
          -
          CONFIG.inicioMusica;


        if (
          trechoDisponivel > 0
          &&
          tempo >= musica.duration
        ) {

          tempo =
            CONFIG.inicioMusica
            +
            (
              (
                tempo
                -
                CONFIG.inicioMusica
              )
              %
              trechoDisponivel
            );

        }

      }


      return tempo;

    }



    /* ==================================================
       SINCRONIZAÇÃO
       ================================================== */

    function sincronizarMusica() {

      if (
        !musicaDisponivel
      ) {

        return;

      }


      const tempo =
        tempoDaMusica();


      const diferenca =
        Math.abs(
          musica.currentTime
          -
          tempo
        );


      if (
        diferenca > 0.30
      ) {

        try {

          musica.currentTime =
            tempo;

        }
        catch (erro) {

        }

      }

    }



    /* ==================================================
       ABRIR CONVITE
       ================================================== */

    function abrirConvite() {

      capa.style.display =
        "none";


      videoTela.style.display =
        "block";


      pular.style.display =
        "none";


      mostrarCarregando();


      try {

        video.currentTime =
          0;


        musica.currentTime =
          CONFIG.inicioMusica;

      }
      catch (erro) {

      }


      if (
        musicaDisponivel
      ) {

        musica.volume =
          0.001;


        musica
          .play()
          .catch(
            function() {

            }
          );

      }


      video
        .play()
        .catch(

          function() {

            esconderCarregando();


            erroVideo.style.display =
              "flex";

          }

        );

    }



    /* ==================================================
       VÍDEO TOCANDO
       ================================================== */

    function aoVideoTocar() {

      esconderCarregando();


      if (
        musicaDisponivel
      ) {

        sincronizarMusica();


        musica.volume =
          0.001;


        if (
          musica.paused
        ) {

          musica
            .play()
            .catch(
              function() {

              }
            );

        }

      }


      if (
        !temporizadorPularIniciado
      ) {

        temporizadorPularIniciado =
          true;


        pular.style.display =
          "block";


        setTimeout(

          function() {

            pular.style.display =
              "none";

          },

          CONFIG.tempoPular

        );

      }

    }



    /* ==================================================
       VÍDEO CARREGANDO
       ================================================== */

    function aoVideoEsperar() {

      mostrarCarregando();

    }



    function mostrarCarregando() {

      carregando.style.display =
        "flex";

    }



    function esconderCarregando() {

      carregando.style.display =
        "none";

    }



    /* ==================================================
       ERRO DO VÍDEO
       ================================================== */

    function erroAoCarregarVideo() {

      esconderCarregando();


      pular.style.display =
        "none";


      if (
        musicaDisponivel
      ) {

        musica.pause();

      }


      erroVideo.style.display =
        "flex";

    }



    /* ==================================================
       CARD FINAL
       ================================================== */

    function mostrarFinal() {

      if (
        conviteFinalAberto
      ) {

        return;

      }


      conviteFinalAberto =
        true;


      const pontoExato =
        tempoDaMusica();


      video.pause();


      if (
        musicaDisponivel
      ) {

        try {

          musica.currentTime =
            pontoExato;

        }
        catch (erro) {

        }


        musica.volume =
          musicaSilenciadaPeloUsuario
            ? 0
            : CONFIG.volumeMusica;


        musica
          .play()
          .then(

            function() {

              if (
                musicaDisponivel
              ) {

                controleSom.style.display =
                  "flex";

              }

            }

          )
          .catch(

            function() {

              musicaDisponivel =
                false;


              controleSom.style.display =
                "none";

            }

          );

      }
      else {

        controleSom.style.display =
          "none";

      }


      esconderCarregando();


      erroVideo.style.display =
        "none";


      pular.style.display =
        "none";


      videoTela.style.display =
        "none";


      finalTela.style.display =
        "block";

    }



    /* ==================================================
       PULAR ABERTURA
       ================================================== */

    function pularAbertura() {

      mostrarFinal();

    }



    /* ==================================================
       CONTROLE DE SOM
       ================================================== */

    function atualizarIconeSom() {

      if (
        musicaSilenciadaPeloUsuario
      ) {

        iconeSomLigado.style.display =
          "none";


        iconeSomDesligado.style.display =
          "block";


        controleSom.setAttribute(
          "aria-label",
          "Ativar música"
        );

      }
      else {

        iconeSomLigado.style.display =
          "block";


        iconeSomDesligado.style.display =
          "none";


        controleSom.setAttribute(
          "aria-label",
          "Silenciar música"
        );

      }

    }



    function alternarSom() {

      if (
        !musicaDisponivel
      ) {

        controleSom.style.display =
          "none";

        return;

      }


      musicaSilenciadaPeloUsuario =
        !musicaSilenciadaPeloUsuario;


      if (
        musicaSilenciadaPeloUsuario
      ) {

        musica.volume =
          0;

      }
      else {

        musica.volume =
          CONFIG.volumeMusica;


        if (
          musica.paused
        ) {

          musica
            .play()
            .catch(

              function() {

                musicaDisponivel =
                  false;


                controleSom.style.display =
                  "none";

              }

            );

        }

      }


      atualizarIconeSom();

    }



    /* ==================================================
       SEGUNDO PLANO
       ================================================== */

    function pausarMidiaAoSair() {

      retomarMusicaAoVoltar =
        musicaDisponivel
        &&
        !musica.paused;


      retomarVideoAoVoltar =
        !video.paused
        &&
        !video.ended;


      if (
        retomarMusicaAoVoltar
      ) {

        musica.pause();

      }


      if (
        retomarVideoAoVoltar
      ) {

        video.pause();

      }

    }



    function retomarMidiaAoVoltar() {

      if (
        document.hidden
      ) {

        return;

      }


      if (
        conviteFinalAberto
      ) {

        if (
          retomarMusicaAoVoltar
          &&
          musicaDisponivel
        ) {

          musica.volume =
            musicaSilenciadaPeloUsuario
              ? 0
              : CONFIG.volumeMusica;


          musica
            .play()
            .catch(

              function() {

                musicaDisponivel =
                  false;


                controleSom.style.display =
                  "none";

              }

            );

        }


        retomarMusicaAoVoltar =
          false;


        retomarVideoAoVoltar =
          false;


        return;

      }


      if (
        videoTela.style.display ===
        "block"
      ) {

        if (
          retomarMusicaAoVoltar
          &&
          musicaDisponivel
        ) {

          sincronizarMusica();


          musica.volume =
            0.001;


          musica
            .play()
            .catch(

              function() {

                musicaDisponivel =
                  false;

              }

            );

        }


        if (
          retomarVideoAoVoltar
        ) {

          video
            .play()
            .catch(
              function() {

              }
            );

        }

      }


      retomarMusicaAoVoltar =
        false;


      retomarVideoAoVoltar =
        false;

    }



    document.addEventListener(

      "visibilitychange",

      function() {

        if (
          document.hidden
        ) {

          pausarMidiaAoSair();

        }
        else {

          retomarMidiaAoVoltar();

        }

      }

    );



    window.addEventListener(

      "pageshow",

      function() {

        retomarMidiaAoVoltar();

      }

    );



    /* ==================================================
       LOOP DA MÚSICA
       ================================================== */

    musica.addEventListener(

      "ended",

      function() {

        if (
          !musicaDisponivel
        ) {

          return;

        }


        try {

          musica.currentTime =
            CONFIG.inicioMusica;

        }
        catch (erro) {

        }


        musica
          .play()
          .catch(

            function() {

              musicaDisponivel =
                false;


              controleSom.style.display =
                "none";

            }

          );

      }

    );



    /* ==================================================
       PRESENTES
       ================================================== */

    function abrirPresentes() {

      popupPresentes.style.display =
        "flex";


      controleSom.style.display =
        "none";

    }



    function fecharPresentes(event) {

      if (event) {

        event.stopPropagation();

      }


      popupPresentes.style.display =
        "none";


      if (
        conviteFinalAberto
        &&
        musicaDisponivel
      ) {

        controleSom.style.display =
          "flex";

      }

    }



    function fecharAoClicarFora(event) {

      if (
        event.target ===
        popupPresentes
      ) {

        fecharPresentes();

      }

    }



    /* ==================================================
       WHATSAPP
       ================================================== */

    function abrirWhatsApp() {

      const link =
        "https://wa.me/"
        +
        CONFIG.numeroWhatsapp
        +
        "?text="
        +
        encodeURIComponent(
          CONFIG.mensagemWhatsapp
        );


      window.location.href =
        link;

    }



    /* ==================================================
       MAPA
       ================================================== */

    function abrirLocalizacao() {

      window.location.href =
        CONFIG.linkMapa;

    }



    /* ==================================================
       EVITAR MENU DE LONG PRESS
       ================================================== */

    document.addEventListener(

      "contextmenu",

      function(event) {

        const alvo =
          event.target;


        if (
          alvo instanceof HTMLImageElement
          ||
          alvo instanceof HTMLVideoElement
        ) {

          event.preventDefault();

        }

      }

    );

  </script>

</body>

  <script>


    document.title =
      CONFIG.tituloPagina;


    const capa =
      document.getElementById("capa");

    const video =
      document.getElementById("video");

    const musica =
      document.getElementById("musica");

    const videoTela =
      document.getElementById("videoTela");

    const carregando =
      document.getElementById("carregando");

    const pular =
      document.getElementById("pular");

    const erroVideo =
      document.getElementById("erroVideo");

    const finalTela =
      document.getElementById("finalTela");

    const final =
      document.getElementById("final");

    const popupPresentes =
      document.getElementById("popupPresentes");

    const imagemPresentes =
      document.getElementById("imagemPresentes");

    const botaoPresentes =
      document.getElementById("botaoPresentes");

    const botaoConfirmar =
      document.getElementById("botaoConfirmar");

    const botaoLocalizacao =
      document.getElementById("botaoLocalizacao");

    const controleSom =
      document.getElementById("controleSom");

    const iconeSomLigado =
      document.getElementById("iconeSomLigado");

    const iconeSomDesligado =
      document.getElementById("iconeSomDesligado");


    let temporizadorPularIniciado =
      false;

    let conviteFinalAberto =
      false;

    let musicaSilenciada =
      false;

    let musicaDisponivel =
      true;

    let retomarMusica =
      false;

    let retomarVideo =
      false;



    function arquivoLocal(arquivo) {

      return (
        arquivo
        +
        "?v="
        +
        encodeURIComponent(
          CONFIG.versaoArquivos
        )
      );

    }



    function caminhoSeguro(valor) {

      return String(valor)
        .split("/")
        .filter(Boolean)
        .map(
          function(parte) {

            return encodeURIComponent(
              parte
            );

          }
        )
        .join("/");

    }



    function urlMidia(arquivo) {

      return (

        CONFIG.hostMidia
          .replace(/\/+$/, "")

        +

        "/"

        +

        caminhoSeguro(
          CONFIG.pastaCliente
        )

        +

        "/"

        +

        caminhoSeguro(
          arquivo
        )

      );

    }



    function aplicarConfiguracoes() {

      capa.src =
        arquivoLocal(
          CONFIG.capaArquivo
        );


      final.src =
        arquivoLocal(
          CONFIG.finalArquivo
        );


      imagemPresentes.src =
        arquivoLocal(
          CONFIG.presentesArquivo
        );


      video.src =
        urlMidia(
          CONFIG.videoArquivo
        );


      musica.src =
        urlMidia(
          CONFIG.musicaArquivo
        );


      musica.volume =
        0.001;


      const botoes =
        CONFIG.botoes;


      [
        botaoPresentes,
        botaoConfirmar,
        botaoLocalizacao
      ].forEach(

        function(botao) {

          botao.style.left =
            botoes.esquerda;

          botao.style.width =
            botoes.largura;

          botao.style.height =
            botoes.altura;

        }

      );


      botaoPresentes.style.top =
        botoes.presentesTopo;


      botaoConfirmar.style.top =
        botoes.confirmarTopo;


      botaoLocalizacao.style.top =
        botoes.localizacaoTopo;

    }


    aplicarConfiguracoes();



    musica.addEventListener(

      "error",

      function() {

        musicaDisponivel =
          false;

        controleSom.style.display =
          "none";

      }

    );



    function tempoDaMusica() {

      return (
        CONFIG.inicioMusica
        +
        video.currentTime
      );

    }



    function sincronizarMusica() {

      if (
        !musicaDisponivel
      ) {
        return;
      }


      const diferenca =
        Math.abs(
          musica.currentTime
          -
          tempoDaMusica()
        );


      if (
        diferenca > 0.30
      ) {

        try {

          musica.currentTime =
            tempoDaMusica();

        }
        catch (erro) {

        }

      }

    }



    function abrirConvite() {

      capa.style.display =
        "none";


      videoTela.style.display =
        "block";


      mostrarCarregando();


      try {

        video.currentTime =
          0;

        musica.currentTime =
          CONFIG.inicioMusica;

      }
      catch (erro) {

      }


      if (
        musicaDisponivel
      ) {

        musica.volume =
          0.001;


        musica
          .play()
          .catch(
            function() {
            }
          );

      }


      video
        .play()
        .catch(

          function() {

            esconderCarregando();

            erroVideo.style.display =
              "flex";

          }

        );

    }



    function aoVideoTocar() {

      esconderCarregando();


      sincronizarMusica();


      if (
        !temporizadorPularIniciado
      ) {

        temporizadorPularIniciado =
          true;


        pular.style.display =
          "block";


        setTimeout(

          function() {

            pular.style.display =
              "none";

          },

          CONFIG.tempoPular

        );

      }

    }



    function mostrarCarregando() {

      carregando.style.display =
        "flex";

    }



    function esconderCarregando() {

      carregando.style.display =
        "none";

    }



    function erroAoCarregarVideo() {

      esconderCarregando();

      pular.style.display =
        "none";

      musica.pause();

      erroVideo.style.display =
        "flex";

    }



    function mostrarFinal() {

      if (
        conviteFinalAberto
      ) {
        return;
      }


      conviteFinalAberto =
        true;


      const ponto =
        tempoDaMusica();


      video.pause();


      try {

        musica.currentTime =
          ponto;

      }
      catch (erro) {

      }


      if (
        musicaDisponivel
      ) {

        musica.volume =
          musicaSilenciada
            ? 0
            : CONFIG.volumeMusica;


        musica
          .play()
          .then(

            function() {

              controleSom.style.display =
                "flex";

            }

          )
          .catch(

            function() {

              musicaDisponivel =
                false;

              controleSom.style.display =
                "none";

            }

          );

      }


      esconderCarregando();

      erroVideo.style.display =
        "none";

      pular.style.display =
        "none";

      videoTela.style.display =
        "none";

      finalTela.style.display =
        "block";

    }



    function alternarSom() {

      musicaSilenciada =
        !musicaSilenciada;


      musica.volume =
        musicaSilenciada
          ? 0
          : CONFIG.volumeMusica;


      iconeSomLigado.style.display =
        musicaSilenciada
          ? "none"
          : "block";


      iconeSomDesligado.style.display =
        musicaSilenciada
          ? "block"
          : "none";

    }



    function pausarMidiaAoSair() {

      retomarMusica =
        !musica.paused;


      retomarVideo =
        !video.paused
        &&
        !video.ended;


      if (
        retomarMusica
      ) {

        musica.pause();

      }


      if (
        retomarVideo
      ) {

        video.pause();

      }

    }



    function retomarMidiaAoVoltar() {

      if (
        document.hidden
      ) {
        return;
      }


      if (
        conviteFinalAberto
      ) {

        if (
          retomarMusica
          &&
          musicaDisponivel
        ) {

          musica.volume =
            musicaSilenciada
              ? 0
              : CONFIG.volumeMusica;


          musica
            .play()
            .catch(
              function() {
              }
            );

        }

      }
      else {

        if (
          retomarMusica
          &&
          musicaDisponivel
        ) {

          sincronizarMusica();


          musica.volume =
            0.001;


          musica
            .play()
            .catch(
              function() {
              }
            );

        }


        if (
          retomarVideo
        ) {

          video
            .play()
            .catch(
              function() {
              }
            );

        }

      }


      retomarMusica =
        false;


      retomarVideo =
        false;

    }



    document.addEventListener(

      "visibilitychange",

      function() {

        if (
          document.hidden
        ) {

          pausarMidiaAoSair();

        }
        else {

          retomarMidiaAoVoltar();

        }

      }

    );



    musica.addEventListener(

      "ended",

      function() {

        try {

          musica.currentTime =
            CONFIG.inicioMusica;

        }
        catch (erro) {

        }


        musica
          .play()
          .catch(
            function() {
            }
          );

      }

    );



    function abrirPresentes() {

      popupPresentes.style.display =
        "flex";

      controleSom.style.display =
        "none";

    }



    function fecharPresentes(event) {

      if (event) {

        event.stopPropagation();

      }


      popupPresentes.style.display =
        "none";


      if (
        conviteFinalAberto
        &&
        musicaDisponivel
      ) {

        controleSom.style.display =
          "flex";

      }

    }



    function fecharAoClicarFora(event) {

      if (
        event.target ===
        popupPresentes
      ) {

        fecharPresentes();

      }

    }



    function abrirWhatsApp() {

      window.location.href =

        "https://wa.me/"

        +

        CONFIG.numeroWhatsapp

        +

        "?text="

        +

        encodeURIComponent(
          CONFIG.mensagemWhatsapp
        );

    }



    function abrirLocalizacao() {

      window.location.href =
        CONFIG.linkMapa;

    }



    document.addEventListener(

      "contextmenu",

      function(event) {

        if (
          event.target
          instanceof
          HTMLImageElement

          ||

          event.target
          instanceof
          HTMLVideoElement

          ||

          event.target
          instanceof
          HTMLAudioElement
        ) {

          event.preventDefault();

        }

      }

    );

  </script>

</body>

</html>

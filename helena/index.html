<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta

    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <script>

    const CONFIG = {


      /* 🌸 NOME / TÍTULO */

      tituloPagina:
        "Convite da Helena",


      /* 🌸 VÍDEO NO R2 */

      videoUrl:
        "https://pub-d23162ae214a428aa4efb5751e675792.r2.dev/helena/abertura.mp4",


      /* 🌸 MÚSICA NO R2 */

      musicaUrl:
        "https://pub-d23162ae214a428aa4efb5751e675792.r2.dev/helena/musica-aquarela.mp3",


      /* 🌸 PONTO INICIAL DA MÚSICA */

      inicioMusica:
        0,


      /* 🌸 VOLUME DA MÚSICA NO FINAL */

      volumeMusica:
        0.35,


      /* 🌸 WHATSAPP */

      numeroWhatsapp:
        "5561995705621",


      /* 🌸 MENSAGEM */

      mensagemWhatsapp:
        "Olá! Quero confirmar minha presença no aniversário da Helena.",


      /* 🌸 MAPA */

      linkMapa:
        "https://www.google.com/maps/search/?api=1&query=Parque+da+Cidade+Sarah+Kubitschek+Brasilia",


      /* 🌸 PULAR ABERTURA */

      tempoPular:
        5000,


      /* 🌸 POSIÇÃO DOS BOTÕES */

      botoes: {

        esquerda:
          "44%",

        largura:
          "40%",

        altura:
          "8%",

        presentesTopo:
          "56%",

        confirmarTopo:
          "65.5%",

        localizacaoTopo:
          "75.5%"

      }


    };

  </script>


  <!--
  ╔══════════════════════════════════════════════════════════════╗

  <title>Convite</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: black;

      overflow: hidden;

      font-family: Arial, sans-serif;

      -webkit-tap-highlight-color: transparent;

    }


    /* ===============================
       CAPA
    =============================== */

    #capa {

      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100vh;

      object-fit: cover;

      display: block;

      cursor: pointer;

      z-index: 10;

    }


    /* ===============================
       VÍDEO
    =============================== */

    #videoTela {

      display: none;

      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100vh;

      background: black;

      z-index: 20;

    }


    #video {

      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

    }


    /* ===============================
       CARREGAMENTO
    =============================== */

    #carregando {

      display: none;

      position: absolute;
      inset: 0;

      background:
        rgba(0, 0, 0, 0.72);

      align-items: center;
      justify-content: center;
      flex-direction: column;

      color: white;

      font-size: 14px;

      z-index: 40;

    }


    #spinner {

      width: 38px;
      height: 38px;

      margin-bottom: 15px;

      border:
        4px solid
        rgba(255,255,255,0.25);

      border-top-color: white;

      border-radius: 50%;

      animation:
        girar
        0.9s
        linear
        infinite;

    }


    @keyframes girar {

      to {
        transform: rotate(360deg);
      }

    }


    /* ===============================
       PULAR ABERTURA
    =============================== */

    #pular {

      display: none;

      position: absolute;

      right:
        max(
          16px,
          env(safe-area-inset-right)
        );

      bottom:
        max(
          90px,
          calc(
            env(safe-area-inset-bottom)
            + 70px
          )
        );

      padding:
        10px 17px;

      background:
        rgba(0, 0, 0, 0.48);

      color: white;

      border:
        1px solid
        rgba(255,255,255,0.48);

      border-radius:
        999px;

      font-size:
        13px;

      backdrop-filter:
        blur(5px);

      -webkit-backdrop-filter:
        blur(5px);

      cursor: pointer;

      z-index: 60;

      user-select: none;

    }


    /* ===============================
       ERRO
    =============================== */

    #erroVideo {

      display: none;

      position: absolute;
      inset: 0;

      background:
        rgba(0,0,0,0.88);

      align-items: center;
      justify-content: center;
      flex-direction: column;

      text-align: center;

      color: white;

      padding: 30px;

      z-index: 80;

    }


    #erroVideo p {

      margin:
        0 0 18px;

      line-height:
        1.5;

      font-size:
        14px;

    }


    #irParaConvite {

      border: 0;

      padding:
        11px 20px;

      border-radius:
        999px;

      background:
        white;

      color:
        black;

      font-size:
        14px;

      cursor:
        pointer;

    }


    /* ===============================
       CARD FINAL
    =============================== */

    #finalTela {

      display: none;

      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

      background: black;

      z-index: 70;

    }


    #arteFinal {

      position: absolute;

      top: 50%;
      left: 50%;

      width:
        max(
          100vw,
          calc(100vh * 9 / 16)
        );

      aspect-ratio:
        9 / 16;

      transform:
        translate(-50%, -50%);

    }


    #final {

      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

      pointer-events: none;

    }


    /* ===============================
       BOTÕES INVISÍVEIS
    =============================== */

    .botaoInvisivel {

      position: absolute;

      padding: 0;
      margin: 0;

      border: 0;
      outline: 0;

      background:
        transparent;

      cursor: pointer;

      z-index: 10;

    }


    /* ===============================
       CONTROLE DE SOM

       APARECE SOMENTE NO FINAL
    =============================== */

    #controleSom {

      display: none;

      position: fixed;

      left:
        max(
          16px,
          env(safe-area-inset-left)
        );

      bottom:
        max(
          90px,
          calc(
            env(safe-area-inset-bottom)
            + 70px
          )
        );

      width: 42px;
      height: 42px;

      padding: 0;

      border:
        1px solid
        rgba(255,255,255,0.38);

      border-radius:
        50%;

      background:
        rgba(0,0,0,0.50);

      color:
        white;

      align-items: center;
      justify-content: center;

      font-size:
        19px;

      cursor:
        pointer;

      backdrop-filter:
        blur(5px);

      -webkit-backdrop-filter:
        blur(5px);

      z-index:
        250;

    }


    /* ===============================
       POP-UP PRESENTES
    =============================== */

    #popupPresentes {

      display: none;

      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100vh;

      padding:

        max(
          18px,
          env(safe-area-inset-top)
        )

        18px

        max(
          18px,
          env(safe-area-inset-bottom)
        );

      background:
        rgba(0,0,0,0.82);

      align-items: center;
      justify-content: center;

      z-index: 200;

    }


    #conteudoPresentes {

      position: relative;

      display: flex;

      align-items: center;
      justify-content: center;

      width: 100%;
      height: 100%;

    }


    #imagemPresentes {

      display: block;

      width: auto;
      height: auto;

      max-width: 94vw;
      max-height: 92vh;

      object-fit: contain;

      border-radius: 16px;

      box-shadow:
        0 12px 45px
        rgba(0,0,0,0.35);

    }


    #fecharPresentes {

      position: absolute;

      top: 12px;
      right: 12px;

      width: 42px;
      height: 42px;

      padding: 0;

      border:
        1px solid
        rgba(255,255,255,0.35);

      border-radius:
        50%;

      background:
        rgba(0,0,0,0.62);

      color:
        white;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 26px;

      cursor: pointer;

      z-index: 210;

    }

  </style>

</head>


<body>


  <!-- CAPA -->

  <img
    id="capa"
    src="imagens/capa.jpg"
    alt="Abrir convite"
    onclick="abrirConvite()"
  >


  <!-- VÍDEO -->

  <div id="videoTela">


    <video

      id="video"

      playsinline

      webkit-playsinline

      preload="auto"

      onplaying="aoVideoTocar()"

      oncanplay="esconderCarregando()"

      onwaiting="aoVideoEsperar()"

      onstalled="aoVideoEsperar()"

      onended="mostrarFinal()"

      onerror="erroAoCarregarVideo()"

    ></video>


    <div id="carregando">

      <div id="spinner"></div>

      <div>
        Carregando convite...
      </div>

    </div>


    <div
      id="pular"
      onclick="pularAbertura()"
    >
      Pular abertura
    </div>


    <div id="erroVideo">

      <p>
        Não foi possível carregar
        a animação do convite.
      </p>

      <button
        id="irParaConvite"
        onclick="mostrarFinal()"
      >
        Abrir convite
      </button>

    </div>


  </div>


  <!-- MÚSICA -->

  <audio
    id="musica"
    preload="auto"
  ></audio>


  <!-- CARD FINAL -->

  <div id="finalTela">


    <div id="arteFinal">


      <img
        id="final"
        src="imagens/final.jpg"
        alt="Convite"
      >


      <button
        id="botaoPresentes"
        class="botaoInvisivel"
        aria-label="Abrir sugestões de presentes"
        onclick="abrirPresentes()"
      ></button>


      <button
        id="botaoConfirmar"
        class="botaoInvisivel"
        aria-label="Confirmar presença"
        onclick="abrirWhatsApp()"
      ></button>


      <button
        id="botaoLocalizacao"
        class="botaoInvisivel"
        aria-label="Abrir localização"
        onclick="abrirLocalizacao()"
      ></button>


    </div>


  </div>


  <!-- CONTROLE DE SOM -->

  <button
    id="controleSom"
    aria-label="Silenciar música"
    onclick="alternarSom()"
  >
    🔊
  </button>


  <!-- POP-UP PRESENTES -->

  <div
    id="popupPresentes"
    onclick="fecharAoClicarFora(event)"
  >


    <div id="conteudoPresentes">


      <img
        id="imagemPresentes"
        src="imagens/presentes.jpg"
        alt="Sugestões de presentes"
      >


      <button
        id="fecharPresentes"
        aria-label="Fechar sugestões de presentes"
        onclick="fecharPresentes(event)"
      >
        ×
      </button>


    </div>


  </div>


  <script>


    /* ===============================
       MOTOR DO CONVITE
    =============================== */


    document.title =
      CONFIG.tituloPagina;


    const capa =
      document.getElementById("capa");


    const video =
      document.getElementById("video");


    const musica =
      document.getElementById("musica");


    const videoTela =
      document.getElementById("videoTela");


    const carregando =
      document.getElementById("carregando");


    const pular =
      document.getElementById("pular");


    const erroVideo =
      document.getElementById("erroVideo");


    const finalTela =
      document.getElementById("finalTela");


    const popupPresentes =
      document.getElementById("popupPresentes");


    const botaoPresentes =
      document.getElementById("botaoPresentes");


    const botaoConfirmar =
      document.getElementById("botaoConfirmar");


    const botaoLocalizacao =
      document.getElementById("botaoLocalizacao");


    const controleSom =
      document.getElementById("controleSom");



    let temporizadorPularIniciado =
      false;


    let conviteFinalAberto =
      false;


    let retomarMusicaAoVoltar =
      false;


    let retomarVideoAoVoltar =
      false;


    let musicaSilenciadaPeloUsuario =
      false;



    /* ===============================
       CONFIGURAÇÕES
    =============================== */

    function aplicarConfiguracoes() {


      video.src =
        CONFIG.videoUrl;


      musica.src =
        CONFIG.musicaUrl;


      musica.volume =
        0.001;



      const botoes =
        CONFIG.botoes;


      const todosBotoes = [

        botaoPresentes,

        botaoConfirmar,

        botaoLocalizacao

      ];


      todosBotoes.forEach(

        function(botao) {


          botao.style.left =
            botoes.esquerda;


          botao.style.width =
            botoes.largura;


          botao.style.height =
            botoes.altura;


        }

      );


      botaoPresentes.style.top =
        botoes.presentesTopo;


      botaoConfirmar.style.top =
        botoes.confirmarTopo;


      botaoLocalizacao.style.top =
        botoes.localizacaoTopo;


    }


    aplicarConfiguracoes();



    /* ===============================
       TEMPO DA MÚSICA
    =============================== */

    function tempoDaMusica() {


      let tempo =
        CONFIG.inicioMusica
        +
        video.currentTime;


      if (

        Number.isFinite(
          musica.duration
        )

        &&

        musica.duration > 0

      ) {


        const trechoDisponivel =
          musica.duration
          -
          CONFIG.inicioMusica;


        if (
          trechoDisponivel > 0
          &&
          tempo >= musica.duration
        ) {


          tempo =
            CONFIG.inicioMusica
            +
            (
              (
                tempo
                -
                CONFIG.inicioMusica
              )
              %
              trechoDisponivel
            );


        }


      }


      return tempo;


    }



    /* ===============================
       SINCRONIZAÇÃO
    =============================== */

    function sincronizarMusica() {


      const tempo =
        tempoDaMusica();


      const diferenca =
        Math.abs(
          musica.currentTime
          -
          tempo
        );


      if (
        diferenca > 0.30
      ) {


        try {


          musica.currentTime =
            tempo;


        }
        catch (erro) {

        }


      }


    }



    /* ===============================
       ABRIR CONVITE
    =============================== */

    function abrirConvite() {


      capa.style.display =
        "none";


      videoTela.style.display =
        "block";


      pular.style.display =
        "none";


      mostrarCarregando();


      try {


        video.currentTime =
          0;


        musica.currentTime =
          CONFIG.inicioMusica;


      }
      catch (erro) {

      }


      musica.volume =
        0.001;


      musica
        .play()
        .catch(
          function() {
          }
        );


      video
        .play()
        .catch(

          function() {


            esconderCarregando();


            erroVideo.style.display =
              "flex";


          }

        );


    }



    /* ===============================
       VÍDEO TOCANDO
    =============================== */

    function aoVideoTocar() {


      esconderCarregando();


      sincronizarMusica();


      musica.volume =
        0.001;


      if (
        musica.paused
      ) {


        musica
          .play()
          .catch(
            function() {
            }
          );


      }


      if (
        !temporizadorPularIniciado
      ) {


        temporizadorPularIniciado =
          true;


        pular.style.display =
          "block";


        setTimeout(

          function() {


            pular.style.display =
              "none";


          },

          CONFIG.tempoPular

        );


      }


    }



    function aoVideoEsperar() {


      mostrarCarregando();


    }



    /* ===============================
       CARREGAMENTO
    =============================== */

    function mostrarCarregando() {


      carregando.style.display =
        "flex";


    }


    function esconderCarregando() {


      carregando.style.display =
        "none";


    }



    /* ===============================
       ERRO
    =============================== */

    function erroAoCarregarVideo() {


      esconderCarregando();


      pular.style.display =
        "none";


      musica.pause();


      erroVideo.style.display =
        "flex";


    }



    /* ===============================
       CARD FINAL
    =============================== */

    function mostrarFinal() {


      if (
        conviteFinalAberto
      ) {

        return;

      }


      conviteFinalAberto =
        true;


      const pontoExato =
        tempoDaMusica();


      video.pause();


      try {


        musica.currentTime =
          pontoExato;


      }
      catch (erro) {

      }



      if (
        musicaSilenciadaPeloUsuario
      ) {


        musica.volume =
          0;


      }
      else {


        musica.volume =
          CONFIG.volumeMusica;


      }


      musica
        .play()
        .catch(
          function() {
          }
        );


      esconderCarregando();


      erroVideo.style.display =
        "none";


      pular.style.display =
        "none";


      videoTela.style.display =
        "none";


      finalTela.style.display =
        "block";


      /*
         CONTROLE DE SOM SÓ NASCE AQUI.
      */

      controleSom.style.display =
        "flex";


    }



    /* ===============================
       CONTROLE DE SOM
    =============================== */

    function alternarSom() {


      musicaSilenciadaPeloUsuario =
        !musicaSilenciadaPeloUsuario;


      if (
        musicaSilenciadaPeloUsuario
      ) {


        /*
           A música NÃO pausa.

           Continua avançando
           silenciosamente.
        */

        musica.volume =
          0;


        controleSom.textContent =
          "🔇";


        controleSom.setAttribute(
          "aria-label",
          "Ativar música"
        );


      }
      else {


        musica.volume =
          CONFIG.volumeMusica;


        controleSom.textContent =
          "🔊";


        controleSom.setAttribute(
          "aria-label",
          "Silenciar música"
        );


        if (
          musica.paused
        ) {


          musica
            .play()
            .catch(
              function() {
              }
            );


        }


      }


    }



    /* ===============================
       PULAR
    =============================== */

    function pularAbertura() {


      mostrarFinal();


    }



    /* ===============================
       SEGUNDO PLANO
    =============================== */

    function pausarMidiaAoSair() {


      retomarMusicaAoVoltar =
        !musica.paused;


      retomarVideoAoVoltar =

        !video.paused

        &&

        !video.ended;


      if (
        retomarMusicaAoVoltar
      ) {


        musica.pause();


      }


      if (
        retomarVideoAoVoltar
      ) {


        video.pause();


      }


    }



    function retomarMidiaAoVoltar() {


      if (
        document.hidden
      ) {

        return;

      }


      if (
        conviteFinalAberto
      ) {


        if (
          retomarMusicaAoVoltar
        ) {


          if (
            musicaSilenciadaPeloUsuario
          ) {


            musica.volume =
              0;


          }
          else {


            musica.volume =
              CONFIG.volumeMusica;


          }


          musica
            .play()
            .catch(
              function() {
              }
            );


        }


        retomarMusicaAoVoltar =
          false;


        retomarVideoAoVoltar =
          false;


        return;


      }


      if (
        videoTela.style.display ===
        "block"
      ) {


        if (
          retomarMusicaAoVoltar
        ) {


          sincronizarMusica();


          musica.volume =
            0.001;


          musica
            .play()
            .catch(
              function() {
              }
            );


        }


        if (
          retomarVideoAoVoltar
        ) {


          video
            .play()
            .catch(
              function() {
              }
            );


        }


      }


      retomarMusicaAoVoltar =
        false;


      retomarVideoAoVoltar =
        false;


    }



    document.addEventListener(

      "visibilitychange",

      function() {


        if (
          document.hidden
        ) {


          pausarMidiaAoSair();


        }
        else {


          retomarMidiaAoVoltar();


        }


      }

    );



    window.addEventListener(

      "pageshow",

      function() {


        retomarMidiaAoVoltar();


      }

    );



    /* ===============================
       LOOP DA MÚSICA
    =============================== */

    musica.addEventListener(

      "ended",

      function() {


        try {


          musica.currentTime =
            CONFIG.inicioMusica;


        }
        catch (erro) {

        }


        musica
          .play()
          .catch(
            function() {
            }
          );


      }

    );



    /* ===============================
       PRESENTES
    =============================== */

    function abrirPresentes() {


      popupPresentes.style.display =
        "flex";


    }


    function fecharPresentes(event) {


      if (event) {


        event.stopPropagation();


      }


      popupPresentes.style.display =
        "none";


    }


    function fecharAoClicarFora(event) {


      if (
        event.target ===
        popupPresentes
      ) {


        fecharPresentes();


      }


    }



    /* ===============================
       WHATSAPP
    =============================== */

    function abrirWhatsApp() {


      const link =
        "https://wa.me/" +
        CONFIG.numeroWhatsapp +
        "?text=" +
        encodeURIComponent(
          CONFIG.mensagemWhatsapp
        );


      window.location.href =
        link;


    }



    /* ===============================
       MAPA
    =============================== */

    function abrirLocalizacao() {


      window.location.href =
        CONFIG.linkMapa;


    }


  </script>


</body>

</html>

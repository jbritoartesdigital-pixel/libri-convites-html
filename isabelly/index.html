  <style>

    :root {
      --fundo: #000;
      --transicao-video: 240ms;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--fundo);
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    img,
    video {
      display: block;
      -webkit-user-drag: none;
      user-drag: none;
    }

    button {
      font: inherit;
      appearance: none;
      -webkit-appearance: none;
    }

    /* ==================================================
       TELA
    ================================================== */

    .tela {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--fundo);
    }

    @supports (height: 100dvh) {
      .tela {
        height: 100dvh;
      }
    }

    /* ==================================================
       9:16 COVER
    ================================================== */

    .quadro {
      position: relative;

      width:
        max(
          100vw,
          calc(100vh * 9 / 16)
        );

      height:
        max(
          100vh,
          calc(100vw * 16 / 9)
        );

      flex: 0 0 auto;
      overflow: hidden;
      background: #000;
    }

    @supports (height: 100dvh) {
      .quadro {

        width:
          max(
            100vw,
            calc(100dvh * 9 / 16)
          );

        height:
          max(
            100dvh,
            calc(100vw * 16 / 9)
          );

      }
    }

    .arte,
    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ==================================================
       FINAL
       Já fica pronto atrás do vídeo
    ================================================== */

    #finalTela {
      z-index: 20;
      visibility: visible;
      opacity: 1;
      pointer-events: none;
    }

    #finalTela.ativo {
      pointer-events: auto;
    }

    /* ==================================================
       VÍDEO
    ================================================== */

    #videoTela {
      z-index: 30;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      background: transparent;

      transition:
        opacity
        var(--transicao-video)
        ease;
    }

    #videoTela.ativo {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    #videoTela.saindo {
      opacity: 0;
      pointer-events: none;
    }

    #video {
      background: transparent;
    }

    /* ==================================================
       CAPA
    ================================================== */

    #capaTela {
      z-index: 50;
      visibility: visible;
      opacity: 1;

      transition:
        opacity
        180ms
        ease;
    }

    #capaTela.saindo {
      opacity: 0;
      pointer-events: none;
    }

    #abrirConvite {
      position: absolute;
      inset: 0;
      z-index: 100;

      width: 100%;
      height: 100%;

      border: 0;
      padding: 0;
      margin: 0;

      background: transparent;
      cursor: pointer;
    }

    /* ==================================================
       PULAR
    ================================================== */

    #pular {
      position: absolute;

      right: 18px;

      bottom:
        max(
          90px,
          calc(
            env(safe-area-inset-bottom)
            +
            70px
          )
        );

      z-index: 200;

      border:
        1px solid
        rgba(255, 255, 255, 0.55);

      border-radius: 999px;

      padding: 9px 14px;

      background:
        rgba(0, 0, 0, 0.48);

      color: #fff;

      font-size: 13px;

      cursor: pointer;

      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity
        160ms
        ease;
    }

    #pular.visivel {
      opacity: 1;
      visibility: visible;
    }

    /* ==================================================
       HOTSPOTS
    ================================================== */

    .hotspot {
      position: absolute;
      z-index: 300;

      display: block;

      padding: 0;
      margin: 0;
      border: 0;

      background: transparent;

      cursor: pointer;

    /* ==================================================
       CONTROLE DE SOM

      border-radius: 50%;

    #controleSom.mudo #iconeMudo {

    }

  <script>

    (() => {

      "use strict";

      /* ==================================================
         ELEMENTOS
      ================================================== */

      const capaTela =
        document.getElementById("capaTela");

      const videoTela =
        document.getElementById("videoTela");

      const finalTela =
        document.getElementById("finalTela");

      const capaImagem =
        document.getElementById("capaImagem");

      const finalImagem =
        document.getElementById("finalImagem");

      const video =
        document.getElementById("video");

      const musica =
        document.getElementById("musica");

      const abrirConvite =
        document.getElementById("abrirConvite");

      const pular =
        document.getElementById("pular");

      const controleSom =
        document.getElementById("controleSom");

      const hotspotLocalizacao =
        document.getElementById("hotspotLocalizacao");

      const hotspotConfirmacao =
        document.getElementById("hotspotConfirmacao");

      /* ==================================================
         URLS DE MÍDIA
      ================================================== */

      video.src =
        CONFIG.hostMidia
        +
        "/"
        +
        CONFIG.pastaCliente
        +
        "/"
        +
        CONFIG.videoArquivo
        +
        "?v="
        +
        CONFIG.versaoMidia;

      musica.src =
        CONFIG.hostMidia
        +
        "/"
        +
        CONFIG.pastaCliente
        +
        "/"
        +
        CONFIG.musicaArquivo
        +
        "?v="
        +
        CONFIG.versaoMidia;

      /* ==================================================
         ESTADO
      ================================================== */

      let conviteAberto =
        false;

      let finalAtivo =
        false;

      let finalizando =
        false;

      let somLigado =
        true;

      let audioDisponivel =
        true;

      let timerPular =
        null;

      let rafFim =
        null;

      let rafAudio =
        null;

      let ultimoAjusteSincronia =
        0;

      let videoEstavaTocando =
        false;

      let musicaEstavaTocando =
        false;

      /* ==================================================
         IMAGENS PNG / JPG / JPEG
      ================================================== */

      const EXTENSOES =
        [
          ".png",
          ".jpg",
          ".jpeg"
        ];

      function resolverImagem(
        elemento,
        base
      ) {

        return new Promise(
          resolve => {

            let indice =
              0;

            const tentar =
              () => {

                if (
                  indice >=
                  EXTENSOES.length
                ) {

                  console.error(
                    "Imagem não encontrada:",
                    base
                  );

                  resolve(false);

                  return;
                }

                const extensao =
                  EXTENSOES[indice++];

                elemento.onload =
                  async () => {

                    elemento.onload =
                      null;

                    elemento.onerror =
                      null;

                    if (
                      typeof elemento.decode ===
                      "function"
                    ) {

                      await elemento
                        .decode()
                        .catch(
                          () => {}
                        );

                    }

                    resolve(true);

                  };

                elemento.onerror =
                  tentar;

                elemento.src =
                  base
                  +
                  extensao
                  +
                  "?v="
                  +
                  CONFIG.versaoArquivos;

              };

            tentar();

          }
        );

      }

      const imagensCarregadas =
        {

          capa:
            resolverImagem(
              capaImagem,
              CONFIG.imagens.capa
            ),

          final:
            resolverImagem(
              finalImagem,
              CONFIG.imagens.final
            )

        };

      /* ==================================================
         HOTSPOTS
      ================================================== */

      function posicionar(
        elemento,
        dados
      ) {

        elemento.style.left =
          dados.left;

        elemento.style.top =
          dados.top;

        elemento.style.width =
          dados.width;

        elemento.style.height =
          dados.height;

      }

      posicionar(
        hotspotLocalizacao,
        CONFIG.hotspotsFinal.localizacao
      );

      posicionar(
        hotspotConfirmacao,
        CONFIG.hotspotsFinal.confirmacao
      );

      /* ==================================================
         CAPA
      ================================================== */

      function esconderCapa() {

        if (
          capaTela
            .classList
            .contains("saindo")
        ) {

          return;
        }

        capaTela
          .classList
          .add("saindo");

        setTimeout(
          () => {

            capaTela.style.visibility =
              "hidden";

          },
          200
        );

      }

      /* ==================================================
         TEMPO ESPERADO DA MÚSICA
      ================================================== */

      function tempoEsperadoMusica() {

        let esperado =
          Math.max(
            0,
            video.currentTime
            +
            CONFIG.inicioMusica
          );

        if (
          Number.isFinite(
            musica.duration
          )
          &&
          musica.duration > 0
        ) {

          esperado %=
            musica.duration;

        }

        return esperado;

      }

      /* ==================================================
         MÚSICA CONTÍNUA

         MP3 começa junto com o vídeo,
         em volume quase zero.
      ================================================== */

      function iniciarMusicaSilenciosa() {

        musica.volume =
          0.001;

        try {

          musica.currentTime =
            Math.max(
              0,
              CONFIG.inicioMusica
            );

        }

        catch (_) {}

        const tentativa =
          musica.play();

        if (
          tentativa
          &&
          typeof tentativa.catch ===
          "function"
        ) {

          tentativa.catch(
            () => {

              audioDisponivel =
                false;

              controleSom
                .classList
                .remove("visivel");

            }
          );

        }

      }

      /* ==================================================
         SINCRONIA DURANTE O VÍDEO

         O seek, se necessário, acontece
         somente enquanto o MP3 está inaudível.
      ================================================== */

      function manterSincronia() {

        if (
          !audioDisponivel
          ||
          finalAtivo
          ||
          finalizando
          ||
          video.paused
          ||
          musica.paused
        ) {

          return;
        }

        const agora =
          performance.now();

        if (
          agora
          -
          ultimoAjusteSincronia
          <
          1000
        ) {

          return;
        }

        ultimoAjusteSincronia =
          agora;

        const esperado =
          tempoEsperadoMusica();

        const diferenca =
          Math.abs(
            musica.currentTime
            -
            esperado
          );

        if (
          diferenca > 0.35
        ) {

          try {

            musica.currentTime =
              esperado;

          }

          catch (_) {}

        }

      }

      /* ==================================================
         CROSSFADE DE ÁUDIO

         vídeo ↓
         MP3 ↑

         Sem seek no card.
         Sem novo play() no card.
      ================================================== */

      function transicaoSuaveAudio(
        aoFinalizar
      ) {

        cancelAnimationFrame(
          rafAudio
        );

        if (
          !audioDisponivel
          ||
          musica.paused
        ) {

          aoFinalizar();

          return;
        }

        const duracao =
          Math.max(
            120,
            CONFIG.transicaoAudio
          );

        const inicio =
          performance.now();

        const volumeVideoInicial =
          video.volume;

        const volumeMusicaInicial =
          musica.volume;

        const volumeMusicaFinal =
          somLigado
            ?
            CONFIG.volumeMusica
            :
            0;

        const animar =
          agora => {

            const progresso =
              Math.min(
                1,
                (
                  agora
                  -
                  inicio
                )
                /
                duracao
              );

            const suave =
              progresso
              *
              progresso
              *
              (
                3
                -
                2
                *
                progresso
              );

            try {

              video.volume =
                Math.max(
                  0,
                  volumeVideoInicial
                  *
                  (
                    1
                    -
                    suave
                  )
                );

            }

            catch (_) {}

            musica.volume =
              volumeMusicaInicial
              +
              (
                volumeMusicaFinal
                -
                volumeMusicaInicial
              )
              *
              suave;

            if (
              progresso < 1
            ) {

              rafAudio =
                requestAnimationFrame(
                  animar
                );

              return;
            }

            try {

              video.volume =
                0;

            }

            catch (_) {}

            musica.volume =
              volumeMusicaFinal;

            aoFinalizar();

          };

        rafAudio =
          requestAnimationFrame(
            animar
          );

      }

      /* ==================================================
         ABRIR CONVITE
      ================================================== */

      async function iniciarConvite() {

        if (
          conviteAberto
        ) {

          return;
        }

        conviteAberto =
          true;

        /*
           Garante que o card final já esteja
           carregado e decodificado atrás do vídeo.
        */

        await imagensCarregadas.final
          .catch(
            () => false
          );

        videoTela.style.visibility =
          "visible";

        videoTela
          .classList
          .remove("saindo");

        videoTela
          .classList
          .add("ativo");

        /*
           Música e vídeo começam no mesmo gesto.
        */

        iniciarMusicaSilenciosa();

        try {

          video.volume =
            1;

        }

        catch (_) {}

        try {

          await video.play();

        }

        catch (_) {

          finalizarVideo();

          esconderCapa();

          return;
        }

        esconderCapa();

        pular
          .classList
          .add("visivel");

        clearTimeout(
          timerPular
        );

        timerPular =
          setTimeout(
            () => {

              pular
                .classList
                .remove("visivel");

            },
            CONFIG.tempoPular
          );

        acompanharFinal();

      }

      /* ==================================================
         MONITORAR FINAL
      ================================================== */

      function acompanharFinal() {

        cancelAnimationFrame(
          rafFim
        );

        const verificar =
          () => {

            if (
              finalizando
              ||
              finalAtivo
            ) {

              return;
            }

            manterSincronia();

            if (
              Number.isFinite(
                video.duration
              )
              &&
              video.duration > 0
            ) {

              const restante =
                video.duration
                -
                video.currentTime;

              if (
                restante > 0
                &&
                restante <= 0.45
              ) {

                finalizarVideo();

                return;
              }

            }

            rafFim =
              requestAnimationFrame(
                verificar
              );

          };

        rafFim =
          requestAnimationFrame(
            verificar
          );

      }

      /* ==================================================
         VÍDEO → CARD
         SEM FLASH PRETO
         SEM CORTE DE MÚSICA
      ================================================== */

      function finalizarVideo() {

        if (
          finalizando
          ||
          finalAtivo
        ) {

          return;
        }

        finalizando =
          true;

        clearTimeout(
          timerPular
        );

        cancelAnimationFrame(
          rafFim
        );

        pular
          .classList
          .remove("visivel");

        /*
           O card já está pintado atrás.
        */

        finalTela
          .classList
          .add("ativo");

        /*
           Fade visual do vídeo por cima.
        */

        videoTela
          .classList
          .add("saindo");

        /*
           O MP3 já está tocando.
           Aqui não existe seek nem novo play().
        */

        transicaoSuaveAudio(
          () => {

            video.pause();

            videoTela
              .classList
              .remove("ativo");

            videoTela
              .classList
              .remove("saindo");

            videoTela.style.visibility =
              "hidden";

            try {

              video.volume =
                1;

            }

            catch (_) {}

            finalAtivo =
              true;

            finalizando =
              false;

            if (
              audioDisponivel
            ) {

              controleSom
                .classList
                .add("visivel");

            }

          }
        );

      }

      /* ==================================================
         LINKS
      ================================================== */

      function abrirLink(
        link
      ) {

        if (
          !link
        ) {

          return;
        }

        window.location.href =
          link;

      }

      function abrirWhatsApp() {

        const link =
          "https://wa.me/"
          +
          CONFIG.numeroWhatsapp
          +
          "?text="
          +
          encodeURIComponent(
            CONFIG.mensagemWhatsapp
          );

        abrirLink(
          link
        );

      }

      /* ==================================================
         SOM
      ================================================== */

      function alternarSom() {

        if (
          !audioDisponivel
        ) {

          return;
        }

        somLigado =
          !somLigado;

        musica.volume =
          somLigado
            ?
            CONFIG.volumeMusica
            :
            0;

        controleSom
          .classList
          .toggle(
            "mudo",
            !somLigado
          );

      }

      /* ==================================================
         VISIBILIDADE / RETORNO DE APPS
      ================================================== */

      function tratarVisibilidade() {

        if (
          document.hidden
        ) {

          videoEstavaTocando =
            !video.paused
            &&
            !finalAtivo
            &&
            !finalizando;

          musicaEstavaTocando =
            !musica.paused;

          if (
            videoEstavaTocando
          ) {

            video.pause();

          }

          if (
            musicaEstavaTocando
          ) {

            musica.pause();

          }

          return;
        }

        if (
          videoEstavaTocando
          &&
          !finalAtivo
        ) {

          video
            .play()
            .then(
              acompanharFinal
            )
            .catch(
              () => {}
            );

        }

        if (
          musicaEstavaTocando
          &&
          audioDisponivel
        ) {

          musica
            .play()
            .catch(
              () => {}
            );

        }

        videoEstavaTocando =
          false;

        musicaEstavaTocando =
          false;

      }

      /* ==================================================
         EVENTOS
      ================================================== */

      abrirConvite
        .addEventListener(
          "click",
          iniciarConvite
        );

      pular
        .addEventListener(
          "click",
          finalizarVideo
        );

      video
        .addEventListener(
          "playing",
          esconderCapa
        );

      video
        .addEventListener(
          "timeupdate",
          () => {

            if (
              finalizando
              ||
              finalAtivo
            ) {

              return;
            }

            manterSincronia();

            if (
              Number.isFinite(
                video.duration
              )
              &&
              video.duration > 0
              &&
              (
                video.duration
                -
                video.currentTime
              )
              <=
              0.45
            ) {

              finalizarVideo();

            }

          }
        );

      video
        .addEventListener(
          "ended",
          finalizarVideo
        );

      video
        .addEventListener(
          "error",
          () => {

            if (
              conviteAberto
              &&
              !finalAtivo
            ) {

              finalizarVideo();

              esconderCapa();

            }

          }
        );

      musica
        .addEventListener(
          "error",
          () => {

            audioDisponivel =
              false;

            controleSom
              .classList
              .remove("visivel");

          }
        );

      /* ==================================================
         CARD FINAL
      ================================================== */

      hotspotLocalizacao
        .addEventListener(
          "click",
          event => {

            event.preventDefault();
            event.stopPropagation();

            abrirLink(
              CONFIG.linkLocalizacao
            );

          }
        );

      hotspotConfirmacao
        .addEventListener(
          "click",
          event => {

            event.preventDefault();
            event.stopPropagation();

            abrirWhatsApp();

          }
        );

      controleSom
        .addEventListener(
          "click",
          alternarSom
        );

      document
        .addEventListener(
          "visibilitychange",
          tratarVisibilidade
        );

      window
        .addEventListener(
          "pageshow",
          event => {

            if (
              event.persisted
              &&
              finalAtivo
              &&
              audioDisponivel
            ) {

              musica.volume =
                somLigado
                  ?
                  CONFIG.volumeMusica
                  :
                  0;

              musica
                .play()
                .catch(
                  () => {}
                );

            }

          }
        );

      /* ==================================================
         BLOQUEIOS CASUAIS
      ================================================== */

      document
        .addEventListener(
          "contextmenu",
          event => {

            event.preventDefault();

          }
        );

      document
        .addEventListener(
          "dragstart",
          event => {

            event.preventDefault();

          }
        );

    })();

  </script>

</body>

</html>

      /* IMAGENS NO GITHUB */

      pix: {

      hotspotsPaginas: {

  <style>
    :root {
      --fundo: #000;
      --transicao-video: 240ms;
      --azul-profundo: #102a4c;
      --azul-card: #dbe8f5;
      --azul-texto: #17365d;
      --prata: #d8e3ef;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--fundo);
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    img,
    video {
      display: block;
      -webkit-user-drag: none;
      user-drag: none;
    }

    button {
      font: inherit;
      appearance: none;
      -webkit-appearance: none;
    }

    .tela {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--fundo);
    }

    @supports (height: 100dvh) {
      .tela {
        height: 100dvh;
      }
    }

    /* 9:16 em COVER para preencher o celular inteiro */
    .quadro {
      position: relative;
      width: max(100vw, calc(100vh * 9 / 16));
      height: max(100vh, calc(100vw * 16 / 9));
      flex: 0 0 auto;
      overflow: hidden;
      background: #000;
    }

    @supports (height: 100dvh) {
      .quadro {
        width: max(100vw, calc(100dvh * 9 / 16));
        height: max(100dvh, calc(100vw * 16 / 9));
      }
    }

    .arte,
    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* CARD FINAL já fica pronto atrás do vídeo */
    #finalTela {
      z-index: 20;
      visibility: visible;
      opacity: 1;
      pointer-events: none;
    }

    #finalTela.ativo {
      pointer-events: auto;
    }

    /* VÍDEO */
    #videoTela {
      z-index: 30;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      background: transparent;
      transition: opacity var(--transicao-video) ease;
    }

    #videoTela.ativo {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    #videoTela.saindo {
      opacity: 0;
      pointer-events: none;
    }

    #video {
      background: transparent;
    }

    /* CAPA */
    #capaTela {
      z-index: 50;
      visibility: visible;
      opacity: 1;
      transition: opacity 180ms ease;
    }

    #capaTela.saindo {
      opacity: 0;
      pointer-events: none;
    }

    #abrirConvite {
      position: absolute;
      inset: 0;
      z-index: 100;
      width: 100%;
      height: 100%;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      cursor: pointer;
    }

    /* PULAR */
    #pular {
      position: absolute;
      right: 18px;
      bottom: max(90px, calc(env(safe-area-inset-bottom) + 70px));
      z-index: 200;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 999px;
      padding: 9px 14px;
      background: rgba(0, 0, 0, 0.48);
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 160ms ease;
    }

    #pular.visivel {
      opacity: 1;
      visibility: visible;
    }

    /* HOTSPOTS */
    .hotspot {
      position: absolute;
      z-index: 300;
      display: block;
      padding: 0;
      margin: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }

    /* CONTROLE DE SOM */
    #controleSom {
      position: absolute;
      top: max(14px, calc(env(safe-area-inset-top) + 8px));
      right: 14px;
      z-index: 400;
      width: 38px;
      height: 38px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.38);
      color: #fff;
      cursor: pointer;
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    #controleSom.visivel {
      display: flex;
    }

    #controleSom svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #iconeMudo {
      display: none;
    }

    #controleSom.mudo #iconeSom {
      display: none;
    }

    #controleSom.mudo #iconeMudo {
      display: block;
    }

    /* PÁGINAS INTERNAS */
    .paginaInterna {
      z-index: 100;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .paginaInterna.ativa {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    /* MODAL PIX */
    #modalPix {
      position: fixed;
      inset: 0;
      z-index: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(3, 13, 30, 0.76);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    #modalPix.ativo {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .pixCard {
      position: relative;
      width: min(440px, calc(100vw - 36px));
      padding: 30px 24px 24px;
      border: 1px solid rgba(235, 244, 255, 0.86);
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.96), transparent 34%),
        linear-gradient(180deg, rgba(229,240,250,.98), rgba(197,218,238,.98));
      color: var(--azul-texto);
      box-shadow:
        0 24px 70px rgba(0, 10, 28, .55),
        inset 0 0 0 1px rgba(74, 112, 153, .25);
      text-align: center;
      user-select: text;
      -webkit-user-select: text;
    }

    .pixCard::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(80, 112, 151, .24);
      border-radius: 18px;
      pointer-events: none;
    }

    .pixJoia {
      width: 58px;
      height: 58px;
      margin: -2px auto 12px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(63, 100, 142, .32);
      border-radius: 50%;
      background: rgba(255,255,255,.56);
      box-shadow: 0 6px 22px rgba(33, 72, 116, .15);
      font-size: 26px;
    }

    #pixTitulo {
      margin: 0 0 14px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(25px, 7vw, 34px);
      font-weight: 500;
      color: #17365d;
    }

    #pixMensagem {
      margin: 0 auto 18px;
      max-width: 350px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(16px, 4.4vw, 19px);
      line-height: 1.48;
      color: #203d62;
    }

    .pixChaveLabel {
      margin: 0 0 7px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: #4b6686;
    }

    #pixChave {
      display: block;
      width: 100%;
      margin: 0 0 18px;
      padding: 12px 10px;
      border: 1px solid rgba(43, 78, 119, .22);
      border-radius: 12px;
      background: rgba(255,255,255,.68);
      color: #142f53;
      font-size: 13px;
      line-height: 1.35;
      overflow-wrap: anywhere;
      user-select: all;
      -webkit-user-select: all;
    }

    .pixAcoes {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    #copiarPix {
      min-height: 48px;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 999px;
      background: linear-gradient(180deg, #244d79, #17365d);
      color: #fff;
      font-weight: 700;
      letter-spacing: .02em;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(16, 42, 76, .23);
    }

    #fecharPix {
      min-height: 42px;
      border: 0;
      background: transparent;
      color: #395879;
      font-weight: 700;
      cursor: pointer;
    }

    .hotspot:focus-visible,
    #abrirConvite:focus-visible,
    #pular:focus-visible,
    #controleSom:focus-visible,
    #copiarPix:focus-visible,
    #fecharPix:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.95);
      outline-offset: -3px;
    }

    @media (prefers-reduced-motion: reduce) {
      #capaTela,
      #videoTela,
      #pular,
      .paginaInterna,
      #modalPix {
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>

<body>
  <!-- CARD FINAL já fica carregado atrás do vídeo -->
  <section id="finalTela" class="tela" aria-label="Convite final">
    <div class="quadro">
      <img
        id="finalImagem"
        class="arte"
        alt="Convite de 15 anos de Mayara Botelho"
        draggable="false"

      <button id="hotspotConfirmacao" class="hotspot" type="button" aria-label="Confirmar presença"></button>
      <button id="hotspotLocalizacao" class="hotspot" type="button" aria-label="Como chegar"></button>
      <button id="hotspotPresentes" class="hotspot" type="button" aria-label="Sugestões de presentes"></button>
      <button id="hotspotPedido" class="hotspot" type="button" aria-label="Um pedido especial"></button>

      <button id="controleSom" type="button" aria-label="Ativar ou silenciar música">
        <svg id="iconeSom" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
          <path d="M16 9.5c.8.7 1.2 1.5 1.2 2.5s-.4 1.8-1.2 2.5"></path>
          <path d="M18.5 7c1.5 1.3 2.3 3 2.3 5s-.8 3.7-2.3 5"></path>
        </svg>

        <svg id="iconeMudo" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
          <path d="M17 9l4 4"></path>
          <path d="M21 9l-4 4"></path>
        </svg>
      </button>
    </div>
  </section>

  <!-- VÍDEO PRINCIPAL -->
  <section id="videoTela" class="tela" aria-label="Vídeo de abertura">
    <div class="quadro">
      <video
        id="video"
        playsinline
        webkit-playsinline
        preload="auto"
        disablepictureinpicture
        controlslist="nodownload noplaybackrate noremoteplayback"
      ></video>

      <button id="pular" type="button" aria-label="Pular abertura">
        Pular abertura
      </button>

  </section>

  <!-- CAPA -->
  <section id="capaTela" class="tela" aria-label="Capa do convite">
    <div class="quadro">
      <img
        id="capaImagem"
        class="arte"
        alt="Mayara Botelho - 15 anos"
        draggable="false"
      >

      <button id="abrirConvite" type="button" aria-label="Abrir convite"></button>
    </div>
  </section>

  <!-- PÁGINA DE PRESENTES -->
  <section id="paginaPresentes" class="tela paginaInterna" aria-label="Sugestões de presentes">
    <div class="quadro">
      <img
        id="imagemPresentes"
        class="arte"
        alt="Sugestões de presentes da Mayara"
        draggable="false"
      >

      <button id="voltarPresentes" class="hotspot" type="button" aria-label="Voltar ao convite"></button>
      <button id="botaoPix" class="hotspot" type="button" aria-label="Ver informações do Pix"></button>
    </div>
  </section>

  <!-- PÁGINA PEDIDO ESPECIAL -->
  <section id="paginaPedido" class="tela paginaInterna" aria-label="Um pedido especial">
    <div class="quadro">
      <img
        id="imagemPedido"
        class="arte"
        alt="Um pedido especial da Mayara"
        draggable="false"
      >

      <button id="voltarPedido" class="hotspot" type="button" aria-label="Voltar ao convite"></button>
    </div>
  </section>

  <!-- MODAL PIX -->
  <div id="modalPix" role="dialog" aria-modal="true" aria-labelledby="pixTitulo" aria-describedby="pixMensagem">
    <div class="pixCard">
      <div class="pixJoia" aria-hidden="true">💗</div>

      <h2 id="pixTitulo">Pix (opcional)</h2>

      <p id="pixMensagem">
        Se preferir, você também pode contribuir com qualquer valor pelo Pix.
        Vou ficar muito feliz com o carinho! 🥹💗
      </p>

      <p class="pixChaveLabel">Chave Pix</p>
      <span id="pixChave">botelhoalvesmayarabotelhoalves@gmail.com</span>

      <div class="pixAcoes">
        <button id="copiarPix" type="button">Copiar chave Pix</button>
        <button id="fecharPix" type="button">Fechar</button>
      </div>
    </div>
  </div>

  <audio id="musica" preload="auto" loop></audio>

  <script>
    (() => {
      "use strict";

      const capaTela = document.getElementById("capaTela");
      const videoTela = document.getElementById("videoTela");
      const finalTela = document.getElementById("finalTela");

      const paginaPresentes = document.getElementById("paginaPresentes");
      const paginaPedido = document.getElementById("paginaPedido");

      const capaImagem = document.getElementById("capaImagem");
      const finalImagem = document.getElementById("finalImagem");
      const imagemPresentes = document.getElementById("imagemPresentes");
      const imagemPedido = document.getElementById("imagemPedido");

      const video = document.getElementById("video");
      const musica = document.getElementById("musica");

      const abrirConvite = document.getElementById("abrirConvite");
      const pular = document.getElementById("pular");
      const controleSom = document.getElementById("controleSom");

      const hotspotConfirmacao = document.getElementById("hotspotConfirmacao");
      const hotspotLocalizacao = document.getElementById("hotspotLocalizacao");
      const hotspotPresentes = document.getElementById("hotspotPresentes");
      const hotspotPedido = document.getElementById("hotspotPedido");

      const voltarPresentes = document.getElementById("voltarPresentes");
      const voltarPedido = document.getElementById("voltarPedido");
      const botaoPix = document.getElementById("botaoPix");

      const modalPix = document.getElementById("modalPix");
      const pixTitulo = document.getElementById("pixTitulo");
      const pixMensagem = document.getElementById("pixMensagem");
      const pixChave = document.getElementById("pixChave");
      const copiarPix = document.getElementById("copiarPix");
      const fecharPix = document.getElementById("fecharPix");

      let conviteAberto = false;
      let finalAtivo = false;
      let finalizando = false;
      let somLigado = true;
      let audioDisponivel = true;

      let timerPular = null;
      let rafFim = null;
      let rafAudio = null;
      let ultimoAjusteSincronia = 0;
      let timerTextoPix = null;

      let videoEstavaTocando = false;
      let musicaEstavaTocando = false;

      const urlArquivo = (caminho) =>
        `${caminho}?v=${encodeURIComponent(CONFIG.versaoArquivos)}`;

      function urlMidia(arquivo) {
        const partes = arquivo
          .split("/")
          .map((parte) => encodeURIComponent(parte))
          .join("/");

        return `${CONFIG.hostMidia}/${CONFIG.pastaCliente}/${partes}?v=${encodeURIComponent(CONFIG.versaoMidia)}`;
      }

      function posicionar(elemento, dados) {
        elemento.style.left = dados.left;
        elemento.style.top = dados.top;
        elemento.style.width = dados.width;
        elemento.style.height = dados.height;
      }

      function carregarImagem(elemento, caminho) {
        return new Promise((resolve) => {
          elemento.addEventListener("load", async () => {
            if (typeof elemento.decode === "function") {
              await elemento.decode().catch(() => {});
            }
            resolve(true);
          }, { once: true });

          elemento.addEventListener("error", () => resolve(false), { once: true });
          elemento.src = urlArquivo(caminho);
        });
      }

      document.title = CONFIG.titulo;

      const imagensCarregadas = {
        capa: carregarImagem(capaImagem, CONFIG.imagens.capa),
        final: carregarImagem(finalImagem, CONFIG.imagens.final),
        presentes: carregarImagem(imagemPresentes, CONFIG.imagens.presentes),
        pedido: carregarImagem(imagemPedido, CONFIG.imagens.pedido)
      };

      video.src = urlMidia(CONFIG.videoArquivo);
      musica.src = urlMidia(CONFIG.musicaArquivo);
      video.load();
      musica.load();

      pixTitulo.textContent = CONFIG.pix.titulo;
      pixMensagem.textContent = CONFIG.pix.mensagem;
      pixChave.textContent = CONFIG.pix.chave;

      posicionar(hotspotConfirmacao, CONFIG.hotspotsFinal.confirmacao);
      posicionar(hotspotLocalizacao, CONFIG.hotspotsFinal.localizacao);
      posicionar(hotspotPresentes, CONFIG.hotspotsFinal.presentes);
      posicionar(hotspotPedido, CONFIG.hotspotsFinal.pedido);

      posicionar(voltarPresentes, CONFIG.hotspotsPaginas.voltar);
      posicionar(voltarPedido, CONFIG.hotspotsPaginas.voltar);
      posicionar(botaoPix, CONFIG.hotspotsPaginas.pix);

      function esconderCapa() {
        if (capaTela.classList.contains("saindo")) return;

        capaTela.classList.add("saindo");

        setTimeout(() => {
          capaTela.style.visibility = "hidden";
        }, 200);
      }

      function tempoEsperadoMusica() {
        let esperado = Math.max(0, video.currentTime + CONFIG.inicioMusica);

        if (Number.isFinite(musica.duration) && musica.duration > 0) {
          esperado %= musica.duration;
        }

        return esperado;
      }

      /*
         MP3 começa no MESMO gesto que abre o convite.
         Enquanto o vídeo toca, fica praticamente inaudível.
      */
      function iniciarMusicaSilenciosa() {
        musica.volume = 0.001;

        try {
          musica.currentTime = Math.max(0, CONFIG.inicioMusica);
        } catch (_) {}

        const tentativa = musica.play();

        if (tentativa && typeof tentativa.catch === "function") {
          tentativa.catch(() => {
            audioDisponivel = false;
            controleSom.classList.remove("visivel");
          });
        }
      }

      /*
         Corrige drift SOMENTE enquanto o MP3 ainda está no volume técnico.
         Nunca faz seek na entrada do card final.
      */
      function manterSincronia(forcar = false) {
        if (
          !audioDisponivel ||
          finalAtivo ||
          video.paused ||
          musica.paused
        ) {
          return;
        }

        const agora = performance.now();

        if (!forcar && agora - ultimoAjusteSincronia < 1000) {
          return;
        }

        ultimoAjusteSincronia = agora;

        const esperado = tempoEsperadoMusica();
        const diferenca = Math.abs(musica.currentTime - esperado);

        if (forcar || diferenca > 0.35) {
          try {
            musica.currentTime = esperado;
          } catch (_) {}
        }
      }

      /* Crossfade sem reiniciar o MP3 */
      function transicaoSuaveAudio(aoFinalizar) {
        cancelAnimationFrame(rafAudio);

        if (!audioDisponivel || musica.paused) {
          aoFinalizar();
          return;
        }

        const duracao = Math.max(120, CONFIG.transicaoAudio);
        const inicio = performance.now();
        const volumeVideoInicial = video.volume;
        const volumeMusicaInicial = musica.volume;
        const volumeMusicaFinal = somLigado ? CONFIG.volumeMusica : 0;

        const animar = (agora) => {
          const progresso = Math.min(1, (agora - inicio) / duracao);
          const suave = progresso * progresso * (3 - 2 * progresso);

          video.volume = Math.max(0, volumeVideoInicial * (1 - suave));
          musica.volume =
            volumeMusicaInicial +
            (volumeMusicaFinal - volumeMusicaInicial) * suave;

          if (progresso < 1) {
            rafAudio = requestAnimationFrame(animar);
            return;
          }

          video.volume = 0;
          musica.volume = volumeMusicaFinal;
          aoFinalizar();
        };

        rafAudio = requestAnimationFrame(animar);
      }

      async function iniciarConvite() {
        if (conviteAberto) return;
        conviteAberto = true;

        await imagensCarregadas.final.catch(() => false);

        videoTela.style.visibility = "visible";
        videoTela.classList.remove("saindo");
        videoTela.classList.add("ativo");

        iniciarMusicaSilenciosa();
        video.volume = 1;

        try {
          video.currentTime = 0;
        } catch (_) {}

        try {
          await video.play();
        } catch (_) {
          esconderCapa();
          finalizarVideo();
          return;
        }

        esconderCapa();

        pular.classList.add("visivel");
        clearTimeout(timerPular);
        timerPular = setTimeout(() => {
          pular.classList.remove("visivel");
        }, CONFIG.tempoPular);

        acompanharFinal();
      }

      function acompanharFinal() {
        cancelAnimationFrame(rafFim);

        const verificar = () => {
          if (finalizando || finalAtivo) return;

          manterSincronia();

          if (Number.isFinite(video.duration) && video.duration > 0) {
            const restante = video.duration - video.currentTime;

            if (restante > 0 && restante <= 0.45) {
              finalizarVideo();
              return;
            }
          }

          rafFim = requestAnimationFrame(verificar);
        };

        rafFim = requestAnimationFrame(verificar);
      }

      async function finalizarVideo() {
        if (finalizando || finalAtivo) return;

        /*
           Se foi PULAR, alinha uma última vez ENQUANTO o MP3
           ainda está no volume técnico. Depois disso, zero seek.
        */
        manterSincronia(true);

        finalizando = true;
        clearTimeout(timerPular);
        cancelAnimationFrame(rafFim);
        pular.classList.remove("visivel");

        await imagensCarregadas.final.catch(() => false);

        finalTela.classList.add("ativo");
        videoTela.classList.add("saindo");

        transicaoSuaveAudio(() => {
          video.pause();

          videoTela.classList.remove("ativo");
          videoTela.classList.remove("saindo");
          videoTela.style.visibility = "hidden";

          video.volume = 1;
          finalAtivo = true;
          finalizando = false;

          if (audioDisponivel) {
            controleSom.classList.add("visivel");
          }
        });
      }

      function abrirLink(link) {
        if (!link) return;
        window.location.href = link;
      }

      function fecharPaginasInternas() {
        paginaPresentes.classList.remove("ativa");
        paginaPedido.classList.remove("ativa");
        fecharModalPix();

        if (finalAtivo && audioDisponivel) {
          controleSom.classList.add("visivel");
        }
      }

      function abrirPagina(pagina) {
        fecharPaginasInternas();
        pagina.classList.add("ativa");
        controleSom.classList.remove("visivel");
      }

      function abrirModalPix() {
        modalPix.classList.add("ativo");
        copiarPix.textContent = "Copiar chave Pix";
      }

      function fecharModalPix() {
        modalPix.classList.remove("ativo");
        clearTimeout(timerTextoPix);
        copiarPix.textContent = "Copiar chave Pix";
      }

      function copiarComFallback(texto) {
        const textarea = document.createElement("textarea");
        textarea.value = texto;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        textarea.style.pointerEvents = "none";

        document.body.appendChild(textarea);
        textarea.select();
        textarea.setSelectionRange(0, textarea.value.length);

        let sucesso = false;

        try {
          sucesso = document.execCommand("copy");
        } catch (_) {
          sucesso = false;
        }

        textarea.remove();
        return sucesso;
      }

      function mostrarCopiado() {
        clearTimeout(timerTextoPix);
        copiarPix.textContent = "Chave copiada ✓";

        timerTextoPix = setTimeout(() => {
          copiarPix.textContent = "Copiar chave Pix";
        }, 2200);
      }

      async function copiarChavePix() {
        const chave = CONFIG.pix.chave;

        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(chave);
            mostrarCopiado();
            return;
          }
        } catch (_) {}

        if (copiarComFallback(chave)) {
          mostrarCopiado();
          return;
        }

        window.prompt("Copie a chave Pix:", chave);
      }

      function alternarSom() {
        if (!audioDisponivel) return;

        somLigado = !somLigado;
        musica.volume = somLigado ? CONFIG.volumeMusica : 0;

        controleSom.classList.toggle("mudo", !somLigado);
      }

      function tratarVisibilidade() {
        if (document.hidden) {
          videoEstavaTocando =
            !video.paused &&
            !finalAtivo &&
            !finalizando;

          musicaEstavaTocando = !musica.paused;

          if (videoEstavaTocando) video.pause();
          if (musicaEstavaTocando) musica.pause();
          return;
        }

        if (videoEstavaTocando && !finalAtivo) {
          video
            .play()
            .then(acompanharFinal)
            .catch(() => {});
        }

        if (musicaEstavaTocando && audioDisponivel) {
          musica.play().catch(() => {});
        }

        videoEstavaTocando = false;
        musicaEstavaTocando = false;
      }

      /* EVENTOS PRINCIPAIS */
      abrirConvite.addEventListener("click", iniciarConvite);
      pular.addEventListener("click", finalizarVideo);

      video.addEventListener("playing", esconderCapa);

      video.addEventListener("timeupdate", () => {
        if (finalizando || finalAtivo) return;

        manterSincronia();

        if (
          Number.isFinite(video.duration) &&
          video.duration > 0 &&
          (video.duration - video.currentTime) <= 0.45
        ) {
          finalizarVideo();
        }
      });

      video.addEventListener("ended", finalizarVideo);

      video.addEventListener("error", () => {
        if (conviteAberto && !finalAtivo) {
          esconderCapa();
          finalizarVideo();
        }
      });

      musica.addEventListener("error", () => {
        audioDisponivel = false;
        controleSom.classList.remove("visivel");
      });

      /* CARD FINAL */
      hotspotConfirmacao.addEventListener("click", () => {
        abrirLink(CONFIG.linkConfirmacao);
      });

      hotspotLocalizacao.addEventListener("click", () => {
        abrirLink(CONFIG.linkLocalizacao);
      });

      hotspotPresentes.addEventListener("click", () => {
        abrirPagina(paginaPresentes);
      });

      hotspotPedido.addEventListener("click", () => {
        abrirPagina(paginaPedido);
      });

      /* PÁGINAS INTERNAS */
      voltarPresentes.addEventListener("click", fecharPaginasInternas);
      voltarPedido.addEventListener("click", fecharPaginasInternas);

      /* PIX */
      botaoPix.addEventListener("click", abrirModalPix);
      fecharPix.addEventListener("click", fecharModalPix);
      copiarPix.addEventListener("click", copiarChavePix);

      modalPix.addEventListener("click", (event) => {
        if (event.target === modalPix) {
          fecharModalPix();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && modalPix.classList.contains("ativo")) {
          fecharModalPix();
        }
      });

      /* SOM */
      controleSom.addEventListener("click", alternarSom);

      /* PAUSA AO SAIR DO NAVEGADOR / RETOMADA AO VOLTAR */
      document.addEventListener("visibilitychange", tratarVisibilidade);

      window.addEventListener("pageshow", (event) => {
        if (
          event.persisted &&
          finalAtivo &&
          audioDisponivel
        ) {
          musica.volume = somLigado ? CONFIG.volumeMusica : 0;
          musica.play().catch(() => {});
        }
      });

      /* BLOQUEIOS CASUAIS */
      document.addEventListener("contextmenu", (event) => {
        event.preventDefault();
      });

      document.addEventListener("dragstart", (event) => {
        event.preventDefault();
      });
    })();
  </script>
</body>
</html>

  <script>

    (() => {

      "use strict";


      /* ==================================================
         ELEMENTOS
      ================================================== */

      const capaTela =
        document.getElementById(
          "capaTela"
        );


      const videoTela =
        document.getElementById(
          "videoTela"
        );


      const finalTela =
        document.getElementById(
          "finalTela"
        );


      const popupPresentes =
        document.getElementById(
          "popupPresentes"
        );


      const popupPedido =
        document.getElementById(
          "popupPedido"
        );


      const capaImagem =
        document.getElementById(
          "capaImagem"
        );


      const finalImagem =
        document.getElementById(
          "finalImagem"
        );


      const presentesImagem =
        document.getElementById(
          "presentesImagem"
        );


      const pedidoImagem =
        document.getElementById(
          "pedidoImagem"
        );


      const video =
        document.getElementById(
          "video"
        );


      const musica =
        document.getElementById(
          "musica"
        );


      const abrirConvite =
        document.getElementById(
          "abrirConvite"
        );


      const pular =
        document.getElementById(
          "pular"
        );


      const controleSom =
        document.getElementById(
          "controleSom"
        );


      const hotspotConfirmar =
        document.getElementById(
          "hotspotConfirmar"
        );


      const hotspotLocalizacao =
        document.getElementById(
          "hotspotLocalizacao"
        );


      const hotspotPresentes =
        document.getElementById(
          "hotspotPresentes"
        );


      const hotspotPedido =
        document.getElementById(
          "hotspotPedido"
        );


      const voltarPresentes =
        document.getElementById(
          "voltarPresentes"
        );


      const voltarPedido =
        document.getElementById(
          "voltarPedido"
        );


      /* ==================================================
         ESTADO
      ================================================== */

      let conviteAberto =
        false;


      let finalAtivo =
        false;


      let finalizando =
        false;


      let somLigado =
        true;


      let audioDisponivel =
        true;


      let timerPular =
        null;


      let rafFim =
        null;


      let rafAudio =
        null;


      let ultimoAjusteSincronia =
        0;


      let videoEstavaTocando =
        false;


      let musicaEstavaTocando =
        false;


      /* ==================================================
         IMAGENS PNG / JPG / JPEG
      ================================================== */

      const EXTENSOES =
        [
          ".png",
          ".jpg",
          ".jpeg"
        ];


      function resolverImagem(
        elemento,
        base
      ) {

        return new Promise(
          resolve => {

            let indice =
              0;


            const tentar =
              () => {

                if (
                  indice >=
                  EXTENSOES.length
                ) {

                  console.error(
                    "Imagem não encontrada:",
                    base
                  );


                  resolve(
                    false
                  );


                  return;

                }


                const extensao =
                  EXTENSOES[
                    indice++
                  ];


                elemento.onload =
                  async () => {

                    elemento.onload =
                      null;


                    elemento.onerror =
                      null;


                    if (
                      typeof elemento.decode ===
                      "function"
                    ) {

                      await elemento
                        .decode()
                        .catch(
                          () => {}
                        );

                    }


                    resolve(
                      true
                    );

                  };


                elemento.onerror =
                  tentar;


                elemento.src =
                  base
                  +
                  extensao
                  +
                  "?v="
                  +
                  CONFIG.versao;

              };


            tentar();

          }
        );

      }


      const imagensCarregadas =
        {

          capa:
            resolverImagem(
              capaImagem,
              CONFIG.imagens.capa
            ),

          final:
            resolverImagem(
              finalImagem,
              CONFIG.imagens.final
            ),

          presentes:
            resolverImagem(
              presentesImagem,
              CONFIG.imagens.presentes
            ),

          pedido:
            resolverImagem(
              pedidoImagem,
              CONFIG.imagens.pedido
            )

        };


      /* ==================================================
         HOTSPOTS
      ================================================== */

      function posicionar(
        elemento,
        dados
      ) {

        elemento.style.left =
          dados.left;


        elemento.style.top =
          dados.top;


        elemento.style.width =
          dados.width;


        elemento.style.height =
          dados.height;

      }


      posicionar(
        hotspotConfirmar,
        CONFIG.hotspotsFinal.confirmar
      );


      posicionar(
        hotspotLocalizacao,
        CONFIG.hotspotsFinal.localizacao
      );


      posicionar(
        hotspotPresentes,
        CONFIG.hotspotsFinal.presentes
      );


      posicionar(
        hotspotPedido,
        CONFIG.hotspotsFinal.pedido
      );


      posicionar(
        voltarPresentes,
        CONFIG.popupPresentes.voltar
      );


      posicionar(
        voltarPedido,
        CONFIG.popupPedido.voltar
      );


      /* ==================================================
         CAPA
      ================================================== */

      function esconderCapa() {

        if (
          capaTela
            .classList
            .contains(
              "saindo"
            )
        ) {

          return;

        }


        capaTela
          .classList
          .add(
            "saindo"
          );


        setTimeout(
          () => {

            capaTela.style.visibility =
              "hidden";

          },
          200
        );

      }


      /* ==================================================
         MÚSICA CONTÍNUA

         O MP3 começa junto com o vídeo e NÃO PARA.
         Enquanto o vídeo toca, fica em 0.001.
      ================================================== */

      function iniciarMusicaSilenciosa() {

        musica.volume =
          0.001;


        /*
           Sincronizamos uma única vez
           ANTES de começar.
        */

        try {

          musica.currentTime =
            Math.max(
              0,
              CONFIG.inicioMusica
            );

        }

        catch (_) {}


        const tentativa =
          musica.play();


        if (
          tentativa
          &&
          typeof tentativa.catch ===
          "function"
        ) {

          tentativa.catch(
            () => {

              audioDisponivel =
                false;

            }
          );

        }

      }


      /* ==================================================
         SINCRONIA DURANTE O VÍDEO

         Se houver alguma diferença grande,
         corrigimos enquanto o MP3 está inaudível.

         NÃO fazemos seek na entrada do card.
      ================================================== */

      function manterSincronia() {

        if (
          !audioDisponivel
          ||
          finalAtivo
          ||
          finalizando
          ||
          video.paused
          ||
          musica.paused
        ) {

          return;

        }


        const agora =
          performance.now();


        /*
           Checamos no máximo uma vez por segundo.
        */

        if (
          agora
          -
          ultimoAjusteSincronia
          <
          1000
        ) {

          return;

        }


        ultimoAjusteSincronia =
          agora;


        const tempoEsperado =
          video.currentTime
          +
          CONFIG.inicioMusica;


        const diferenca =
          Math.abs(
            musica.currentTime
            -
            tempoEsperado
          );


        /*
           Só corrige se realmente saiu
           perceptivelmente de sincronia.
        */

        if (
          diferenca > 0.35
        ) {

          try {

            musica.currentTime =
              tempoEsperado;

          }

          catch (_) {}

        }

      }


      /* ==================================================
         CROSSFADE DE ÁUDIO

         AQUI ESTÁ A CORREÇÃO PRINCIPAL.

         Antes:
         vídeo acaba
         -> seek no MP3
         -> play()
         -> pequena cortada

         Agora:
         vídeo continua
         MP3 continua
         ↓
         abaixa áudio do vídeo
         enquanto aumenta o MP3
         ↓
         pausa vídeo só no final
      ================================================== */

      function transicaoSuaveAudio(
        aoFinalizar
      ) {

        cancelAnimationFrame(
          rafAudio
        );


        if (
          !audioDisponivel
        ) {

          video.volume =
            0;


          aoFinalizar();


          return;

        }


        const duracao =
          Math.max(
            120,
            CONFIG.transicaoAudio
          );


        const inicio =
          performance.now();


        const volumeVideoInicial =
          video.volume;


        const volumeMusicaInicial =
          musica.volume;


        const volumeMusicaFinal =
          somLigado
            ?
            CONFIG.volumeMusica
            :
            0;


        const animar =
          agora => {

            const progresso =
              Math.min(
                1,
                (
                  agora
                  -
                  inicio
                )
                /
                duracao
              );


            /*
               Curva suave.
            */

            const suave =
              progresso
              *
              progresso
              *
              (
                3
                -
                2
                *
                progresso
              );


            video.volume =
              Math.max(
                0,
                volumeVideoInicial
                *
                (
                  1
                  -
                  suave
                )
              );


            musica.volume =
              volumeMusicaInicial
              +
              (
                volumeMusicaFinal
                -
                volumeMusicaInicial
              )
              *
              suave;


            if (
              progresso < 1
            ) {

              rafAudio =
                requestAnimationFrame(
                  animar
                );


              return;

            }


            video.volume =
              0;


            musica.volume =
              volumeMusicaFinal;


            aoFinalizar();

          };


        rafAudio =
          requestAnimationFrame(
            animar
          );

      }


      /* ==================================================
         ABRIR CONVITE
      ================================================== */

      async function iniciarConvite() {

        if (
          conviteAberto
        ) {

          return;

        }


        conviteAberto =
          true;


        await imagensCarregadas.final
          .catch(
            () => false
          );


        videoTela.style.visibility =
          "visible";


        videoTela
          .classList
          .remove(
            "saindo"
          );


        videoTela
          .classList
          .add(
            "ativo"
          );


        /*
           Começa o MP3 no mesmo gesto
           que inicia o vídeo.
        */

        iniciarMusicaSilenciosa();


        /*
           Garante volume normal
           do áudio embutido no vídeo.
        */

        video.volume =
          1;


        try {

          await video.play();

        }

        catch (_) {

          finalizarVideo();

          esconderCapa();

          return;

        }


        esconderCapa();


        pular
          .classList
          .add(
            "visivel"
          );


        clearTimeout(
          timerPular
        );


        timerPular =
          setTimeout(
            () => {

              pular
                .classList
                .remove(
                  "visivel"
                );

            },
            CONFIG.tempoPular
          );


        acompanharFinal();

      }


      /* ==================================================
         VÍDEO → FINAL
      ================================================== */

      function acompanharFinal() {

        cancelAnimationFrame(
          rafFim
        );


        const verificar =
          () => {

            if (
              finalizando
              ||
              finalAtivo
            ) {

              return;

            }


            /*
               Mantém o MP3 alinhado enquanto
               ele ainda está praticamente inaudível.
            */

            manterSincronia();


            if (
              Number.isFinite(
                video.duration
              )
              &&
              video.duration > 0
            ) {

              const restante =
                video.duration
                -
                video.currentTime;


              if (
                restante > 0
                &&
                restante <= 0.45
              ) {

                finalizarVideo();

                return;

              }

            }


            rafFim =
              requestAnimationFrame(
                verificar
              );

          };


        rafFim =
          requestAnimationFrame(
            verificar
          );

      }


      /* ==================================================
         FINAL SEM CORTE DE MÚSICA
      ================================================== */

      async function finalizarVideo() {

        if (
          finalizando
          ||
          finalAtivo
        ) {

          return;

        }


        finalizando =
          true;


        clearTimeout(
          timerPular
        );


        cancelAnimationFrame(
          rafFim
        );


        pular
          .classList
          .remove(
            "visivel"
          );


        await imagensCarregadas.final
          .catch(
            () => false
          );


        /*
           Card já está atrás do vídeo.
        */

        finalTela
          .classList
          .add(
            "ativo"
          );


        /*
           Fade visual do vídeo.
        */

        videoTela
          .classList
          .add(
            "saindo"
          );


        /*
           MUITO IMPORTANTE:

           Aqui NÃO:
           - mudamos musica.currentTime
           - chamamos musica.play()

           O MP3 já está tocando.

           Apenas cruzamos os volumes.
        */

        transicaoSuaveAudio(
          () => {

            video.pause();


            videoTela
              .classList
              .remove(
                "ativo"
              );


            videoTela
              .classList
              .remove(
                "saindo"
              );


            videoTela.style.visibility =
              "hidden";


            /*
               Restauramos o volume do vídeo
               apenas internamente.
               Ele já está pausado.
            */

            video.volume =
              1;


            finalAtivo =
              true;


            finalizando =
              false;


            if (
              audioDisponivel
            ) {

              controleSom
                .classList
                .add(
                  "visivel"
                );

            }

          }
        );

      }


      /* ==================================================
         POPUPS
      ================================================== */

      function fecharPopups() {

        popupPresentes
          .classList
          .remove(
            "ativo"
          );


        popupPedido
          .classList
          .remove(
            "ativo"
          );


        if (
          finalAtivo
          &&
          audioDisponivel
        ) {

          controleSom
            .classList
            .add(
              "visivel"
            );

        }

      }


      async function abrirPopup(
        popup,
        promessaImagem
      ) {

        await promessaImagem
          .catch(
            () => false
          );


        fecharPopups();


        popup
          .classList
          .add(
            "ativo"
          );


        controleSom
          .classList
          .remove(
            "visivel"
          );

      }


      /* ==================================================
         SOM
      ================================================== */

      function alternarSom() {

        if (
          !audioDisponivel
        ) {

          return;

        }


        somLigado =
          !somLigado;


        musica.volume =
          somLigado
            ?
            CONFIG.volumeMusica
            :
            0;


        controleSom
          .classList
          .toggle(
            "mudo",
            !somLigado
          );

      }


      /* ==================================================
         LINKS
      ================================================== */

      function abrirLink(
        link
      ) {

        if (
          !link
        ) {

          return;

        }


        window.location.href =
          link;

      }


      /* ==================================================
         VISIBILIDADE
      ================================================== */

      function tratarVisibilidade() {

        if (
          document.hidden
        ) {

          videoEstavaTocando =
            !video.paused
            &&
            !finalAtivo
            &&
            !finalizando;


          musicaEstavaTocando =
            !musica.paused;


          if (
            videoEstavaTocando
          ) {

            video.pause();

          }


          if (
            musicaEstavaTocando
          ) {

            musica.pause();

          }


          return;

        }


        if (
          videoEstavaTocando
          &&
          !finalAtivo
        ) {

          /*
             Ao voltar durante o vídeo,
             retomamos ambos.
          */

          video
            .play()
            .then(
              acompanharFinal
            )
            .catch(
              () => {}
            );

        }


        if (
          musicaEstavaTocando
          &&
          audioDisponivel
        ) {

          musica
            .play()
            .catch(
              () => {}
            );

        }


        videoEstavaTocando =
          false;


        musicaEstavaTocando =
          false;

      }


      /* ==================================================
         EVENTOS
      ================================================== */

      abrirConvite
        .addEventListener(
          "click",
          iniciarConvite
        );


      pular
        .addEventListener(
          "click",
          finalizarVideo
        );


      video
        .addEventListener(
          "playing",
          esconderCapa
        );


      video
        .addEventListener(
          "timeupdate",
          () => {

            if (
              finalizando
              ||
              finalAtivo
            ) {

              return;

            }


            manterSincronia();


            if (
              Number.isFinite(
                video.duration
              )
              &&
              video.duration > 0
              &&
              (
                video.duration
                -
                video.currentTime
              )
              <=
              0.45
            ) {

              finalizarVideo();

            }

          }
        );


      video
        .addEventListener(
          "ended",
          finalizarVideo
        );


      /* ==================================================
         CARD FINAL
      ================================================== */

      hotspotConfirmar
        .addEventListener(
          "click",
          event => {

            event.preventDefault();

            event.stopPropagation();


            abrirLink(
              CONFIG.linkConfirmacao
            );

          }
        );


      hotspotLocalizacao
        .addEventListener(
          "click",
          event => {

            event.preventDefault();

            event.stopPropagation();


            abrirLink(
              CONFIG.linkLocalizacao
            );

          }
        );


      hotspotPresentes
        .addEventListener(
          "click",
          event => {

            event.preventDefault();

            event.stopPropagation();


            abrirPopup(
              popupPresentes,
              imagensCarregadas.presentes
            );

          }
        );


      hotspotPedido
        .addEventListener(
          "click",
          event => {

            event.preventDefault();

            event.stopPropagation();


            abrirPopup(
              popupPedido,
              imagensCarregadas.pedido
            );

          }
        );


      /* ==================================================
         VOLTAR
      ================================================== */

      voltarPresentes
        .addEventListener(
          "click",
          fecharPopups
        );


      voltarPedido
        .addEventListener(
          "click",
          fecharPopups
        );


      /* ==================================================
         SOM
      ================================================== */

      controleSom
        .addEventListener(
          "click",
          alternarSom
        );


      /* ==================================================
         APP
      ================================================== */

      document
        .addEventListener(
          "visibilitychange",
          tratarVisibilidade
        );


      /* ==================================================
         BLOQUEIOS CASUAIS
      ================================================== */

      document
        .addEventListener(
          "contextmenu",
          event => {

            event.preventDefault();

          }
        );


      document
        .addEventListener(
          "dragstart",
          event => {

            event.preventDefault();

          }
        );


    })();

  </script>

</body>

</html>

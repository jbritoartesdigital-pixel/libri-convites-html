  <style>

    @media (prefers-reduced-motion: reduce) {
      #capaTela, .modal, .modal-card, #seloHoje {
        transition-duration: 1ms !important;

  </style>
</head>

  <audio id="musica" preload="metadata" loop></audio>

  <script>
    (() => {
      "use strict";

      const finalTela = document.getElementById("finalTela");
      const capaTela = document.getElementById("capaTela");

      const capaImagem = document.getElementById("capaImagem");
      const finalImagem = document.getElementById("finalImagem");
      const presentesImagem = document.getElementById("presentesImagem");

      const videoCard = document.getElementById("videoCard");
      const musica = document.getElementById("musica");

      const abrirConvite = document.getElementById("abrirConvite");
      const controleSom = document.getElementById("controleSom");

      const hotspotConfirmacao = document.getElementById("hotspotConfirmacao");
      const hotspotLocalizacao = document.getElementById("hotspotLocalizacao");
      const hotspotPresentes = document.getElementById("hotspotPresentes");

      const seloHoje = document.getElementById("seloHoje");

      const modalLocalizacao = document.getElementById("modalLocalizacao");
      const modalPresentes = document.getElementById("modalPresentes");

      const kickerLocalizacao = document.getElementById("kickerLocalizacao");
      const tituloLocalizacao = document.getElementById("tituloLocalizacao");
      const tipoLocal = document.getElementById("tipoLocal");
      const enderecoTexto = document.getElementById("enderecoTexto");
      const obsLocalTitulo = document.getElementById("obsLocalTitulo");
      const obsLocalTexto = document.getElementById("obsLocalTexto");

      const abrirGoogleMaps = document.getElementById("abrirGoogleMaps");
      const abrirWaze = document.getElementById("abrirWaze");
      const fecharLocalizacao = document.getElementById("fecharLocalizacao");
      const fecharPresentes = document.getElementById("fecharPresentes");
      const presentesFallback = document.getElementById("presentesFallback");

      let conviteAberto = false;
      let somLigado = true;
      let audioDisponivel = true;
      let videoEstavaTocando = false;
      let musicaEstavaTocando = false;
      let rafAudio = null;
      let timerSeloHoje = null;
      let midiaAquecida = false;

      const urlArquivo = (caminho) =>
        `${caminho}?v=${encodeURIComponent(CONFIG.versaoArquivos)}`;

      function urlMidia(arquivo) {
        const partes = arquivo
          .split("/")
          .map((parte) => encodeURIComponent(parte))
          .join("/");
        return `${CONFIG.hostMidia}/${CONFIG.pastaCliente}/${partes}?v=${encodeURIComponent(CONFIG.versaoMidia)}`;
      }

      const EXTENSOES_IMAGEM = [".jpg", ".jpeg", ".png", ".webp", ".avif"];

      function temExtensaoImagem(caminho) {
        const limpo = String(caminho || "").split("?")[0].split("#")[0];
        return /\.(?:jpe?g|png|webp|avif)$/i.test(limpo);
      }

      async function resolverImagem(elemento, caminhoBase) {
        if (!elemento || !caminhoBase) return false;

        const bases = Array.isArray(caminhoBase)
          ? caminhoBase.filter(Boolean)
          : [caminhoBase];

        const candidatos = [];

        for (const base of bases) {
          if (temExtensaoImagem(base)) {
            candidatos.push(base);
          } else {
            for (const extensao of EXTENSOES_IMAGEM) {
              candidatos.push(`${base}${extensao}`);
            }
          }
        }

        for (const candidato of candidatos) {
          const carregou = await new Promise((resolve) => {
            const ok = async () => {
              elemento.removeEventListener("error", erro);
              if (typeof elemento.decode === "function") {
                await elemento.decode().catch(() => {});
              }
              resolve(true);
            };
            const erro = () => {
              elemento.removeEventListener("load", ok);
              resolve(false);
            };

            elemento.addEventListener("load", ok, { once: true });
            elemento.addEventListener("error", erro, { once: true });
            elemento.src = urlArquivo(candidato);
          });

          if (carregou) return candidato;
        }

        return false;
      }

      const capaCarregada = resolverImagem(capaImagem, CONFIG.imagens.capa);
      const finalCarregado = resolverImagem(finalImagem, CONFIG.imagens.final);
      const presentesCarregado = resolverImagem(presentesImagem, CONFIG.imagens.presentes);

      videoCard.src = urlMidia(CONFIG.videoArquivo);
      musica.src = urlMidia(CONFIG.musicaArquivo);

      videoCard.preload = "metadata";
      musica.preload = "metadata";
      videoCard.load();
      musica.load();

      function aquecerMidia() {
        if (midiaAquecida) return;
        midiaAquecida = true;
        videoCard.preload = "auto";
        musica.preload = "auto";
        videoCard.load();
        musica.load();
      }

      if ("requestIdleCallback" in window) {
        requestIdleCallback(aquecerMidia, { timeout: 1400 });
      } else {
        setTimeout(aquecerMidia, 550);
      }

      function posicionar(elemento, dados) {
        elemento.style.left = dados.left;
        elemento.style.top = dados.top;
        elemento.style.width = dados.width;
        elemento.style.height = dados.height;
      }

      posicionar(hotspotConfirmacao, CONFIG.hotspotsFinal.confirmacao);
      posicionar(hotspotLocalizacao, CONFIG.hotspotsFinal.localizacao);
      posicionar(hotspotPresentes, CONFIG.hotspotsFinal.presentes);

      kickerLocalizacao.textContent = CONFIG.local.kicker;
      tituloLocalizacao.textContent = CONFIG.local.nome;
      tipoLocal.textContent = CONFIG.local.tipo;
      obsLocalTitulo.textContent = CONFIG.local.observacaoTitulo;
      obsLocalTexto.textContent = CONFIG.local.observacaoTexto;

      abrirGoogleMaps.textContent = CONFIG.botoes.maps;
      abrirWaze.textContent = CONFIG.botoes.waze;
      fecharLocalizacao.textContent = CONFIG.botoes.fechar;

      enderecoTexto.innerHTML = [
        CONFIG.local.linha1,
        CONFIG.local.linha2,
        CONFIG.local.linha3,
        `CEP ${CONFIG.local.cep}`
      ].join("<br>");

      function esconderCapa() {
        if (capaTela.classList.contains("saindo")) return;
        capaTela.classList.add("saindo");
        setTimeout(() => {
          capaTela.style.visibility = "hidden";
        }, 200);
      }

      function aguardarPrimeiroFrame(timeoutMs = 2200) {
        return new Promise((resolve) => {
          let finalizado = false;
          let timer = null;

          const done = () => {
            if (finalizado) return;
            finalizado = true;
            clearTimeout(timer);
            resolve(true);
          };

          timer = setTimeout(done, timeoutMs);

          if (typeof videoCard.requestVideoFrameCallback === "function") {
            videoCard.requestVideoFrameCallback(() => done());
            return;
          }

          if (videoCard.readyState >= 2) {
            requestAnimationFrame(done);
            return;
          }

          videoCard.addEventListener("loadeddata", done, { once: true });
        });
      }

      function subirMusica() {
        cancelAnimationFrame(rafAudio);
        if (!audioDisponivel || musica.paused || !somLigado) return;

        const duracao = Math.max(120, CONFIG.transicaoAudio);
        const inicio = performance.now();
        const inicial = musica.volume;
        const final = CONFIG.volumeMusica;

        const animar = (agora) => {
          const p = Math.min(1, (agora - inicio) / duracao);
          const suave = p * p * (3 - 2 * p);
          musica.volume = inicial + (final - inicial) * suave;
          if (p < 1) rafAudio = requestAnimationFrame(animar);
        };

        rafAudio = requestAnimationFrame(animar);
      }

      function iniciarMusica() {
        musica.volume = 0.001;
        const tentativa = musica.play();

        if (tentativa && typeof tentativa.then === "function") {
          tentativa.then(subirMusica).catch(() => {
            audioDisponivel = false;
            controleSom.classList.remove("visivel");
          });
        }
      }

      function dataAtualSaoPaulo() {
        try {
          const partes = new Intl.DateTimeFormat("en-CA", {
            timeZone: "America/Sao_Paulo",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
          }).formatToParts(new Date());

          const mapa = {};
          for (const parte of partes) mapa[parte.type] = parte.value;
          return `${mapa.year}-${mapa.month}-${mapa.day}`;
        } catch (_) {
          const agora = new Date();
          const ano = agora.getFullYear();
          const mes = String(agora.getMonth() + 1).padStart(2, "0");
          const dia = String(agora.getDate()).padStart(2, "0");
          return `${ano}-${mes}-${dia}`;
        }
      }

      function mostrarSeloHoje() {
        if (dataAtualSaoPaulo() !== CONFIG.evento.data) return;
        seloHoje.textContent = CONFIG.evento.mensagemHoje;
        seloHoje.classList.add("visivel");
        clearTimeout(timerSeloHoje);
        timerSeloHoje = setTimeout(() => {
          seloHoje.classList.remove("visivel");
        }, 6500);
      }

      function abrirModal(modal, foco) {
        modal.classList.add("aberto");
        requestAnimationFrame(() => foco && foco.focus());
      }

      function fecharModal(modal, focoRetorno) {
        modal.classList.remove("aberto");
        if (focoRetorno) focoRetorno.focus();
      }

      async function iniciarConvite() {
        if (conviteAberto) return;
        conviteAberto = true;

        aquecerMidia();
        await Promise.all([capaCarregada.catch(() => false), finalCarregado.catch(() => false)]);

        finalTela.classList.add("ativo");
        iniciarMusica();

        try { videoCard.currentTime = 0; } catch (_) {}

        try {
          await videoCard.play();
          await aguardarPrimeiroFrame();
        } catch (_) {
          videoCard.classList.add("falhou");
        }

        esconderCapa();

        if (audioDisponivel) {
          controleSom.classList.add("visivel");
        }

        mostrarSeloHoje();
      }

      function abrirConfirmacao() {
        const texto = encodeURIComponent(CONFIG.mensagemWhatsapp);
        const url = `https://wa.me/${CONFIG.numeroWhatsapp}?text=${texto}`;
        window.location.href = url;
      }

      function abrirModalLocalizacao() {
        abrirModal(modalLocalizacao, fecharLocalizacao);
      }

      async function abrirModalPresentes() {
        const carregou = await presentesCarregado.catch(() => false);
        presentesImagem.style.display = carregou ? "block" : "none";
        presentesFallback.style.display = carregou ? "none" : "block";
        abrirModal(modalPresentes, fecharPresentes);
      }

      function alternarSom() {
        if (!audioDisponivel) return;
        somLigado = !somLigado;
        musica.volume = somLigado ? CONFIG.volumeMusica : 0;
        controleSom.classList.toggle("mudo", !somLigado);
      }

      function tratarVisibilidade() {
        if (document.hidden) {
          videoEstavaTocando = !videoCard.paused;
          musicaEstavaTocando = !musica.paused;
          if (videoEstavaTocando) videoCard.pause();
          if (musicaEstavaTocando) musica.pause();
          return;
        }

        if (conviteAberto && videoEstavaTocando) videoCard.play().catch(() => {});
        if (conviteAberto && musicaEstavaTocando && audioDisponivel) musica.play().catch(() => {});
        videoEstavaTocando = false;
        musicaEstavaTocando = false;
      }

      abrirConvite.addEventListener("click", iniciarConvite);
      hotspotConfirmacao.addEventListener("click", abrirConfirmacao);
      hotspotLocalizacao.addEventListener("click", abrirModalLocalizacao);
      hotspotPresentes.addEventListener("click", abrirModalPresentes);

      abrirGoogleMaps.addEventListener("click", () => {
        window.location.href = CONFIG.linkGoogleMaps;
      });

      abrirWaze.addEventListener("click", () => {
        window.location.href = CONFIG.linkWaze;
      });

      fecharLocalizacao.addEventListener("click", () => {
        fecharModal(modalLocalizacao, hotspotLocalizacao);
      });

      fecharPresentes.addEventListener("click", () => {
        fecharModal(modalPresentes, hotspotPresentes);
      });

      modalLocalizacao.addEventListener("click", (event) => {
        if (event.target === modalLocalizacao) fecharModal(modalLocalizacao, hotspotLocalizacao);
      });

      modalPresentes.addEventListener("click", (event) => {
        if (event.target === modalPresentes) fecharModal(modalPresentes, hotspotPresentes);
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        if (modalLocalizacao.classList.contains("aberto")) {
          fecharModal(modalLocalizacao, hotspotLocalizacao);
          return;
        }
        if (modalPresentes.classList.contains("aberto")) {
          fecharModal(modalPresentes, hotspotPresentes);
        }
      });

      controleSom.addEventListener("click", alternarSom);

      videoCard.addEventListener("error", () => {
        videoCard.classList.add("falhou");
      });

      musica.addEventListener("error", () => {
        audioDisponivel = false;
        controleSom.classList.remove("visivel");
      });

      document.addEventListener("visibilitychange", tratarVisibilidade);

      window.addEventListener("pageshow", (event) => {
        if (!event.persisted || !conviteAberto) return;
        videoCard.play().catch(() => {});
        if (audioDisponivel) {
          musica.volume = somLigado ? CONFIG.volumeMusica : 0;
          musica.play().catch(() => {});
        }
      });

      document.addEventListener("contextmenu", (event) => event.preventDefault());
      document.addEventListener("dragstart", (event) => event.preventDefault());
    })();
  </script>
</body>
</html>

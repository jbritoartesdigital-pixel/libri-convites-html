      const urlArquivo = (caminho) =>

      function urlMidia(arquivo) {
        const partes = arquivo
          .split("/")

          .join("/");

        return `${CONFIG.hostMidia}/${CONFIG.pastaCliente}/${partes}?v=${encodeURIComponent(CONFIG.versaoMidia)}`;
      }

      const EXTENSOES_IMAGEM = [

        ".png",
        ".webp",
        ".avif"
      ];

      function temExtensaoImagem(caminho) {
        const limpo = String(caminho || "")
          .split("?")[0]
          .split("#")[0];

        return /\.(?:jpe?g|png|webp|avif)$/i.test(limpo);
      }

      async function resolverImagem(elemento, caminhoBase) {
        if (!elemento || !caminhoBase) return false;

        const bases = Array.isArray(caminhoBase)
          ? caminhoBase.filter(Boolean)
          : [caminhoBase];

        const candidatos = [];

        for (const base of bases) {
          if (temExtensaoImagem(base)) {
            candidatos.push(base);
            continue;
          }

          for (const extensao of EXTENSOES_IMAGEM) {
            candidatos.push(`${base}${extensao}`);
          }
        }

        for (const candidato of candidatos) {
          const carregou = await new Promise((resolve) => {
            const aoCarregar = async () => {
              elemento.removeEventListener("error", aoFalhar);

              if (typeof elemento.decode === "function") {
                await elemento.decode().catch(() => {});
              }

              resolve(true);
            };

            const aoFalhar = () => {
              elemento.removeEventListener("load", aoCarregar);
              resolve(false);
            };

            elemento.addEventListener("load", aoCarregar, { once: true });
            elemento.addEventListener("error", aoFalhar, { once: true });

            elemento.src = urlArquivo(candidato);
          });

          if (carregou) {
            elemento.dataset.arquivoResolvido = candidato;
            return candidato;
          }
        }

        console.warn("[Libri] Imagem nÃ£o encontrada:", caminhoBase);
        return false;
      }

      const capaCarregada =
        resolverImagem(capaImagem, CONFIG.imagens.capa);

      const finalCarregado =
        resolverImagem(finalImagem, CONFIG.imagens.final);

      const presentesCarregado =
        resolverImagem(presentesImagem, CONFIG.imagens.presentes);

      /*
         Carregamento inteligente:
         conecta ao host cedo, comeÃ§a leve com metadata e aquece a mÃ­dia
         em idle enquanto a capa estÃ¡ sendo visualizada.
      */
      videoCard.src = urlMidia(CONFIG.videoArquivo);
      musica.src = urlMidia(CONFIG.musicaArquivo);

      videoCard.preload = "metadata";
      musica.preload = "metadata";

      videoCard.load();
      musica.load();

      let midiaAquecida = false;

      function aquecerMidia() {
        if (midiaAquecida) return;
        midiaAquecida = true;

        videoCard.preload = "auto";
        musica.preload = "auto";

        videoCard.load();
        musica.load();
      }

      const agendarAquecimento = () => {
        if ("requestIdleCallback" in window) {
          window.requestIdleCallback(aquecerMidia, { timeout: 1400 });
        } else {
          setTimeout(aquecerMidia, 550);
        }
      };

      capaCarregada
        .catch(() => false)
        .finally(agendarAquecimento);

      function posicionar(elemento, dados) {
        elemento.style.left = dados.left;
        elemento.style.top = dados.top;
        elemento.style.width = dados.width;
        elemento.style.height = dados.height;
      }

      posicionar(hotspotConfirmacao, CONFIG.hotspotsFinal.confirmacao);
      posicionar(hotspotLocalizacao, CONFIG.hotspotsFinal.localizacao);
      posicionar(hotspotPresentes, CONFIG.hotspotsFinal.presentes);

      function escaparHtml(texto) {
        return String(texto).replace(/[&<>"']/g, (caractere) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[caractere]));
      }

      tituloLocalizacao.textContent = CONFIG.local.nome;
      tipoLocal.textContent = CONFIG.local.tipo;

      enderecoTexto.innerHTML = [
        CONFIG.local.linha1,
        CONFIG.local.linha2,
        CONFIG.local.linha3,
        `CEP ${CONFIG.local.cep}`
      ].map(escaparHtml).join("<br>");

      kickerImportante.textContent = CONFIG.informacaoImportante.kicker;
      tituloImportante.textContent = CONFIG.informacaoImportante.titulo;
      textoImportante.textContent = CONFIG.informacaoImportante.texto;

      /*
         Evita qualquer frame preto:
         a capa sÃ³ sai depois que um frame real do vÃ­deo estiver disponÃ­vel.
      */
      function aguardarPrimeiroFrame(timeoutMs = 2200) {
        return new Promise((resolve) => {
          let resolvido = false;
          let timeout = null;

          const finalizar = () => {
            if (resolvido) return;
            resolvido = true;
            clearTimeout(timeout);
            resolve(true);
          };

          timeout = setTimeout(finalizar, timeoutMs);

          if (typeof videoCard.requestVideoFrameCallback === "function") {
            videoCard.requestVideoFrameCallback(() => finalizar());
            return;
          }

          if (videoCard.readyState >= 2) {
            requestAnimationFrame(finalizar);
            return;
          }

          videoCard.addEventListener("loadeddata", finalizar, { once: true });
        });
      }

      function esconderCapa() {
        if (capaTela.classList.contains("saindo")) return;

        capaTela.classList.add("saindo");

        setTimeout(() => {
          capaTela.style.visibility = "hidden";
        }, 200);
      }

      function subirMusica() {
        cancelAnimationFrame(rafAudio);

        if (!audioDisponivel || musica.paused || !somLigado) return;

        const duracao = Math.max(120, CONFIG.transicaoAudio);
        const inicio = performance.now();
        const volumeInicial = musica.volume;
        const volumeFinal = CONFIG.volumeMusica;

        const animar = (agora) => {
          const progresso = Math.min(1, (agora - inicio) / duracao);
          const suave = progresso * progresso * (3 - 2 * progresso);

          musica.volume =
            volumeInicial +
            (volumeFinal - volumeInicial) * suave;

          if (progresso < 1) {
            rafAudio = requestAnimationFrame(animar);
          }
        };

        rafAudio = requestAnimationFrame(animar);
      }

      function iniciarMusica() {
        musica.volume = 0.001;

        const tentativa = musica.play();

        if (tentativa && typeof tentativa.then === "function") {
          tentativa
            .then(subirMusica)
            .catch(() => {
              audioDisponivel = false;
              controleSom.classList.remove("visivel");
            });
        }
      }

      function dataAtualSaoPaulo() {
        try {
          const partes = new Intl.DateTimeFormat("en-CA", {
            timeZone: "America/Sao_Paulo",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
          }).formatToParts(new Date());

          const mapa = {};

          for (const parte of partes) {
            mapa[parte.type] = parte.value;
          }

          return `${mapa.year}-${mapa.month}-${mapa.day}`;
        } catch (_) {
          const agora = new Date();
          const ano = agora.getFullYear();
          const mes = String(agora.getMonth() + 1).padStart(2, "0");
          const dia = String(agora.getDate()).padStart(2, "0");
          return `${ano}-${mes}-${dia}`;
        }
      }

      function mostrarSeloHoje() {
        if (dataAtualSaoPaulo() !== CONFIG.evento.data) return;

        seloHoje.textContent = CONFIG.evento.mensagemHoje;
        seloHoje.classList.add("visivel");

        clearTimeout(timerSeloHoje);
        timerSeloHoje = setTimeout(() => {
          seloHoje.classList.remove("visivel");
        }, 6500);
      }

      function abrirModal(modal, foco) {
        modal.classList.add("aberto");

        requestAnimationFrame(() => {
          if (foco) foco.focus();
        });
      }

      function fecharModal(modal, focoRetorno) {
        modal.classList.remove("aberto");

        if (focoRetorno) {
          focoRetorno.focus();
        }
      }

      function programarAvisoImportante() {
        if (
          avisoImportanteMostrado ||
          !CONFIG.informacaoImportante.ativa
        ) {
          return;
        }

        avisoImportanteMostrado = true;

        clearTimeout(timerAvisoImportante);

        timerAvisoImportante = setTimeout(() => {
          abrirModal(modalImportante, fecharImportante);
        }, Math.max(0, CONFIG.informacaoImportante.atrasoAbertura || 0));
      }

      async function iniciarConvite() {
        if (conviteAberto) return;
        conviteAberto = true;

        aquecerMidia();

        await finalCarregado.catch(() => false);

        finalTela.classList.add("ativo");

        /*
           O play do Ã¡udio Ã© chamado dentro do gesto do usuÃ¡rio.
           A capa permanece por cima atÃ© o primeiro frame real do vÃ­deo.
        */
        iniciarMusica();

        try {
          videoCard.currentTime = 0;
        } catch (_) {}

        try {
          await videoCard.play();
          await aguardarPrimeiroFrame();
        } catch (_) {
          videoCard.classList.add("falhou");
        }

        esconderCapa();

        if (audioDisponivel) {
          controleSom.classList.add("visivel");
        }

        mostrarSeloHoje();
        programarAvisoImportante();
      }

      function abrirConfirmacao() {
        const texto = encodeURIComponent(CONFIG.mensagemWhatsapp);
        const url = `https://wa.me/${CONFIG.numeroWhatsapp}?text=${texto}`;
        window.location.href = url;
      }

      function abrirModalLocalizacao() {
        abrirModal(modalLocalizacao, fecharLocalizacao);
      }

      async function abrirModalPresentes() {
        const carregou = await presentesCarregado.catch(() => false);

        presentesImagem.style.display = carregou ? "block" : "none";
        presentesFallback.style.display = carregou ? "none" : "block";

        abrirModal(modalPresentes, fecharPresentes);
      }

      function alternarSom() {
        if (!audioDisponivel) return;

        somLigado = !somLigado;
        musica.volume = somLigado ? CONFIG.volumeMusica : 0;

        controleSom.classList.toggle("mudo", !somLigado);
      }

      function tratarVisibilidade() {
        if (document.hidden) {
          videoEstavaTocando = !videoCard.paused;
          musicaEstavaTocando = !musica.paused;

          if (videoEstavaTocando) videoCard.pause();
          if (musicaEstavaTocando) musica.pause();
          return;
        }

        if (conviteAberto && videoEstavaTocando) {
          videoCard.play().catch(() => {});
        }

        if (conviteAberto && musicaEstavaTocando && audioDisponivel) {
          musica.play().catch(() => {});
        }

        videoEstavaTocando = false;
        musicaEstavaTocando = false;
      }

      abrirConvite.addEventListener("click", iniciarConvite);

      hotspotConfirmacao.addEventListener("click", abrirConfirmacao);
      hotspotLocalizacao.addEventListener("click", abrirModalLocalizacao);
      hotspotPresentes.addEventListener("click", abrirModalPresentes);

      abrirGoogleMaps.addEventListener("click", () => {
        window.location.href = CONFIG.linkGoogleMaps;
      });

      abrirWaze.addEventListener("click", () => {
        window.location.href = CONFIG.linkWaze;
      });

      fecharLocalizacao.addEventListener("click", () => {
        fecharModal(modalLocalizacao, hotspotLocalizacao);
      });

      fecharPresentes.addEventListener("click", () => {
        fecharModal(modalPresentes, hotspotPresentes);
      });

      fecharImportante.addEventListener("click", () => {
        fecharModal(modalImportante, null);
      });

      modalLocalizacao.addEventListener("click", (event) => {
        if (event.target === modalLocalizacao) {
          fecharModal(modalLocalizacao, hotspotLocalizacao);
        }
      });

      modalPresentes.addEventListener("click", (event) => {
        if (event.target === modalPresentes) {
          fecharModal(modalPresentes, hotspotPresentes);
        }
      });

      modalImportante.addEventListener("click", (event) => {
        if (event.target === modalImportante) {
          fecharModal(modalImportante, null);
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;

        if (modalLocalizacao.classList.contains("aberto")) {
          fecharModal(modalLocalizacao, hotspotLocalizacao);
          return;
        }

        if (modalPresentes.classList.contains("aberto")) {
          fecharModal(modalPresentes, hotspotPresentes);
          return;
        }

        if (modalImportante.classList.contains("aberto")) {
          fecharModal(modalImportante, null);
        }
      });

      controleSom.addEventListener("click", alternarSom);

      videoCard.addEventListener("error", () => {
        videoCard.classList.add("falhou");
      });

      musica.addEventListener("error", () => {
        audioDisponivel = false;
        controleSom.classList.remove("visivel");
      });

      document.addEventListener("visibilitychange", tratarVisibilidade);

      window.addEventListener("pageshow", (event) => {
        if (!event.persisted || !conviteAberto) return;

        videoCard.play().catch(() => {});

        if (audioDisponivel) {
          musica.volume = somLigado ? CONFIG.volumeMusica : 0;
          musica.play().catch(() => {});
        }
      });

      document.addEventListener("contextmenu", (event) => {
        event.preventDefault();
      });

      document.addEventListener("dragstart", (event) => {
        event.preventDefault();
      });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- ==================================================
       🦁 ALTERE SOMENTE AQUI | METADADOS ESTÁTICOS 🦁
       O WhatsApp lê estas tags sem executar JavaScript.
  =================================================== -->
  <title>Modelo Safari | Convite Cinematográfico Longo</title>
  <meta name="description" content="Modelo demonstrativo de convite cinematográfico longo da Libri Convites. 🦁🌿">
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
  <meta name="theme-color" content="#315d32">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Modelo Safari | Convite Longo">
  <meta property="og:description" content="Conheça um modelo de convite cinematográfico longo da Libri Convites. 🦁🌿">
  <meta property="og:url" content="https://libriconvites.com.br/modelo-safari/">
  <meta property="og:image" content="https://libriconvites.com.br/modelo-safari/imagens/preview-otimizada.jpg?v=1">
  <meta property="og:image:secure_url" content="https://libriconvites.com.br/modelo-safari/imagens/preview-otimizada.jpg?v=1">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Modelo Safari | Convite Longo">
  <meta name="twitter:description" content="Conheça um modelo de convite cinematográfico longo da Libri Convites. 🦁🌿">
  <meta name="twitter:image" content="https://libriconvites.com.br/modelo-safari/imagens/preview-otimizada.jpg?v=1">

  <script>
    /* ==================================================
       🦁🦁🦁 ALTERE SOMENTE AQUI 🦁🦁🦁
    ================================================== */

    const CONFIG = {
      titulo: "Modelo Safari | Convite Longo",

      pastaCliente: "modelo-safari",
      hostMidia: "https://midia.libriconvites.com.br",

      videoArquivo: "abertura.mp4",
      musicaArquivo: "musica-safari.mp3",

      inicioMusica: 0,
      volumeMusica: 0.35,
      transicaoAudio: 260,
      tempoPular: 5000,

      versaoArquivos: "1",
      versaoMidia: "1",

      linkConfirmacao: "https://confirmacao.libriconvites.com.br/e/teste",
      linkLocalizacao: "https://www.google.com/maps/search/?api=1&query=Espa%C3%A7o%20Savana%20Encantada%2C%20Avenida%20dos%20Ip%C3%AAs%20180%2C%20Jardim%20das%20Ac%C3%A1cias%2C%20Goi%C3%A2nia%20GO",

      /*
         IMAGENS DO PROJETO:
         o motor aceita nome-base ou extensão explícita.
      */
      imagens: {
        capa: "imagens/capa.png",
        final: "final.png"
      },

      /* Áreas clicáveis sobre os dois botões desenhados no card final. */
      hotspotsFinal: {
        localizacao: {
          left: "20.0%",
          top: "73.0%",
          width: "59.5%",
          height: "7.4%"
        },
        confirmacao: {
          left: "20.0%",
          top: "80.4%",
          width: "59.5%",
          height: "7.4%"
        }
      }
    };

    /* ==================================================
       ⛔ DAQUI PARA BAIXO NÃO PRECISA EDITAR ⛔
    ================================================== */
  </script>

  <style>
    :root {
      --duracao-transicao: 220ms;
      --fundo: #000;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--fundo);
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    img,
    video {
      -webkit-user-drag: none;
      user-drag: none;
    }

    button {
      font: inherit;
      appearance: none;
      -webkit-appearance: none;
    }

    .tela {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: var(--fundo);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    @supports (height: 100dvh) {
      .tela { height: 100dvh; }
    }

    .quadro {
      position: relative;
      width: max(100vw, calc(100vh * 9 / 16));
      height: max(100vh, calc(100vw * 16 / 9));
      overflow: hidden;
      background: #000;
      flex: 0 0 auto;
    }

    @supports (height: 100dvh) {
      .quadro {
        width: max(100vw, calc(100dvh * 9 / 16));
        height: max(100dvh, calc(100vw * 16 / 9));
      }
    }

    .arte,
    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* =========================
       CAPA
    ========================= */
    #capaTela {
      z-index: 40;
      opacity: 1;
      visibility: visible;
      transition: opacity 180ms ease;
    }

    #capaTela.saindo {
      opacity: 0;
      pointer-events: none;
    }

    #abrirConvite {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      cursor: pointer;
      z-index: 5;
    }

    /* =========================
       VÍDEO
    ========================= */
    #videoTela {
      z-index: 20;
      opacity: 0;
      visibility: hidden;
      transition: opacity 160ms ease;
    }

    #videoTela.ativo {
      opacity: 1;
      visibility: visible;
    }

    #video { background: #000; }

    #pular {
      position: absolute;
      right: 18px;
      bottom: max(90px, calc(env(safe-area-inset-bottom) + 70px));
      z-index: 15;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 999px;
      padding: 9px 14px;
      background: rgba(0, 0, 0, 0.48);
      color: #fff;
      font-size: 13px;
      line-height: 1;
      letter-spacing: 0.01em;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: opacity 160ms ease;
    }

    #pular.visivel {
      opacity: 1;
      visibility: visible;
    }

    /* =========================
       CARD FINAL
    ========================= */
    #finalTela {
      z-index: 30;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity var(--duracao-transicao) ease;
    }

    #finalTela.preRevelado,
    #finalTela.ativo {
      visibility: visible;
      opacity: 1;
    }

    #finalTela.ativo {
      pointer-events: auto;
    }

    .hotspot {
      position: absolute;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      cursor: pointer;
      z-index: 12;
      touch-action: manipulation;
    }

    /* Controle discreto de som apenas no card final. */
    #controleSom {
      position: absolute;
      right: max(14px, env(safe-area-inset-right));
      top: max(14px, env(safe-area-inset-top));
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 999px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.42);
      color: #fff;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      cursor: pointer;
      z-index: 20;
    }

    #controleSom svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #controleSom .som-off { display: none; }
    #controleSom.mudo .som-on { display: none; }
    #controleSom.mudo .som-off { display: block; }

    .hotspot:focus-visible,
    #abrirConvite:focus-visible,
    #pular:focus-visible,
    #controleSom:focus-visible {
      outline: 2px solid #fff;
      outline-offset: -3px;
    }

    @media (prefers-reduced-motion: reduce) {
      #capaTela,
      #videoTela,
      #finalTela,
      #pular {
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       CAPA
  ========================== -->
  <section id="capaTela" class="tela" aria-label="Capa do convite">
    <div class="quadro">
      <img id="capa" class="arte" alt="Safari do Arthur" draggable="false">
      <button id="abrirConvite" type="button" aria-label="Abrir convite"></button>
    </div>
  </section>

  <!-- =========================
       VÍDEO
  ========================== -->
  <section id="videoTela" class="tela" aria-label="Vídeo de abertura">
    <div class="quadro">
      <video
        id="video"
        playsinline
        webkit-playsinline
        preload="auto"
        disablepictureinpicture
        controlslist="nodownload noplaybackrate noremoteplayback"
      ></video>

      <button id="pular" type="button" aria-label="Pular abertura">
        Pular abertura
      </button>
    </div>
  </section>

  <!-- =========================
       CARD FINAL
  ========================== -->
  <section id="finalTela" class="tela" aria-label="Convite final">
    <div class="quadro">
      <img id="final" class="arte" alt="Detalhes do Safari do Arthur" draggable="false">

      <button id="hotspotLocalizacao" class="hotspot" type="button" aria-label="Como chegar"></button>
      <button id="hotspotConfirmacao" class="hotspot" type="button" aria-label="Confirmar presença"></button>

      <button id="controleSom" type="button" aria-label="Silenciar música" title="Som">
        <svg class="som-on" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 10v4h4l5 4V6L8 10H4z"></path>
          <path d="M16 9.5c.8.7 1.2 1.5 1.2 2.5s-.4 1.8-1.2 2.5"></path>
          <path d="M18.5 7c1.5 1.3 2.3 3 2.3 5s-.8 3.7-2.3 5"></path>
        </svg>
        <svg class="som-off" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 10v4h4l5 4V6L8 10H4z"></path>
          <path d="M17 9l4 4"></path>
          <path d="M21 9l-4 4"></path>
        </svg>
      </button>
    </div>
  </section>

  <audio id="musica" preload="auto" loop></audio>

  <script>
    (() => {
      "use strict";

      const capaTela = document.getElementById("capaTela");
      const videoTela = document.getElementById("videoTela");
      const finalTela = document.getElementById("finalTela");

      const capa = document.getElementById("capa");
      const video = document.getElementById("video");
      const final = document.getElementById("final");
      const musica = document.getElementById("musica");

      const abrirConviteBtn = document.getElementById("abrirConvite");
      const pularBtn = document.getElementById("pular");
      const controleSom = document.getElementById("controleSom");

      const hotspotLocalizacao = document.getElementById("hotspotLocalizacao");
      const hotspotConfirmacao = document.getElementById("hotspotConfirmacao");

      let conviteAberto = false;
      let finalMostrado = false;
      let rafFimVideo = null;
      let timerPular = null;
      let timerSync = null;
      let animacaoAudio = null;

      let videoEstavaTocando = false;
      let musicaEstavaTocando = false;
      let musicaDisponivel = true;
      let somMudo = false;

      const VOLUME_TECNICO = 0.001;
      const LIMIAR_DRIFT = 0.35;
      const EXTENSOES_IMAGEM = [".jpg", ".jpeg", ".png", ".webp", ".avif"];

      const urlLocal = (caminho) =>
        `${caminho}?v=${encodeURIComponent(CONFIG.versaoArquivos)}`;

      const urlMidia = (arquivo) =>
        `${CONFIG.hostMidia}/${encodeURIComponent(CONFIG.pastaCliente)}/${encodeURIComponent(arquivo)}?v=${encodeURIComponent(CONFIG.versaoMidia)}`;

      function aplicarPosicao(elemento, posicao) {
        elemento.style.left = posicao.left;
        elemento.style.top = posicao.top;
        elemento.style.width = posicao.width;
        elemento.style.height = posicao.height;
      }

      function montarCandidatosImagem(configuracao) {
        const entradas = Array.isArray(configuracao) ? configuracao : [configuracao];
        const candidatos = [];

        entradas.forEach((entrada) => {
          if (!entrada) return;

          const temExtensaoConhecida = /\.(jpg|jpeg|png|webp|avif)$/i.test(entrada);

          if (temExtensaoConhecida) {
            candidatos.push(entrada);
            return;
          }

          EXTENSOES_IMAGEM.forEach((extensao) => {
            candidatos.push(`${entrada}${extensao}`);
          });
        });

        return [...new Set(candidatos)];
      }

      function carregarImagemFlexivel(elemento, configuracao) {
        return new Promise((resolve) => {
          const candidatos = montarCandidatosImagem(configuracao);
          let indice = 0;

          const tentarProxima = () => {
            if (indice >= candidatos.length) {
              elemento.onload = null;
              elemento.onerror = null;
              console.error("Imagem não encontrada. Tentativas:", candidatos);
              resolve(false);
              return;
            }

            const caminho = candidatos[indice++];

            elemento.onload = async () => {
              elemento.onload = null;
              elemento.onerror = null;

              if (typeof elemento.decode === "function") {
                await elemento.decode().catch(() => {});
              }

              resolve(true);
            };

            elemento.onerror = tentarProxima;
            elemento.src = urlLocal(caminho);
          };

          tentarProxima();
        });
      }

      function configurarArquivos() {
        document.title = CONFIG.titulo;

        const carregamentos = {
          capa: carregarImagemFlexivel(capa, CONFIG.imagens.capa),
          final: carregarImagemFlexivel(final, CONFIG.imagens.final)
        };

        video.src = urlMidia(CONFIG.videoArquivo);
        video.load();

        musica.src = urlMidia(CONFIG.musicaArquivo);
        musica.volume = VOLUME_TECNICO;
        musica.load();

        return carregamentos;
      }

      function configurarHotspots() {
        aplicarPosicao(hotspotLocalizacao, CONFIG.hotspotsFinal.localizacao);
        aplicarPosicao(hotspotConfirmacao, CONFIG.hotspotsFinal.confirmacao);
      }

      let carregamentosImagem = null;

      function prepararArquivos() {
        carregamentosImagem = configurarArquivos();
      }

      async function esperarImagemFinal() {
        if (!carregamentosImagem) return;
        await carregamentosImagem.final.catch(() => false);
      }

      function esconderCapa() {
        if (capaTela.classList.contains("saindo")) return;

        capaTela.classList.add("saindo");

        window.setTimeout(() => {
          capaTela.style.visibility = "hidden";
        }, 200);
      }

      function pararSincronizacao() {
        if (timerSync) {
          clearInterval(timerSync);
          timerSync = null;
        }
      }

      function iniciarSincronizacao() {
        pararSincronizacao();

        timerSync = window.setInterval(() => {
          if (
            finalMostrado ||
            video.paused ||
            musica.paused ||
            !Number.isFinite(video.currentTime) ||
            !Number.isFinite(musica.currentTime)
          ) {
            return;
          }

          const alvo = Math.max(0, video.currentTime + CONFIG.inicioMusica);
          const drift = musica.currentTime - alvo;

          if (Math.abs(drift) > LIMIAR_DRIFT) {
            try {
              musica.currentTime = alvo;
            } catch (_) {}
          }
        }, 1000);
      }

      async function iniciarMusicaNoGesto() {
        if (!musicaDisponivel) return;

        try {
          musica.currentTime = Math.max(0, CONFIG.inicioMusica || 0);
          musica.volume = VOLUME_TECNICO;

          const tentativaMusica = musica.play();
          if (tentativaMusica && typeof tentativaMusica.then === "function") {
            await tentativaMusica;
          }
        } catch (_) {
          musicaDisponivel = false;
        }
      }

      async function abrirConvite() {
        if (conviteAberto) return;
        conviteAberto = true;

        videoTela.classList.add("ativo");

        const tentativaMusica = iniciarMusicaNoGesto();

        try {
          const tentativaVideo = video.play();

          if (tentativaVideo && typeof tentativaVideo.then === "function") {
            await tentativaVideo;
          }
        } catch (_) {
          await tentativaMusica;
          await ativarFinal();
          esconderCapa();
          return;
        }

        await tentativaMusica;

        esconderCapa();
        mostrarPularTemporariamente();
        iniciarSincronizacao();
        monitorarFimDoVideo();
      }

      function mostrarPularTemporariamente() {
        pularBtn.classList.add("visivel");
        clearTimeout(timerPular);

        timerPular = window.setTimeout(() => {
          pularBtn.classList.remove("visivel");
        }, CONFIG.tempoPular);
      }

      function monitorarFimDoVideo() {
        cancelAnimationFrame(rafFimVideo);

        const observar = () => {
          if (finalMostrado) return;

          if (
            Number.isFinite(video.duration) &&
            video.duration > 0 &&
            !video.paused
          ) {
            const restante = video.duration - video.currentTime;

            if (restante > 0 && restante <= 0.24) {
              ativarFinal();
              return;
            }
          }

          rafFimVideo = requestAnimationFrame(observar);
        };

        rafFimVideo = requestAnimationFrame(observar);
      }

      function cancelarFadeAudio() {
        if (animacaoAudio) {
          cancelAnimationFrame(animacaoAudio);
          animacaoAudio = null;
        }
      }

      function crossfadeParaFinal() {
        cancelarFadeAudio();

        const duracao = Math.max(1, Number(CONFIG.transicaoAudio) || 260);
        const inicio = performance.now();
        const volumeVideoInicial = Number.isFinite(video.volume) ? video.volume : 1;
        const volumeMusicaInicial = musicaDisponivel ? musica.volume : 0;
        const volumeMusicaAlvo = somMudo ? 0 : CONFIG.volumeMusica;

        const passo = (agora) => {
          const progresso = Math.min(1, (agora - inicio) / duracao);

          video.volume = Math.max(0, volumeVideoInicial * (1 - progresso));

          if (musicaDisponivel) {
            musica.volume = volumeMusicaInicial +
              (volumeMusicaAlvo - volumeMusicaInicial) * progresso;
          }

          if (progresso < 1) {
            animacaoAudio = requestAnimationFrame(passo);
            return;
          }

          animacaoAudio = null;
          video.volume = 0;
          if (musicaDisponivel) musica.volume = volumeMusicaAlvo;
        };

        animacaoAudio = requestAnimationFrame(passo);
      }

      async function ativarFinal() {
        if (finalMostrado) return;
        finalMostrado = true;

        cancelAnimationFrame(rafFimVideo);
        pararSincronizacao();
        clearTimeout(timerPular);
        pularBtn.classList.remove("visivel");

        await esperarImagemFinal();

        finalTela.style.visibility = "visible";

        requestAnimationFrame(() => {
          finalTela.classList.add("preRevelado", "ativo");
        });

        crossfadeParaFinal();

        window.setTimeout(() => {
          video.pause();
          videoTela.classList.remove("ativo");
          videoTela.style.visibility = "hidden";
        }, Math.max(240, Number(CONFIG.transicaoAudio) || 260));
      }

      function atualizarControleSom() {
        controleSom.classList.toggle("mudo", somMudo);
        controleSom.setAttribute(
          "aria-label",
          somMudo ? "Ativar música" : "Silenciar música"
        );
      }

      function alternarSom() {
        somMudo = !somMudo;

        if (musicaDisponivel) {
          musica.volume = somMudo ? 0 : CONFIG.volumeMusica;
        }

        atualizarControleSom();
      }

      function abrirLink(link) {
        if (!link) return;
        window.location.href = link;
      }

      function tratarVisibilidade() {
        if (document.hidden) {
          videoEstavaTocando = !video.paused && !finalMostrado;
          musicaEstavaTocando = musicaDisponivel && !musica.paused;

          if (videoEstavaTocando) video.pause();
          if (musicaEstavaTocando) musica.pause();
          return;
        }

        const retomadas = [];

        if (videoEstavaTocando && !finalMostrado) {
          retomadas.push(
            video.play().then(() => {
              iniciarSincronizacao();
              monitorarFimDoVideo();
            }).catch(() => {})
          );
        }

        if (musicaEstavaTocando && musicaDisponivel) {
          retomadas.push(musica.play().catch(() => {}));
        }

        Promise.allSettled(retomadas).finally(() => {
          videoEstavaTocando = false;
          musicaEstavaTocando = false;
        });
      }

      abrirConviteBtn.addEventListener("click", abrirConvite);
      pularBtn.addEventListener("click", ativarFinal);
      controleSom.addEventListener("click", alternarSom);

      video.addEventListener("playing", esconderCapa);
      video.addEventListener("ended", ativarFinal);
      video.addEventListener("error", async () => {
        if (conviteAberto && !finalMostrado) {
          await ativarFinal();
          esconderCapa();
        }
      });

      musica.addEventListener("error", () => {
        musicaDisponivel = false;
        controleSom.style.display = "none";
      });

      hotspotConfirmacao.addEventListener("click", () => abrirLink(CONFIG.linkConfirmacao));
      hotspotLocalizacao.addEventListener("click", () => abrirLink(CONFIG.linkLocalizacao));

      document.addEventListener("visibilitychange", tratarVisibilidade);
      document.addEventListener("contextmenu", (event) => event.preventDefault());
      document.addEventListener("dragstart", (event) => event.preventDefault());

      atualizarControleSom();
      prepararArquivos();
      configurarHotspots();
    })();
  </script>
</body>
</html>

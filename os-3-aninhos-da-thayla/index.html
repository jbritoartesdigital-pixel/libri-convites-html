      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    #rsvpFrame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      opacity: 0;
      transition: opacity 160ms ease;
    }

    #rsvpFrame.pronto {
      opacity: 1;
    }

    .rsvp-loading {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #fff;
      color: color-mix(in srgb, var(--tema-texto) 68%, #fff);
      text-align: center;
    }

    .rsvp-loading.oculto {
      display: none;
    }

    .rsvp-fallback {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      #capaTela,
      #videoTela,
      #pular,
      .modal,
      .modal-card,
      .presentes-modal,
      .rsvp-modal,
      #rsvpFrame,
      #presentesImagem {
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>

<body>
  <section id="preEntrada" class="preentrada" aria-label="Preparar convite">
    <div class="preentrada-card">
      <div class="preentrada-brilho" aria-hidden="true">✨</div>

      <h1 class="preentrada-titulo">
        Você está preparado para entrar no mundo mágico da Thayla?
      </h1>

      <p class="preentrada-texto">
        Uma surpresa encantada está esperando por você.
      </p>

      <button
        id="preEntradaBotao"
        class="preentrada-botao"
        type="button"
      >
        Despertar a magia ✨
      </button>

      <div
        id="preEntradaStatus"
        class="preentrada-status"
        role="status"
        aria-live="polite"
      ></div>
    </div>
  </section>

  <section id="finalTela" class="tela" aria-label="Convite final">
    <div class="quadro">
      <img
        id="finalImagem"
        class="arte"
        alt="Convite final personalizado"
        draggable="false"
      >

      <button
        id="hotspotConfirmacao"
        class="hotspot"
        type="button"
        aria-label="Confirmar presen&#231;a"
      ></button>

      <button
        id="hotspotLocalizacao"
        class="hotspot"
        type="button"
        aria-label="Ver localiza&#231;&#227;o"
      ></button>

      <button
        id="hotspotPresentes"
        class="hotspot"
        type="button"
        aria-label="Ver sugest&#245;es de presentes"
      ></button>

      <button
        id="hotspotFiltro"
        class="hotspot"
        type="button"
        aria-label="Abrir Filtro Especial"
      ></button>

      <button
        id="controleSom"
        type="button"
        aria-label="Ligar ou desligar m&#250;sica"
      >
        <svg id="iconeSom" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
          <path d="M16 9.5c.8.7 1.2 1.5 1.2 2.5s-.4 1.8-1.2 2.5"></path>
          <path d="M18.5 7c1.5 1.3 2.3 3 2.3 5s-.8 3.7-2.3 5"></path>
        </svg>
        <svg id="iconeMudo" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
          <path d="M17 9l4 4"></path>
          <path d="M21 9l-4 4"></path>
        </svg>
      </button>
    </div>
  </section>

  <section id="videoTela" class="tela" aria-label="V&#237;deo de abertura">
    <div class="quadro">
      <video
        id="video"
        playsinline
        webkit-playsinline
        preload="metadata"
        disablepictureinpicture
        controlslist="nodownload noplaybackrate noremoteplayback"
      ></video>

      <button id="pular" type="button" aria-label="Pular abertura">
        Pular abertura
      </button>

      <button
        id="ativarSomFallback"
        class="som-fallback"
        type="button"
        aria-label="Ativar som"
      >
        Toque para ativar o som ✨
      </button>
    </div>
  </section>

  <section id="capaTela" class="tela" aria-label="Capa do convite">
    <div class="quadro">
      <img
        id="capaImagem"
        class="arte"
        alt="Capa do convite personalizado"
        draggable="false"
      >

      <button
        id="abrirConvite"
        type="button"
        aria-label="Agite o celular para abrir; toque se não funcionar"
      ></button>

      <div id="motionHint" class="motion-hint oculto" role="status" aria-live="polite"></div>
    </div>
  </section>

  <div id="modalLocalizacao" class="modal" role="dialog" aria-modal="true" aria-labelledby="tituloLocalizacao">
    <div class="modal-card">
      <button id="fecharLocalizacao" class="modal-fechar" type="button" aria-label="Fechar localiza&#231;&#227;o">&times;</button>

      <div class="modal-conteudo">
        <div class="localizacao-icone" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 21s6-5.1 6-11a6 6 0 1 0-12 0c0 5.9 6 11 6 11z"></path>
            <circle cx="12" cy="10" r="2.2"></circle>
          </svg>
        </div>
        <h2 id="tituloLocalizacao" class="modal-titulo"></h2>
        <div class="localizacao-divisor" aria-hidden="true"></div>
        <p id="enderecoTexto" class="endereco"></p>

        <div class="modal-acoes">
          <button id="abrirGoogleMaps" class="acao-principal" type="button"></button>
          <button id="abrirWaze" class="acao-rota" type="button"></button>
          <button id="abrirUber" class="acao-uber" type="button"></button>
        </div>
      </div>
    </div>
  </div>

  <div id="modalRsvp" class="rsvp-modal" role="dialog" aria-modal="true" aria-label="Confirmar presen&#231;a">
    <div class="rsvp-shell">
      <button id="fecharRsvp" type="button" aria-label="Fechar confirma&#231;&#227;o">&times;</button>

      <div id="rsvpLoading" class="rsvp-loading">
        Carregando confirma&#231;&#227;o...
      </div>

      <iframe
        id="rsvpFrame"
        title="Confirma&#231;&#227;o de presen&#231;a"
        loading="eager"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>

      <a
        id="rsvpFallback"
        class="rsvp-fallback"
        target="_blank"
        rel="noopener noreferrer"
        aria-hidden="true"
        tabindex="-1"
      >Abrir confirma&#231;&#227;o em nova p&#225;gina</a>
    </div>
  </div>

  <div id="modalPresentes" class="presentes-modal" role="dialog" aria-modal="true" aria-label="Sugest&#245;es de presentes">
    <div class="presentes-shell">
      <button id="fecharPresentes" class="modal-fechar" type="button" aria-label="Fechar sugest&#245;es de presentes">&times;</button>
      <img id="presentesImagem" alt="Sugest&#245;es de presentes" draggable="false">
    </div>
  </div>

  <audio id="musica" preload="metadata" loop></audio>

  <script>
    window.CONFIG_PROMISE.then((CONFIG) => {
      "use strict";

      if (CONFIG.tema) {
        const raiz = document.documentElement;
        const mapaTema = {
          escuro: "--tema-escuro",
          principal: "--tema-principal",
          claro: "--tema-claro",
          acento: "--tema-acento",
          superficie: "--tema-superficie",
          texto: "--tema-texto"
        };
        for (const [chave, variavel] of Object.entries(mapaTema)) {
          if (CONFIG.tema[chave]) raiz.style.setProperty(variavel, CONFIG.tema[chave]);
        }
      }

      const preEntrada = document.getElementById("preEntrada");
      const preEntradaBotao = document.getElementById("preEntradaBotao");
      const preEntradaStatus = document.getElementById("preEntradaStatus");

      const capaTela = document.getElementById("capaTela");
      const videoTela = document.getElementById("videoTela");
      const finalTela = document.getElementById("finalTela");

      const capaImagem = document.getElementById("capaImagem");
      const finalImagem = document.getElementById("finalImagem");
      const video = document.getElementById("video");
      const musica = document.getElementById("musica");

      const abrirConvite = document.getElementById("abrirConvite");
      const motionHint = document.getElementById("motionHint");
      const pular = document.getElementById("pular");
      const ativarSomFallback = document.getElementById("ativarSomFallback");
      const controleSom = document.getElementById("controleSom");
      const hotspotLocalizacao = document.getElementById("hotspotLocalizacao");
      const hotspotConfirmacao = document.getElementById("hotspotConfirmacao");
      const hotspotPresentes = document.getElementById("hotspotPresentes");
      const hotspotFiltro = document.getElementById("hotspotFiltro");

      const modalLocalizacao = document.getElementById("modalLocalizacao");
      const tituloLocalizacao = document.getElementById("tituloLocalizacao");
      const enderecoTexto = document.getElementById("enderecoTexto");
      const abrirGoogleMaps = document.getElementById("abrirGoogleMaps");
      const abrirWaze = document.getElementById("abrirWaze");
      const abrirUber = document.getElementById("abrirUber");
      const fecharLocalizacao = document.getElementById("fecharLocalizacao");

      const modalRsvp = document.getElementById("modalRsvp");
      const rsvpFrame = document.getElementById("rsvpFrame");
      const rsvpLoading = document.getElementById("rsvpLoading");
      const rsvpFallback = document.getElementById("rsvpFallback");
      const fecharRsvp = document.getElementById("fecharRsvp");

      const modalPresentes = document.getElementById("modalPresentes");
      const presentesImagem = document.getElementById("presentesImagem");
      const fecharPresentes = document.getElementById("fecharPresentes");

      let conviteAberto = false;
      let finalAtivo = false;
      let finalizando = false;
      let somLigado = true;
      let audioDisponivel = true;
      let midiaAquecida = false;
      let movimentoArmado = false;
      let movimentoNegado = false;
      let midiaDesbloqueada = false;
      let ultimoShake = 0;
      let ultimaAceleracao = null;
      let recebeuEventoMovimento = false;
      let recebeuEventoOrientacao = false;
      let ultimaOrientacao = null;
      let sensorLinear = null;
      let sensorAccel = null;
      let sensorGiro = null;
      let recebeuSensorGenerico = false;
      let timerFallbackMovimento = null;
      let gateConcluido = false;

      let videoRsvpEstavaTocando = false;
      let timerRsvpFallback = null;

      let timerPular = null;
      let rafFim = null;
      let rafAudio = null;
      let ultimoAjusteSincronia = 0;

      let videoEstavaTocando = false;
      let musicaEstavaTocando = false;

      const urlArquivo = (caminho) =>
        `${caminho}?v=${encodeURIComponent(CONFIG.versaoArquivos)}`;

      function urlMidia(arquivo) {
        const partes = arquivo
          .split("/")
          .map((parte) => encodeURIComponent(parte))
          .join("/");

        return `${CONFIG.hostMidia}/${CONFIG.pastaCliente}/${partes}?v=${encodeURIComponent(CONFIG.versaoMidia)}`;
      }

      const EXTENSOES_IMAGEM = [".jpg", ".jpeg", ".png", ".webp", ".avif"];

      function temExtensaoImagem(caminho) {
        const limpo = String(caminho || "")
          .split("?")[0]
          .split("#")[0];

        return /\.(?:jpe?g|png|webp|avif)$/i.test(limpo);
      }

      async function resolverImagem(elemento, caminhoBase) {
        if (!elemento || !caminhoBase) return false;

        const bases = Array.isArray(caminhoBase)
          ? caminhoBase.filter(Boolean)
          : [caminhoBase];

        const candidatos = [];

        for (const base of bases) {
          if (temExtensaoImagem(base)) {
            candidatos.push(base);
          } else {
            for (const extensao of EXTENSOES_IMAGEM) {
              candidatos.push(`${base}${extensao}`);
            }
          }
        }

        for (const candidato of candidatos) {
          const carregou = await new Promise((resolve) => {
            const aoCarregar = async () => {
              elemento.removeEventListener("error", aoFalhar);

              if (typeof elemento.decode === "function") {
                await elemento.decode().catch(() => {});
              }

              resolve(true);
            };

            const aoFalhar = () => {
              elemento.removeEventListener("load", aoCarregar);
              resolve(false);
            };

            elemento.addEventListener("load", aoCarregar, { once: true });
            elemento.addEventListener("error", aoFalhar, { once: true });
            elemento.src = urlArquivo(candidato);
          });

          if (carregou) {
            elemento.dataset.arquivoResolvido = candidato;
            return candidato;
          }
        }

        console.warn("[Libri] Imagem n\xe3o encontrada:", caminhoBase);
        return false;
      }

      const capaCarregada = resolverImagem(capaImagem, CONFIG.capaArquivo);
      let finalCarregado = null;
      let presentesCarregado = null;

      const carregarFinal = () => {
        if (!finalCarregado) finalCarregado = resolverImagem(finalImagem, CONFIG.finalArquivo);
        return finalCarregado;
      };

      const carregarPresentes = () => {
        if (!presentesCarregado) presentesCarregado = resolverImagem(presentesImagem, CONFIG.presentesArquivo);
        return presentesCarregado;
      };

      if (!CONFIG.preloadInteligente) {
        carregarFinal().catch(() => false);
        carregarPresentes().catch(() => false);
      }

      video.src = urlMidia(CONFIG.videoArquivo);
      musica.src = urlMidia(CONFIG.musicaArquivo);

      video.preload = "metadata";
      musica.preload = "metadata";
      video.load();
      musica.load();

      function aquecerMidia() {
        if (midiaAquecida) return;
        midiaAquecida = true;
        video.preload = "auto";
        musica.preload = "auto";
        video.load();
        musica.load();
      }

      if ("requestIdleCallback" in window) {
        requestIdleCallback(aquecerMidia, { timeout: 1400 });
      } else {
        setTimeout(aquecerMidia, 550);
      }

      function posicionar(elemento, dados) {
        elemento.style.left = dados.left;
        elemento.style.top = dados.top;
        elemento.style.width = dados.width;
        elemento.style.height = dados.height;
      }

      posicionar(hotspotConfirmacao, CONFIG.hotspotsFinal.confirmacao);
      posicionar(hotspotLocalizacao, CONFIG.hotspotsFinal.localizacao);
      posicionar(hotspotPresentes, CONFIG.hotspotsFinal.presentes);
      posicionar(hotspotFiltro, CONFIG.hotspotsFinal.filtro);
      tituloLocalizacao.textContent = CONFIG.local.nome;
      enderecoTexto.innerHTML = [
        CONFIG.local.linha1,
        CONFIG.local.linha2,
        CONFIG.local.linha3
      ].filter(Boolean).join("<br>");

      abrirGoogleMaps.textContent = CONFIG.botoes.mapa;
      abrirWaze.textContent = CONFIG.botoes.waze;
      abrirUber.textContent = CONFIG.botoes.uber;

      function esconderCapa() {
        if (capaTela.classList.contains("saindo")) return;

        capaTela.classList.add("saindo");

        setTimeout(() => {
          capaTela.style.visibility = "hidden";
        }, 200);
      }

      function aguardarPrimeiroFrame(timeoutMs = 2600) {
        return new Promise((resolve) => {
          let finalizado = false;
          let timer = null;

          const done = () => {
            if (finalizado) return;
            finalizado = true;
            clearTimeout(timer);
            resolve(true);
          };

          timer = setTimeout(() => {
            if (finalizado) return;
            finalizado = true;
            resolve(false);
          }, timeoutMs);

          if (typeof video.requestVideoFrameCallback === "function") {
            video.requestVideoFrameCallback(() => done());
            return;
          }

          if (video.readyState >= 2) {
            requestAnimationFrame(done);
            return;
          }

          video.addEventListener("loadeddata", done, { once: true });
        });
      }

      function tempoEsperadoMusica() {
        let esperado = Math.max(0, video.currentTime + CONFIG.inicioMusica);

        if (Number.isFinite(musica.duration) && musica.duration > 0) {
          esperado %= musica.duration;
        }

        return esperado;
      }

      function iniciarMusicaSilenciosa() {
        musica.volume = 0.001;

        try {
          musica.currentTime = Math.max(0, CONFIG.inicioMusica);
        } catch (_) {}

        const tentativa = musica.play();

        if (tentativa && typeof tentativa.catch === "function") {
          tentativa.catch(() => {
            audioDisponivel = false;
            controleSom.classList.remove("visivel");
          });
        }
      }

      function manterSincronia(forcar = false) {
        if (
          !audioDisponivel ||
          finalAtivo ||
          video.paused ||
          musica.paused
        ) {
          return;
        }

        const agora = performance.now();

        if (!forcar && agora - ultimoAjusteSincronia < 1000) {
          return;
        }

        ultimoAjusteSincronia = agora;

        const esperado = tempoEsperadoMusica();
        const diferenca = Math.abs(musica.currentTime - esperado);

        if (forcar || diferenca > 0.35) {
          try {
            musica.currentTime = esperado;
          } catch (_) {}
        }
      }

      function transicaoSuaveAudio(aoFinalizar) {
        cancelAnimationFrame(rafAudio);

        if (!audioDisponivel || musica.paused) {
          aoFinalizar();
          return;
        }

        const duracao = Math.max(120, CONFIG.transicaoAudio);
        const inicio = performance.now();
        const volumeVideoInicial = video.volume;
        const volumeMusicaInicial = musica.volume;
        const volumeMusicaFinal = somLigado ? CONFIG.volumeMusica : 0;

        const animar = (agora) => {
          const progresso = Math.min(1, (agora - inicio) / duracao);
          const suave = progresso * progresso * (3 - 2 * progresso);

          video.volume = Math.max(0, volumeVideoInicial * (1 - suave));
          musica.volume = volumeMusicaInicial + (volumeMusicaFinal - volumeMusicaInicial) * suave;

          if (progresso < 1) {
            rafAudio = requestAnimationFrame(animar);
            return;
          }

          video.volume = 0;
          musica.volume = volumeMusicaFinal;
          aoFinalizar();
        };

        rafAudio = requestAnimationFrame(animar);
      }


      function esconderDicaMovimento() {
        motionHint.classList.add("oculto");
      }

      function mostrarDicaMovimento(texto) {
        motionHint.textContent = texto;
        motionHint.classList.remove("oculto");
      }

      function desabilitarToqueFallback() {
        abrirConvite.disabled = true;
        abrirConvite.style.pointerEvents = "none";
      }

      function habilitarToqueFallback(
        mensagem = "Não iniciou? Toque na tela ✨"
      ) {
        abrirConvite.disabled = false;
        abrirConvite.style.pointerEvents = "auto";
        mostrarDicaMovimento(mensagem);
      }

      function limparTimerFallbackMovimento() {
        clearTimeout(timerFallbackMovimento);
        timerFallbackMovimento = null;
      }

      function agendarFallbackMovimento(atraso = 6500) {
        limparTimerFallbackMovimento();

        timerFallbackMovimento = setTimeout(() => {
          if (!conviteAberto && gateConcluido) {
            habilitarToqueFallback("Não iniciou? Toque na tela ✨");
          }
        }, atraso);
      }

      async function desbloquearMidiaPorGesto() {
        if (midiaDesbloqueada) return true;

        audioDisponivel = true;
        aquecerMidia();

        const tentativas = [];

        try {
          const videoMutedAnterior = video.muted;
          video.muted = true;
          video.currentTime = 0;

          const tentativaVideo = video.play();
          if (tentativaVideo && typeof tentativaVideo.then === "function") {
            tentativas.push(
              tentativaVideo
                .then(() => {
                  video.pause();
                  try { video.currentTime = 0; } catch (_) {}
                  video.muted = videoMutedAnterior;
                  return true;
                })
                .catch(() => {
                  video.pause();
                  video.muted = videoMutedAnterior;
                  return false;
                })
            );
          } else {
            video.pause();
            video.muted = videoMutedAnterior;
          }
        } catch (_) {}

        try {
          const musicaMutedAnterior = musica.muted;
          musica.muted = true;
          try {
            musica.currentTime = Math.max(0, CONFIG.inicioMusica);
          } catch (_) {}

          const tentativaMusica = musica.play();
          if (tentativaMusica && typeof tentativaMusica.then === "function") {
            tentativas.push(
              tentativaMusica
                .then(() => {
                  musica.pause();
                  try {
                    musica.currentTime = Math.max(0, CONFIG.inicioMusica);
                  } catch (_) {}
                  musica.muted = musicaMutedAnterior;
                  return true;
                })
                .catch(() => {
                  musica.pause();
                  musica.muted = musicaMutedAnterior;
                  return false;
                })
            );
          } else {
            musica.pause();
            musica.muted = musicaMutedAnterior;
          }
        } catch (_) {}

        if (tentativas.length) {
          await Promise.allSettled(tentativas);
        }

        midiaDesbloqueada = true;
        return true;
      }

      function dispararShake() {
        if (conviteAberto || !movimentoArmado) return;

        const agora = performance.now();
        if (agora - ultimoShake < 750) return;

        ultimoShake = agora;
        limparTimerFallbackMovimento();
        desabilitarToqueFallback();
        esconderDicaMovimento();
        iniciarConvite("shake");
      }

      function detectarShake(event) {
        if (conviteAberto || !movimentoArmado) return;

        recebeuEventoMovimento = true;

        const linear = event.acceleration;
        if (linear) {
          const x = Number(linear.x || 0);
          const y = Number(linear.y || 0);
          const z = Number(linear.z || 0);
          const intensidade = Math.sqrt(x * x + y * y + z * z);

          if (intensidade >= 5.2) {
            dispararShake();
            return;
          }
        }

        const a = event.accelerationIncludingGravity;
        if (a) {
          const atual = {
            x: Number(a.x || 0),
            y: Number(a.y || 0),
            z: Number(a.z || 0)
          };

          if (ultimaAceleracao) {
            const dx = atual.x - ultimaAceleracao.x;
            const dy = atual.y - ultimaAceleracao.y;
            const dz = atual.z - ultimaAceleracao.z;
            const delta = Math.sqrt(dx * dx + dy * dy + dz * dz);

            if (delta >= 6.8) {
              dispararShake();
              return;
            }
          }

          ultimaAceleracao = atual;
        }

        const r = event.rotationRate;
        if (r) {
          const rotacao =
            Math.abs(Number(r.alpha || 0)) +
            Math.abs(Number(r.beta || 0)) +
            Math.abs(Number(r.gamma || 0));

          if (rotacao >= 75) {
            dispararShake();
          }
        }
      }

      function detectarOrientacao(event) {
        if (conviteAberto || !movimentoArmado) return;

        recebeuEventoOrientacao = true;

        const atual = {
          alpha: Number(event.alpha || 0),
          beta: Number(event.beta || 0),
          gamma: Number(event.gamma || 0)
        };

        if (!ultimaOrientacao) {
          ultimaOrientacao = atual;
          return;
        }

        const delta =
          Math.abs(atual.beta - ultimaOrientacao.beta) +
          Math.abs(atual.gamma - ultimaOrientacao.gamma);

        ultimaOrientacao = atual;

        /*
          Fallback importante para navegadores que entregam orientação,
          mas não devicemotion. Uma sacudida real costuma produzir mudanças
          rápidas de beta/gamma.
        */
        if (delta >= 18) {
          dispararShake();
        }
      }

      function pararSensoresGenericos() {
        for (const sensor of [sensorLinear, sensorAccel, sensorGiro]) {
          try {
            if (sensor && typeof sensor.stop === "function") sensor.stop();
          } catch (_) {}
        }

        sensorLinear = null;
        sensorAccel = null;
        sensorGiro = null;
      }

      function armarSensoresGenericos() {
        recebeuSensorGenerico = false;

        try {
          if ("LinearAccelerationSensor" in window) {
            sensorLinear = new LinearAccelerationSensor({ frequency: 30 });
            sensorLinear.addEventListener("reading", () => {
              recebeuSensorGenerico = true;

              const x = Number(sensorLinear.x || 0);
              const y = Number(sensorLinear.y || 0);
              const z = Number(sensorLinear.z || 0);
              const intensidade = Math.sqrt(x * x + y * y + z * z);

              if (intensidade >= 5.2) dispararShake();
            });
            sensorLinear.start();
          }
        } catch (_) {
          sensorLinear = null;
        }

        try {
          if (!sensorLinear && "Accelerometer" in window) {
            sensorAccel = new Accelerometer({ frequency: 30 });
            let anterior = null;

            sensorAccel.addEventListener("reading", () => {
              recebeuSensorGenerico = true;

              const atual = {
                x: Number(sensorAccel.x || 0),
                y: Number(sensorAccel.y || 0),
                z: Number(sensorAccel.z || 0)
              };

              if (anterior) {
                const dx = atual.x - anterior.x;
                const dy = atual.y - anterior.y;
                const dz = atual.z - anterior.z;
                const delta = Math.sqrt(dx * dx + dy * dy + dz * dz);

                if (delta >= 6.8) dispararShake();
              }

              anterior = atual;
            });

            sensorAccel.start();
          }
        } catch (_) {
          sensorAccel = null;
        }

        try {
          if ("Gyroscope" in window) {
            sensorGiro = new Gyroscope({ frequency: 30 });

            sensorGiro.addEventListener("reading", () => {
              recebeuSensorGenerico = true;

              const rotacao =
                Math.abs(Number(sensorGiro.x || 0)) +
                Math.abs(Number(sensorGiro.y || 0)) +
                Math.abs(Number(sensorGiro.z || 0));

              if (rotacao >= 2.8) dispararShake();
            });

            sensorGiro.start();
          }
        } catch (_) {
          sensorGiro = null;
        }
      }

      function armarListenerMovimento() {
        if (movimentoArmado) return;

        movimentoArmado = true;
        ultimaAceleracao = null;
        ultimaOrientacao = null;
        recebeuEventoMovimento = false;
        recebeuEventoOrientacao = false;
        recebeuSensorGenerico = false;

        window.addEventListener("devicemotion", detectarShake, { passive: true });
        window.addEventListener("deviceorientation", detectarOrientacao, { passive: true });

        armarSensoresGenericos();

        /*
          Se o navegador não entregar NENHUM sinal de sensor, reconhecemos
          a falha e mostramos somente o fallback leve.
        */
        setTimeout(() => {
          if (
            !conviteAberto &&
            movimentoArmado &&
            !recebeuEventoMovimento &&
            !recebeuEventoOrientacao &&
            !recebeuSensorGenerico
          ) {
            habilitarToqueFallback("Não iniciou ao agitar? Toque na tela ✨");
          }
        }, 1800);
      }

      async function abrirPorToqueFallback() {
        if (conviteAberto) return;

        esconderDicaMovimento();
        await desbloquearMidiaPorGesto();

        try {
          if (
            "DeviceMotionEvent" in window &&
            typeof DeviceMotionEvent.requestPermission === "function"
          ) {
            await DeviceMotionEvent.requestPermission().catch(() => null);
          }
        } catch (_) {}

        iniciarConvite("tap");
      }

      async function concluirPreEntrada() {
        if (gateConcluido) return;

        preEntradaBotao.disabled = true;
        preEntradaStatus.textContent = "Preparando a magia... ✨";

        /*
          IMPORTANTE:
          As chamadas de permissão e o desbloqueio de mídia nascem do MESMO
          gesto do usuário. Isso é o que torna o fluxo muito mais confiável
          em Safari/iOS e também ajuda nas políticas de autoplay.
        */
        let motionPromise = Promise.resolve("not-required");
        let orientationPromise = Promise.resolve("not-required");

        try {
          if (
            "DeviceMotionEvent" in window &&
            typeof DeviceMotionEvent.requestPermission === "function"
          ) {
            motionPromise = DeviceMotionEvent.requestPermission();
          }
        } catch (_) {
          motionPromise = Promise.resolve("denied");
        }

        try {
          if (
            "DeviceOrientationEvent" in window &&
            typeof DeviceOrientationEvent.requestPermission === "function"
          ) {
            orientationPromise = DeviceOrientationEvent.requestPermission();
          }
        } catch (_) {
          orientationPromise = Promise.resolve("denied");
        }

        const mediaPromise = desbloquearMidiaPorGesto();

        const resultados = await Promise.allSettled([
          motionPromise,
          orientationPromise,
          mediaPromise
        ]);

        const motionResultado =
          resultados[0].status === "fulfilled"
            ? resultados[0].value
            : "denied";

        const orientationResultado =
          resultados[1].status === "fulfilled"
            ? resultados[1].value
            : "denied";

        const motionNegado =
          motionResultado === "denied" &&
          orientationResultado === "denied";

        gateConcluido = true;

        preEntrada.classList.add("saindo");
        setTimeout(() => {
          preEntrada.hidden = true;
        }, 240);

        if (motionNegado) {
          movimentoNegado = true;
          habilitarToqueFallback("Movimento não liberado • toque para abrir ✨");
          return;
        }

        movimentoNegado = false;
        desabilitarToqueFallback();
        esconderDicaMovimento();

        armarListenerMovimento();

        /*
          Se o sensor estiver vivo, a pessoa pode agitar imediatamente.
          Se nada abrir depois de alguns segundos, liberamos um único toque
          de fallback, sem exigir um segundo clique técnico.
        */
        agendarFallbackMovimento(6500);
      }

      function prepararEntradaInterativa() {
        /*
          Antes da tela de capa, existe agora uma etapa explícita de preparação.
          Nenhum sensor é armado antes do clique inicial.
        */
        desabilitarToqueFallback();
        esconderDicaMovimento();

        preEntradaBotao.addEventListener("click", concluirPreEntrada, {
          once: true
        });
      }

      async function iniciarConvite(origem = "auto") {
        if (conviteAberto) return;
        conviteAberto = true;
        movimentoArmado = false;
        limparTimerFallbackMovimento();
        desabilitarToqueFallback();
        esconderDicaMovimento();
        window.removeEventListener("devicemotion", detectarShake);
        window.removeEventListener("deviceorientation", detectarOrientacao);
        pararSensoresGenericos();

        aquecerMidia();

        await capaCarregada.catch(() => false);
        carregarFinal().catch(() => false);
        carregarPresentes().catch(() => false);

        videoTela.style.visibility = "visible";
        videoTela.classList.remove("saindo");
        videoTela.classList.add("ativo");

        iniciarMusicaSilenciosa();
        video.volume = 1;

        try {
          video.currentTime = 0;
        } catch (_) {}

        const primeiroFrame = aguardarPrimeiroFrame();

        let iniciouMudoPorPolitica = false;

        try {
          video.muted = false;
          await video.play();

          const framePronto = await primeiroFrame;
          if (!framePronto) throw new Error("Primeiro frame indisponível");
        } catch (_) {
          if (origem === "shake") {
            try {
              video.muted = true;
              try { video.currentTime = 0; } catch (_) {}

              await video.play();

              const frameProntoMudo = await aguardarPrimeiroFrame();
              if (!frameProntoMudo) {
                throw new Error("Primeiro frame mudo indisponível");
              }

              iniciouMudoPorPolitica = true;
              audioDisponivel = false;
            } catch (_) {
              conviteAberto = false;
              finalizando = false;
              finalAtivo = false;
              movimentoArmado = false;

              clearTimeout(timerPular);
              pular.classList.remove("visivel");

              try { video.pause(); } catch (_) {}
              try { video.currentTime = 0; } catch (_) {}
              try { musica.pause(); } catch (_) {}

              video.muted = false;
              videoTela.classList.remove("ativo");
              videoTela.classList.remove("saindo");
              videoTela.style.visibility = "hidden";

              habilitarToqueFallback("Não iniciou? Toque na tela ✨");

              /*
                Se a tentativa de abrir falhou, continuamos ouvindo os sensores.
                Assim o convidado ainda pode tentar agitar novamente.
              */
              setTimeout(() => {
                if (!conviteAberto) armarListenerMovimento();
              }, 250);

              return;
            }
          } else {
            await carregarFinal().catch(() => false);

            finalTela.classList.add("ativo");
            finalAtivo = true;
            finalizando = false;

            video.pause();
            videoTela.classList.remove("ativo");
            videoTela.classList.remove("saindo");
            videoTela.style.visibility = "hidden";

            if (audioDisponivel) {
              musica.volume = somLigado ? CONFIG.volumeMusica : 0;
              controleSom.classList.add("visivel");
            }

            esconderCapa();
            return;
          }
        }

        if (iniciouMudoPorPolitica) {
          ativarSomFallback.classList.add("visivel");
        }

        esconderCapa();

        /* Pular fica visível no início do vídeo por CONFIG.tempoPular e depois desaparece com fade-out. */
        pular.classList.add("visivel");
        clearTimeout(timerPular);
        timerPular = setTimeout(() => {
          pular.classList.remove("visivel");
        }, CONFIG.tempoPular);

        acompanharFinal();
      }

      function acompanharFinal() {
        cancelAnimationFrame(rafFim);

        const verificar = () => {
          if (finalizando || finalAtivo) return;

          manterSincronia();

          if (Number.isFinite(video.duration) && video.duration > 0) {
            const restante = video.duration - video.currentTime;

            if (restante > 0 && restante <= 0.45) {
              finalizarVideo();
              return;
            }
          }

          rafFim = requestAnimationFrame(verificar);
        };

        rafFim = requestAnimationFrame(verificar);
      }

      async function finalizarVideo() {
        if (finalizando || finalAtivo) return;
        ativarSomFallback.classList.remove("visivel");

        manterSincronia(true);

        finalizando = true;
        clearTimeout(timerPular);
        cancelAnimationFrame(rafFim);
        pular.classList.remove("visivel");
        ativarSomFallback.classList.remove("visivel");

        await carregarFinal().catch(() => false);

        finalTela.classList.add("ativo");
        videoTela.classList.add("saindo");

        transicaoSuaveAudio(() => {
          video.pause();

          videoTela.classList.remove("ativo");
          videoTela.classList.remove("saindo");
          videoTela.style.visibility = "hidden";

          video.volume = 1;
          finalAtivo = true;
          finalizando = false;

          if (audioDisponivel) {
            controleSom.classList.add("visivel");
          }
        });
      }

      function abrirLocalizacao() {
        modalLocalizacao.classList.add("aberto");
        fecharLocalizacao.focus();
      }

      function fecharLocalizacaoModal() {
        modalLocalizacao.classList.remove("aberto");
      }

      function abrirDestino(url) {
        const link = document.createElement("a");
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        document.body.appendChild(link);
        link.click();
        link.remove();
      }

      function urlRsvpEmbed() {
        const url = new URL(CONFIG.linkConfirmacao);
        url.searchParams.set("embed", "1");
        return url.toString();
      }

      function videoPrincipal() {
        return document.getElementById("video") || null;
      }

      function mostrarRsvpCarregado() {
        if (!modalRsvp.classList.contains("aberto")) return;

        clearTimeout(timerRsvpFallback);
        timerRsvpFallback = null;
        rsvpLoading.classList.add("oculto");
        rsvpFrame.classList.add("pronto");
      }

      function abrirRsvp() {
        if (!CONFIG.linkConfirmacao) return;

        const videoPrincipalAtual = videoPrincipal();

        videoRsvpEstavaTocando = Boolean(
          videoPrincipalAtual &&
          !videoPrincipalAtual.paused &&
          !finalAtivo
        );

        if (videoRsvpEstavaTocando) {
          videoPrincipalAtual.pause();
        }

        /*
          A musica permanece sob o controle do convite.
          Nao pausar, reiniciar, mutar ou reposicionar ao abrir RSVP.
        */
        clearTimeout(timerRsvpFallback);
        timerRsvpFallback = null;

        rsvpLoading.classList.remove("oculto");
        rsvpFrame.classList.remove("pronto");
        rsvpFallback.href = CONFIG.linkConfirmacao;

        modalRsvp.classList.add("aberto");
        fecharRsvp.focus();

        requestAnimationFrame(() => {
          rsvpFrame.src = urlRsvpEmbed();
        });

        timerRsvpFallback = setTimeout(() => {
          mostrarRsvpCarregado();
        }, 3500);
      }

      function fecharRsvpModal() {
        modalRsvp.classList.remove("aberto");

        clearTimeout(timerRsvpFallback);
        timerRsvpFallback = null;

        const videoPrincipalAtual = videoPrincipal();

        if (videoPrincipalAtual && videoRsvpEstavaTocando) {
          videoPrincipalAtual.play().catch(() => {});
        }

        videoRsvpEstavaTocando = false;

        setTimeout(() => {
          if (!modalRsvp.classList.contains("aberto")) {
            rsvpFrame.src = "about:blank";
            rsvpFrame.classList.remove("pronto");
            rsvpLoading.classList.remove("oculto");
          }
        }, 220);
      }

      function abrirFiltro() {
        if (!CONFIG.linkFiltro) return;
        abrirDestino(CONFIG.linkFiltro);
      }

      async function abrirPresentes() {
        modalPresentes.classList.add("aberto");
        fecharPresentes.focus();
        await carregarPresentes().catch(() => false);
      }

      function fecharPresentesModal() {
        modalPresentes.classList.remove("aberto");
      }


      function alternarSom() {
        if (!audioDisponivel) return;

        somLigado = !somLigado;
        musica.volume = somLigado ? CONFIG.volumeMusica : 0;
        controleSom.classList.toggle("mudo", !somLigado);
      }

      function tratarVisibilidade() {
        if (document.hidden) {
          videoEstavaTocando = !video.paused && !finalAtivo && !finalizando;
          musicaEstavaTocando = !musica.paused;

          if (videoEstavaTocando) video.pause();
          if (musicaEstavaTocando) musica.pause();
          return;
        }

        if (videoEstavaTocando && !finalAtivo) {
          video.play().then(acompanharFinal).catch(() => {});
        }

        if (musicaEstavaTocando && audioDisponivel) {
          musica.play().catch(() => {});
        }

        videoEstavaTocando = false;
        musicaEstavaTocando = false;
      }

      prepararEntradaInterativa();

      /*
        NOVO FLUXO:
        1) tela de preparação;
        2) clique único solicita permissões e desbloqueia mídia;
        3) capa aparece;
        4) AGITAR inicia;
        5) toque só é habilitado se o sensor falhar/for negado.
      */
      abrirConvite.addEventListener("click", abrirPorToqueFallback);
      pular.addEventListener("click", finalizarVideo);
      ativarSomFallback.addEventListener("click", async () => {
        try {
          audioDisponivel = true;
          video.muted = false;
          video.volume = 1;

          try {
            musica.currentTime = tempoEsperadoMusica();
          } catch (_) {}

          musica.volume = somLigado ? CONFIG.volumeMusica : 0;

          const tentativaMusica = musica.play();
          if (tentativaMusica && typeof tentativaMusica.catch === "function") {
            await tentativaMusica.catch(() => {});
          }

          ativarSomFallback.classList.remove("visivel");
          controleSom.classList.add("visivel");
        } catch (_) {
          ativarSomFallback.textContent = "Toque novamente para ativar o som";
        }
      });

      controleSom.addEventListener("click", alternarSom);

      hotspotConfirmacao.addEventListener("click", abrirRsvp);
      hotspotLocalizacao.addEventListener("click", abrirLocalizacao);
      hotspotPresentes.addEventListener("click", abrirPresentes);
      hotspotFiltro.addEventListener("click", abrirFiltro);

      abrirGoogleMaps.addEventListener("click", () => abrirDestino(CONFIG.linkMapa));
      abrirWaze.addEventListener("click", () => abrirDestino(CONFIG.linkWaze));
      abrirUber.addEventListener("click", () => abrirDestino(CONFIG.linkUber));
      fecharLocalizacao.addEventListener("click", fecharLocalizacaoModal);

      modalLocalizacao.addEventListener("click", (event) => {
        if (event.target === modalLocalizacao) {
          fecharLocalizacaoModal();
        }
      });

      fecharRsvp.addEventListener("click", fecharRsvpModal);

      modalRsvp.addEventListener("click", (event) => {
        if (event.target === modalRsvp) {
          fecharRsvpModal();
        }
      });

      rsvpFrame.addEventListener("load", () => {
        if (!modalRsvp.classList.contains("aberto")) return;
        if (!rsvpFrame.src || rsvpFrame.src === "about:blank") return;
        mostrarRsvpCarregado();
      });

      window.addEventListener("message", (event) => {
        if (event.origin !== "https://confirmacao.libriconvites.com.br") return;
        if (event.source !== rsvpFrame.contentWindow) return;

        const data = event.data;
        if (!data || data.source !== "libri-rsvp") return;

        if (data.type === "libri-rsvp-ready") {
          mostrarRsvpCarregado();
          return;
        }

        if (data.type === "libri-rsvp-complete") {
          modalRsvp.dataset.status = data.status || "";
          return;
        }

        if (data.type === "libri-rsvp-close") {
          fecharRsvpModal();
        }
      });

      fecharPresentes.addEventListener("click", fecharPresentesModal);

      modalPresentes.addEventListener("click", (event) => {
        if (event.target === modalPresentes) {
          fecharPresentesModal();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;

        if (modalRsvp.classList.contains("aberto")) {
          fecharRsvpModal();
          return;
        }

        if (modalPresentes.classList.contains("aberto")) {
          fecharPresentesModal();
          return;
        }

        if (modalLocalizacao.classList.contains("aberto")) {
          fecharLocalizacaoModal();
        }
      });

      video.addEventListener("timeupdate", () => {
        if (finalizando || finalAtivo) return;

        manterSincronia();

        if (
          Number.isFinite(video.duration) &&
          video.duration > 0 &&
          (video.duration - video.currentTime) <= 0.45
        ) {
          finalizarVideo();
        }
      });

      video.addEventListener("ended", finalizarVideo);

      video.addEventListener("error", () => {
        if (conviteAberto && !finalAtivo) {
          esconderCapa();
          finalizarVideo();
        }
      });

      musica.addEventListener("error", () => {
        audioDisponivel = false;
        controleSom.classList.remove("visivel");
      });

      document.addEventListener("visibilitychange", tratarVisibilidade);

      window.addEventListener("pageshow", (event) => {
        if (event.persisted && finalAtivo && audioDisponivel) {
          musica.volume = somLigado ? CONFIG.volumeMusica : 0;
          musica.play().catch(() => {});
        }
      });

      document.addEventListener("contextmenu", (event) => {
        event.preventDefault();
      });

      document.addEventListener("dragstart", (event) => {
        event.preventDefault();
      });
    }).catch((erro) => {
      console.error("[Libri] Falha ao iniciar convite:", erro);
      document.body.innerHTML = `<div style="min-height:100dvh;display:grid;place-items:center;background:#000;color:#fff;font:16px Arial;padding:24px;text-align:center">N&#227;o foi poss&#237;vel carregar o convite.</div>`;
    });
  </script>
</body>
</html>

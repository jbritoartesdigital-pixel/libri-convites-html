  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #040611;

      overflow: hidden;

      user-select: none;
      -webkit-user-select: none;

      overscroll-behavior: none;

    }


    body {

      width: 100vw;

      height: 100vh;
      height: 100dvh;

    }


    /* ==================================================
       EXPERIÊNCIA FULLSCREEN
    ================================================== */

    #experiencia {

      position: fixed;

      inset: 0;

      width: 100vw;

      height: 100vh;
      height: 100dvh;

      overflow: hidden;

      background: #040611;

      isolation: isolate;

    }


    .tela {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

    }


    /* ==================================================
       CAPA
    ================================================== */

    #capaTela {

      z-index: 30;

      opacity: 1;

      transition:
        opacity 250ms ease;

    }


    #capaTela.saindo {

      opacity: 0;

      pointer-events: none;

    }


    #capa {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      object-position: center center;

      display: block;

      pointer-events: none;

      -webkit-user-drag: none;

    }


    /* ==================================================
       ESTRELA
    ================================================== */

    #estrela {

      position: absolute;

      z-index: 40;

      cursor: grab;

      touch-action: none;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;

      filter:

        drop-shadow(
          0 0 7px
          rgba(255,255,255,.95)
        )

        drop-shadow(
          0 0 18px
          rgba(210,195,255,.88)
        )

        drop-shadow(
          0 0 32px
          rgba(135,155,255,.58)
        );

      animation:
        estrelaRespira
        2s
        ease-in-out
        infinite;

    }


    #estrela.arrastando {

      cursor: grabbing;

      animation: none;

      transform:
        scale(1.13);

      filter:

        drop-shadow(
          0 0 11px
          white
        )

        drop-shadow(
          0 0 28px
          rgba(218,205,255,1)
        )

        drop-shadow(
          0 0 46px
          rgba(140,160,255,.95)
        );

    }


    #estrela.encaixando {

      animation: none;

      pointer-events: none;

      transform:
        scale(.92);

      filter:

        drop-shadow(
          0 0 15px
          white
        )

        drop-shadow(
          0 0 40px
          rgba(220,205,255,1)
        );

    }


    @keyframes estrelaRespira {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }

    }


    /* ==================================================
       ÁREA INVISÍVEL DO CASTELO
    ================================================== */

    #zonaCastelo {

      position: absolute;

      z-index: 35;

      pointer-events: none;

      border-radius: 50%;

    }


    /* ==================================================
       HALO DO CASTELO
    ================================================== */

    #haloCastelo {

      position: absolute;

      z-index: 34;

      pointer-events: none;

      border-radius: 50%;

      opacity: 0;

      transform:
        scale(.75);

      background:

        radial-gradient(
          circle,
          rgba(255,255,255,.55),
          rgba(205,190,255,.20) 40%,
          transparent 72%
        );

      transition:
        opacity 180ms ease,
        transform 180ms ease;

    }


    #haloCastelo.ativo {

      opacity: 1;

      transform:
        scale(1.25);

    }


    /* ==================================================
       FLASH MÁGICO
    ================================================== */

    #flash {

      position: absolute;

      z-index: 100;

      pointer-events: none;

      border-radius: 50%;

      opacity: 0;

      transform:
        scale(.05);

      background:

        radial-gradient(
          circle,
          rgba(255,255,255,1) 0%,
          rgba(230,220,255,.95) 15%,
          rgba(190,195,255,.67) 36%,
          rgba(155,125,230,.28) 55%,
          transparent 72%
        );

    }


    #flash.ativo {

      animation:
        despertarMagia
        900ms
        ease-out
        forwards;

    }


    @keyframes despertarMagia {

      0% {

        opacity: 0;

        transform:
          scale(.05);

      }


      18% {

        opacity: 1;

      }


      65% {

        opacity: .95;

      }


      100% {

        opacity: 0;

        transform:
          scale(9);

      }

    }


    /* ==================================================
       VÍDEO
    ================================================== */

    #videoTela {

      display: none;

      z-index: 20;

      background: #040611;

    }


    #video {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      object-position: center center;

      display: block;

      background: #040611;

    }


    /* ==================================================
       PULAR
    ================================================== */

    #pular {

      position: absolute;

      z-index: 70;

      right: 18px;

      bottom:
        calc(
          22px +
          env(safe-area-inset-bottom)
        );

      display: none;

      padding:
        9px 15px;

      border:

        1px solid
        rgba(255,255,255,.55);

      border-radius:
        22px;

      background:
        rgba(3,5,17,.52);

      backdrop-filter:
        blur(7px);

      -webkit-backdrop-filter:
        blur(7px);

      color: white;

      font:
        13px Arial,
        sans-serif;

      cursor: pointer;

    }


    /* ==================================================
       CARREGAMENTO
    ================================================== */

    #carregando {

      position: absolute;

      inset: 0;

      z-index: 75;

      display: none;

      align-items: center;

      justify-content: center;

      background:
        rgba(2,4,14,.30);

      color: white;

      font:
        14px Arial,
        sans-serif;

      pointer-events: none;

    }


    #continuar {

      position: absolute;

      inset: 0;

      z-index: 80;

      display: none;

      align-items: center;

      justify-content: center;

      background:
        rgba(3,5,17,.60);

      cursor: pointer;

    }


    #continuar span {

      padding:
        12px 20px;

      border:

        1px solid
        rgba(255,255,255,.55);

      border-radius:
        25px;

      background:
        rgba(7,9,24,.67);

      color: white;

      font:
        14px Arial,
        sans-serif;

    }


    /* ==================================================
       FINAL
    ================================================== */

    #finalTela {

      display: none;

      z-index: 90;

      opacity: 0;

      background: #040611;

      transition:
        opacity 450ms ease;

    }


    #finalTela.ativo {

      opacity: 1;

    }


    #final {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      object-position: center center;

      pointer-events: none;

      -webkit-user-drag: none;

    }


    /* ==================================================
       BOTÕES INVISÍVEIS
    ================================================== */

    .hotspot {

      position: absolute;

      z-index: 110;

      cursor: pointer;

      background:
        transparent;

      border: 0;

      outline: 0;

      touch-action: manipulation;

    }


  </style>

  <script>


    /* ==================================================
       🌸🌸🌸 ALTERE SOMENTE AQUI 🌸🌸🌸
    ================================================== */


    const CONFIG = {


      /* PASTA */

      pastaCliente:
        "save-disney100",


      hostMidia:
        "https://midia.libriconvites.com.br",


      versaoArquivos:
        "2",


      /* IMAGENS */

      capaArquivo:
        "capa.jpg",


      estrelaArquivo:
        "estrela.png",


      finalArquivo:
        "final.jpg",


      /* VÍDEO */

      videoArquivo:
        "abertura.mp4",


      /* MÚSICA */

      musicaArquivo:
        "disneyinstrumental.mp3",


      musicaInicio:
        0,


      /* Volume durante as falas */

      musicaVolumeVideo:
        0.10,


      /* Volume depois que o vídeo termina */

      musicaVolumeFinal:
        0.35,


      /* ESTRELA */

      estrelaEsquerda:
        42,


      estrelaTopo:
        78,


      estrelaLargura:
        16,


      /* TORRE / ALVO */

      casteloEsquerda:
        43,


      casteloTopo:
        16,


      casteloLargura:
        14,


      casteloAltura:
        20,


      /* CONFIRMAÇÃO */

      confirmarEsquerda:
        14.5,


      confirmarTopo:
        90.3,


      confirmarLargura:
        35.5,


      confirmarAltura:
        6.2,


      /* LOCALIZAÇÃO */

      localizacaoEsquerda:
        51.5,


      localizacaoTopo:
        90.3,


      localizacaoLargura:
        36.5,


      localizacaoAltura:
        6.2,


      /* WHATSAPP */

      whatsappNumero:
        "5561995705621",


      whatsappMensagem:
        "Olá! Quero confirmar minha presença no aniversário de 2 aninhos do Gabriel.",


      /* MAPA */

      localizacao:
        "Walt Disney World Resort, Orlando, FL, USA",


      /* PULAR */

      mostrarPular:
        true,


      tempoPular:
        5000


    };


    /* ==================================================
       ⛔⛔⛔ DAQUI PARA BAIXO NÃO PRECISA EDITAR ⛔⛔⛔
    ================================================== */


    const experiencia =
      document.getElementById(
        "experiencia"
      );


    const capaTela =
      document.getElementById(
        "capaTela"
      );


    const capa =
      document.getElementById(
        "capa"
      );


    const estrela =
      document.getElementById(
        "estrela"
      );


    const zonaCastelo =
      document.getElementById(
        "zonaCastelo"
      );


    const haloCastelo =
      document.getElementById(
        "haloCastelo"
      );


    const flash =
      document.getElementById(
        "flash"
      );


    const videoTela =
      document.getElementById(
        "videoTela"
      );


    const video =
      document.getElementById(
        "video"
      );


    const musica =
      document.getElementById(
        "musica"
      );


    const pular =
      document.getElementById(
        "pular"
      );


    const carregando =
      document.getElementById(
        "carregando"
      );


    const continuar =
      document.getElementById(
        "continuar"
      );


    const finalTela =
      document.getElementById(
        "finalTela"
      );


    const final =
      document.getElementById(
        "final"
      );


    const botaoConfirmar =
      document.getElementById(
        "botaoConfirmar"
      );


    const botaoLocalizacao =
      document.getElementById(
        "botaoLocalizacao"
      );


    /* ==================================================
       URLS
    ================================================== */


    const versao =

      "?v=" +

      encodeURIComponent(
        CONFIG.versaoArquivos
      );


    function imagemUrl(nome) {

      return (

        "imagens/" +

        nome +

        versao

      );

    }


    function midiaUrl(nome) {

      return (

        CONFIG.hostMidia +

        "/" +

        CONFIG.pastaCliente +

        "/" +

        nome +

        versao

      );

    }


    /* ==================================================
       ARQUIVOS
    ================================================== */


    capa.src =
      imagemUrl(
        CONFIG.capaArquivo
      );


    estrela.src =
      imagemUrl(
        CONFIG.estrelaArquivo
      );


    final.src =
      imagemUrl(
        CONFIG.finalArquivo
      );


    video.src =
      midiaUrl(
        CONFIG.videoArquivo
      );


    musica.src =
      midiaUrl(
        CONFIG.musicaArquivo
      );


    /* ==================================================
       MAPA DO OBJECT-FIT COVER
    ================================================== */


    function obterAreaRenderizada(
      imagem
    ) {


      const palco =
        experiencia
          .getBoundingClientRect();


      const larguraNatural =
        imagem.naturalWidth;


      const alturaNatural =
        imagem.naturalHeight;


      if (
        !larguraNatural ||
        !alturaNatural
      ) {

        return null;

      }


      const escala =

        Math.max(

          palco.width /
          larguraNatural,

          palco.height /
          alturaNatural

        );


      const largura =

        larguraNatural *
        escala;


      const altura =

        alturaNatural *
        escala;


      const esquerda =

        (
          palco.width -
          largura
        ) / 2;


      const topo =

        (
          palco.height -
          altura
        ) / 2;


      return {

        esquerda,
        topo,
        largura,
        altura

      };


    }


    function posicionarNaImagem(

      elemento,

      imagem,

      esquerdaPct,

      topoPct,

      larguraPct,

      alturaPct

    ) {


      const area =
        obterAreaRenderizada(
          imagem
        );


      if (!area) {

        return;

      }


      elemento.style.left =

        (
          area.esquerda +

          area.largura *
          esquerdaPct /
          100

        ) +

        "px";


      elemento.style.top =

        (
          area.topo +

          area.altura *
          topoPct /
          100

        ) +

        "px";


      elemento.style.width =

        (
          area.largura *
          larguraPct /
          100
        ) +

        "px";


      if (

        alturaPct !==
        null &&

        alturaPct !==
        undefined

      ) {


        elemento.style.height =

          (
            area.altura *
            alturaPct /
            100
          ) +

          "px";


      }


    }


    /* ==================================================
       LAYOUT
    ================================================== */


    function aplicarLayout() {


      posicionarNaImagem(

        estrela,

        capa,

        CONFIG.estrelaEsquerda,

        CONFIG.estrelaTopo,

        CONFIG.estrelaLargura,

        null

      );


      posicionarNaImagem(

        zonaCastelo,

        capa,

        CONFIG.casteloEsquerda,

        CONFIG.casteloTopo,

        CONFIG.casteloLargura,

        CONFIG.casteloAltura

      );


      const zona =

        zonaCastelo
          .getBoundingClientRect();


      const palco =

        experiencia
          .getBoundingClientRect();


      if (
        zona.width &&
        zona.height
      ) {


        const tamanhoHalo =

          Math.max(
            zona.width,
            zona.height
          ) *
          1.1;


        haloCastelo.style.left =

          (
            zona.left -
            palco.left +

            zona.width /
            2 -

            tamanhoHalo /
            2

          ) +

          "px";


        haloCastelo.style.top =

          (
            zona.top -
            palco.top +

            zona.height /
            2 -

            tamanhoHalo /
            2

          ) +

          "px";


        haloCastelo.style.width =

          tamanhoHalo +

          "px";


        haloCastelo.style.height =

          tamanhoHalo +

          "px";


        flash.style.left =

          (
            zona.left -
            palco.left +

            zona.width /
            2 -

            tamanhoHalo /
            2

          ) +

          "px";


        flash.style.top =

          (
            zona.top -
            palco.top +

            zona.height /
            2 -

            tamanhoHalo /
            2

          ) +

          "px";


        flash.style.width =

          tamanhoHalo +

          "px";


        flash.style.height =

          tamanhoHalo +

          "px";


      }


      posicionarNaImagem(

        botaoConfirmar,

        final,

        CONFIG.confirmarEsquerda,

        CONFIG.confirmarTopo,

        CONFIG.confirmarLargura,

        CONFIG.confirmarAltura

      );


      posicionarNaImagem(

        botaoLocalizacao,

        final,

        CONFIG.localizacaoEsquerda,

        CONFIG.localizacaoTopo,

        CONFIG.localizacaoLargura,

        CONFIG.localizacaoAltura

      );


    }


    capa.addEventListener(

      "load",

      aplicarLayout

    );


    final.addEventListener(

      "load",

      aplicarLayout

    );


    window.addEventListener(

      "resize",

      aplicarLayout

    );


    /* ==================================================
       ESTADO
    ================================================== */


    let arrastando =
      false;


    let ativado =
      false;


    let offsetX =
      0;


    let offsetY =
      0;


    let inicioLeft =
      0;


    let inicioTop =
      0;


    let timerPular =
      null;


    let estavaTocandoAntesDeSair =
      false;


    let musicaEstavaTocandoAntesDeSair =
      false;


    /* ==================================================
       ARRASTAR ESTRELA
    ================================================== */


    function iniciarArraste(
      event
    ) {


      if (ativado) {

        return;

      }


      arrastando =
        true;


      const rect =

        estrela
          .getBoundingClientRect();


      offsetX =

        event.clientX -
        rect.left;


      offsetY =

        event.clientY -
        rect.top;


      inicioLeft =

        estrela.offsetLeft;


      inicioTop =

        estrela.offsetTop;


      estrela.classList.add(
        "arrastando"
      );


      try {

        estrela.setPointerCapture(
          event.pointerId
        );

      }

      catch (_) {}


      event.preventDefault();


    }


    function moverEstrela(
      event
    ) {


      if (

        !arrastando ||
        ativado

      ) {

        return;

      }


      const palco =

        experiencia
          .getBoundingClientRect();


      let esquerda =

        event.clientX -
        palco.left -
        offsetX;


      let topo =

        event.clientY -
        palco.top -
        offsetY;


      esquerda =

        Math.max(

          0,

          Math.min(

            esquerda,

            palco.width -
            estrela.offsetWidth

          )

        );


      topo =

        Math.max(

          0,

          Math.min(

            topo,

            palco.height -
            estrela.offsetHeight

          )

        );


      estrela.style.left =

        esquerda +
        "px";


      estrela.style.top =

        topo +
        "px";


      atualizarHalo();


      event.preventDefault();


    }


    function finalizarArraste(
      event
    ) {


      if (

        !arrastando ||
        ativado

      ) {

        return;

      }


      arrastando =
        false;


      estrela.classList.remove(
        "arrastando"
      );


      haloCastelo.classList.remove(
        "ativo"
      );


      if (
        estrelaSobreCastelo()
      ) {


        ativarMagia();


      }

      else {


        voltarEstrela();


      }


      try {

        estrela.releasePointerCapture(
          event.pointerId
        );

      }

      catch (_) {}


    }


    function estrelaSobreCastelo() {


      const estrelaRect =

        estrela
          .getBoundingClientRect();


      const casteloRect =

        zonaCastelo
          .getBoundingClientRect();


      const centroX =

        estrelaRect.left +

        estrelaRect.width /
        2;


      const centroY =

        estrelaRect.top +

        estrelaRect.height /
        2;


      return (

        centroX >=
        casteloRect.left &&

        centroX <=
        casteloRect.right &&

        centroY >=
        casteloRect.top &&

        centroY <=
        casteloRect.bottom

      );


    }


    function atualizarHalo() {


      if (
        estrelaSobreCastelo()
      ) {


        haloCastelo
          .classList
          .add(
            "ativo"
          );


      }

      else {


        haloCastelo
          .classList
          .remove(
            "ativo"
          );


      }


    }


    function voltarEstrela() {


      estrela.style.transition =

        "left 420ms cubic-bezier(.2,.8,.2,1)," +

        "top 420ms cubic-bezier(.2,.8,.2,1)";


      estrela.style.left =

        inicioLeft +

        "px";


      estrela.style.top =

        inicioTop +

        "px";


      setTimeout(

        () => {


          estrela.style.transition =
            "";


          aplicarLayout();


        },

        450

      );


    }


    /* ==================================================
       ATIVAR MAGIA
    ================================================== */


    function ativarMagia() {


      if (ativado) {

        return;

      }


      ativado =
        true;


      const palco =

        experiencia
          .getBoundingClientRect();


      const destino =

        zonaCastelo
          .getBoundingClientRect();


      const esquerdaFinal =

        destino.left -
        palco.left +

        destino.width /
        2 -

        estrela.offsetWidth /
        2;


      const topoFinal =

        destino.top -
        palco.top +

        destino.height /
        2 -

        estrela.offsetHeight /
        2;


      estrela.classList.add(
        "encaixando"
      );


      estrela.style.transition =

        "left 180ms cubic-bezier(.18,.8,.2,1)," +

        "top 180ms cubic-bezier(.18,.8,.2,1)," +

        "transform 180ms ease";


      estrela.style.left =

        esquerdaFinal +

        "px";


      estrela.style.top =

        topoFinal +

        "px";


      navigator.vibrate?.(
        25
      );


      /*
        O vídeo e a música começam
        diretamente no gesto do usuário.
      */

      iniciarMidias();


      flash.classList.add(
        "ativo"
      );


      setTimeout(

        () => {


          capaTela
            .classList
            .add(
              "saindo"
            );


        },

        120

      );


      setTimeout(

        () => {


          capaTela.style.display =
            "none";


        },

        370

      );


    }


    /* ==================================================
       VÍDEO + MÚSICA
    ================================================== */


    function iniciarMidias() {


      videoTela.style.display =
        "block";


      /* VÍDEO */

      try {

        video.currentTime =
          0;

      }

      catch (_) {}


      video.muted =
        false;


      video.volume =
        1;


      /* MÚSICA */

      try {

        musica.currentTime =
          CONFIG.musicaInicio;

      }

      catch (_) {}


      musica.muted =
        false;


      musica.volume =
        CONFIG.musicaVolumeVideo;


      /* Tenta iniciar os dois
         no mesmo gesto da estrela */

      const tocarMusica =
        musica.play();


      const tocarVideo =
        video.play();


      if (
        tocarMusica &&
        typeof tocarMusica.catch ===
        "function"
      ) {


        tocarMusica.catch(

          () => {


            continuar.style.display =
              "flex";


          }

        );


      }


      if (
        tocarVideo &&
        typeof tocarVideo.catch ===
        "function"
      ) {


        tocarVideo.catch(

          () => {


            continuar.style.display =
              "flex";


          }

        );


      }


      iniciarTimerPular();


    }


    /* ==================================================
       PULAR
    ================================================== */


    function iniciarTimerPular() {


      if (
        !CONFIG.mostrarPular
      ) {

        return;

      }


      clearTimeout(
        timerPular
      );


      timerPular =

        setTimeout(

          () => {


            if (
              videoTela.style.display ===
              "block"
            ) {


              pular.style.display =
                "block";


            }


          },

          CONFIG.tempoPular

        );


    }


    /* ==================================================
       EVENTOS DO VÍDEO
    ================================================== */


    video.addEventListener(

      "playing",

      () => {


        carregando.style.display =
          "none";


      }

    );


    video.addEventListener(

      "waiting",

      () => {


        if (
          !video.ended
        ) {


          carregando.style.display =
            "flex";


        }


      }

    );


    video.addEventListener(

      "canplay",

      () => {


        carregando.style.display =
          "none";


      }

    );


    video.addEventListener(

      "ended",

      mostrarFinal

    );


    video.addEventListener(

      "error",

      () => {


        carregando.style.display =
          "none";


        continuar.style.display =
          "flex";


      }

    );


    /* ==================================================
       FALLBACK DE ÁUDIO / VÍDEO
    ================================================== */


    continuar.addEventListener(

      "click",

      async () => {


        continuar.style.display =
          "none";


        try {


          musica.muted =
            false;


          musica.volume =
            CONFIG.musicaVolumeVideo;


          if (
            musica.paused
          ) {


            await musica.play();


          }


          if (
            video.paused &&
            !video.ended
          ) {


            await video.play();


          }


        }

        catch (_) {


          /* O convite continua funcionando
             mesmo que algum navegador bloqueie
             uma das mídias. */


        }


      }

    );


    /* ==================================================
       FINAL
    ================================================== */


    function mostrarFinal() {


      clearTimeout(
        timerPular
      );


      pular.style.display =
        "none";


      carregando.style.display =
        "none";


      continuar.style.display =
        "none";


      video.pause();


      /* NÃO reinicia a música.
         Apenas aumenta o volume. */


      musica.volume =
        CONFIG.musicaVolumeFinal;


      if (
        musica.paused
      ) {


        musica.play()
          .catch(
            () => {}
          );


      }


      videoTela.style.display =
        "none";


      finalTela.style.display =
        "block";


      aplicarLayout();


      requestAnimationFrame(

        () => {


          finalTela
            .classList
            .add(
              "ativo"
            );


        }

      );


    }


    pular.addEventListener(

      "click",

      mostrarFinal

    );


    /* ==================================================
       WHATSAPP
    ================================================== */


    botaoConfirmar.addEventListener(

      "click",

      () => {


        pausarParaSair();


        const link =

          "https://wa.me/" +

          CONFIG.whatsappNumero +

          "?text=" +

          encodeURIComponent(
            CONFIG.whatsappMensagem
          );


        window.location.href =
          link;


      }

    );


    /* ==================================================
       LOCALIZAÇÃO
    ================================================== */


    botaoLocalizacao.addEventListener(

      "click",

      () => {


        pausarParaSair();


        const link =

          "https://www.google.com/maps/search/?api=1&query=" +

          encodeURIComponent(
            CONFIG.localizacao
          );


        window.location.href =
          link;


      }

    );


    function pausarParaSair() {


      if (
        !video.paused
      ) {

        video.pause();

      }


      if (
        !musica.paused
      ) {

        musica.pause();

      }


    }


    /* ==================================================
       SAIR / VOLTAR AO APP
    ================================================== */


    document.addEventListener(

      "visibilitychange",

      async () => {


        if (
          document.hidden
        ) {


          estavaTocandoAntesDeSair =

            videoTela.style.display ===
            "block" &&

            !video.paused &&

            !video.ended;


          musicaEstavaTocandoAntesDeSair =

            !musica.paused;


          if (
            estavaTocandoAntesDeSair
          ) {


            video.pause();


          }


          if (
            musicaEstavaTocandoAntesDeSair
          ) {


            musica.pause();


          }


        }

        else {


          if (
            estavaTocandoAntesDeSair
          ) {


            try {


              await video.play();


            }

            catch (_) {}


          }


          if (
            musicaEstavaTocandoAntesDeSair
          ) {


            try {


              await musica.play();


            }

            catch (_) {}


          }


          estavaTocandoAntesDeSair =
            false;


          musicaEstavaTocandoAntesDeSair =
            false;


        }


      }

    );


    /* ==================================================
       EVENTOS DA ESTRELA
    ================================================== */


    estrela.addEventListener(

      "pointerdown",

      iniciarArraste

    );


    window.addEventListener(

      "pointermove",

      moverEstrela,

      {
        passive: false
      }

    );


    window.addEventListener(

      "pointerup",

      finalizarArraste

    );


    window.addEventListener(

      "pointercancel",

      finalizarArraste

    );


    estrela.addEventListener(

      "keydown",

      event => {


        if (
          ativado
        ) {

          return;

        }


        if (
          event.key ===
          "Enter"
        ) {


          event.preventDefault();


          ativarMagia();


        }


      }

    );


    /* ==================================================
       BLOQUEIOS CASUAIS
    ================================================== */


    document.addEventListener(

      "contextmenu",

      event => {

        event.preventDefault();

      }

    );


    document.addEventListener(

      "dragstart",

      event => {

        event.preventDefault();

      }

    );


    document.addEventListener(

      "selectstart",

      event => {

        event.preventDefault();

      }

    );


    /* ==================================================
       PRELOAD
    ================================================== */


    video.load();


    musica.load();


    const preloadFinal =
      new Image();


    preloadFinal.src =
      imagemUrl(
        CONFIG.finalArquivo
      );


  </script>


</body>

</html>

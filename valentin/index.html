        max(

            capaTela.style.visibility =
              "hidden";

          },
          200
        );

      }


      /* ==================================================
         ÁUDIO SILENCIOSO DURANTE VÍDEO
      ================================================== */

      function iniciarMusicaSilenciosa() {

        musica.volume =
          0.001;


        const tentativa =
          musica.play();


        if (
          tentativa &&
          typeof tentativa.catch ===
          "function"
        ) {

          tentativa.catch(
            () => {

              audioDisponivel =
                false;

            }
          );

        }

      }


      /* ==================================================
         ABRIR CONVITE
      ================================================== */

      async function iniciarConvite() {

        if (
          conviteJaAberto
        ) {

          return;

        }


        conviteJaAberto =
          true;


        videoTela.classList.add(
          "ativo"
        );


        iniciarMusicaSilenciosa();


        try {

          await video.play();

        }

        catch (_) {

          mostrarFinal();

          esconderCapa();

          return;

        }


        esconderCapa();


        pular.classList.add(
          "visivel"
        );


        clearTimeout(
          timerPular
        );


        timerPular =
          setTimeout(
            () => {

              pular.classList.remove(
                "visivel"
              );

            },
            CONFIG.tempoPular
          );


        acompanharVideo();

      }


      /* ==================================================
         GARANTIR FINAL CARREGADO
      ================================================== */

      async function garantirFinal() {

        if (
          finalImagem.complete &&
          finalImagem.naturalWidth > 0
        ) {

          if (
            typeof finalImagem.decode ===
            "function"
          ) {

            await finalImagem
              .decode()
              .catch(
                () => {}
              );

          }


          return;

        }


        await new Promise(
          resolve => {

            const terminar =
              () => {

                finalImagem.removeEventListener(
                  "load",
                  terminar
                );


                finalImagem.removeEventListener(
                  "error",
                  terminar
                );


                resolve();

              };


            finalImagem.addEventListener(
              "load",
              terminar
            );


            finalImagem.addEventListener(
              "error",
              terminar
            );

          }
        );

      }


      /* ==================================================
         MONITORAR FIM
      ================================================== */

      function acompanharVideo() {

        cancelAnimationFrame(
          rafVideo
        );


        const observar =
          async () => {

            if (
              finalAtivo
            ) {

              return;

            }


            if (

              Number.isFinite(
                video.duration
              )

              &&

              video.duration > 0

            ) {

              const restante =
                video.duration
                -
                video.currentTime;


              if (

                restante > 0

                &&

                restante <= 0.25

              ) {

                await garantirFinal();


                finalTela.style.visibility =
                  "visible";


                finalTela.classList.add(
                  "preparado"
                );

              }

            }


            rafVideo =
              requestAnimationFrame(
                observar
              );

          };


        rafVideo =
          requestAnimationFrame(
            observar
          );

      }


      /* ==================================================
         MÚSICA NO FINAL
      ================================================== */

      function continuarMusica(
        tempoVideo
      ) {

        if (
          !audioDisponivel
        ) {

          return;

        }


        let tempo =
          Math.max(
            0,
            tempoVideo
            +
            CONFIG.inicioMusica
          );


        if (

          Number.isFinite(
            musica.duration
          )

          &&

          musica.duration > 0

        ) {

          tempo %=
            musica.duration;

        }


        try {

          musica.currentTime =
            tempo;

        }

        catch (_) {}


        musica.volume =
          somLigado
            ?
            CONFIG.volumeMusica
            :
            0;


        musica
          .play()
          .catch(
            () => {

              audioDisponivel =
                false;


              controleSom.classList.remove(
                "visivel"
              );

            }
          );

      }


      /* ==================================================
         FINAL SEM FLASH PRETO
      ================================================== */

      async function mostrarFinal() {

        if (
          finalAtivo
        ) {

          return;

        }


        finalAtivo =
          true;


        clearTimeout(
          timerPular
        );


        cancelAnimationFrame(
          rafVideo
        );


        pular.classList.remove(
          "visivel"
        );


        const tempoVideo =
          Number.isFinite(
            video.currentTime
          )
            ?
            video.currentTime
            :
            0;


        await garantirFinal();


        finalTela.style.visibility =
          "visible";


        requestAnimationFrame(
          () => {

            finalTela.classList.add(
              "preparado",
              "ativo"
            );

          }
        );


        continuarMusica(
          tempoVideo
        );


        if (
          audioDisponivel
        ) {

          controleSom.classList.add(
            "visivel"
          );

        }


        setTimeout(
          () => {

            video.pause();


            videoTela.classList.remove(
              "ativo"
            );


            videoTela.style.visibility =
              "hidden";

          },
          260
        );

      }


      /* ==================================================
         PÁGINAS INTERNAS
      ================================================== */

      function fecharPaginas() {

        paginaLocalizacao.classList.remove(
          "ativa"
        );


        paginaConfirmacao.classList.remove(
          "ativa"
        );


        paginaPresentes.classList.remove(
          "ativa"
        );


        if (
          finalAtivo &&
          audioDisponivel
        ) {

          controleSom.classList.add(
            "visivel"
          );

        }

      }


      function abrirPagina(
        pagina
      ) {

        fecharPaginas();


        pagina.classList.add(
          "ativa"
        );


        controleSom.classList.remove(
          "visivel"
        );

      }


      /* ==================================================
         WHATSAPP
      ================================================== */

      function irWhatsapp() {

        const url =

          "https://wa.me/"

          +

          CONFIG.numeroWhatsapp

          +

          "?text="

          +

          encodeURIComponent(
            CONFIG.mensagemWhatsapp
          );


        window.location.href =
          url;

      }


      /* ==================================================
         PIX
      ================================================== */

      function mostrarAvisoPix() {

        avisoPix.classList.add(
          "visivel"
        );


        clearTimeout(
          timerPix
        );


        timerPix =
          setTimeout(
            () => {

              avisoPix.classList.remove(
                "visivel"
              );

            },
            2200
          );

      }


      function copiarFallback(
        texto
      ) {

        const campo =
          document.createElement(
            "textarea"
          );


        campo.value =
          texto;


        campo.style.position =
          "fixed";


        campo.style.opacity =
          "0";


        document.body.appendChild(
          campo
        );


        campo.focus();


        campo.select();


        let sucesso =
          false;


        try {

          sucesso =
            document.execCommand(
              "copy"
            );

        }

        catch (_) {}


        campo.remove();


        return sucesso;

      }


      async function copiarPix() {

        try {

          if (
            navigator.clipboard &&
            window.isSecureContext
          ) {

            await navigator.clipboard.writeText(
              CONFIG.chavePix
            );


            mostrarAvisoPix();


            return;

          }

        }

        catch (_) {}


        const copiado =
          copiarFallback(
            CONFIG.chavePix
          );


        if (
          copiado
        ) {

          mostrarAvisoPix();

        }

        else {

          window.prompt(
            "Copie a chave Pix:",
            CONFIG.chavePix
          );

        }

      }


      /* ==================================================
         SOM
      ================================================== */

      function alternarSom() {

        somLigado =
          !somLigado;


        musica.volume =
          somLigado
            ?
            CONFIG.volumeMusica
            :
            0;


        controleSom.classList.toggle(
          "mudo",
          !somLigado
        );

      }


      /* ==================================================
         SAIR / VOLTAR DO APP
      ================================================== */

      function visibilidade() {

        if (
          document.hidden
        ) {

          videoEstavaTocando =
            !video.paused &&
            !finalAtivo;


          musicaEstavaTocando =
            !musica.paused;


          if (
            videoEstavaTocando
          ) {

            video.pause();

          }


          if (
            musicaEstavaTocando
          ) {

            musica.pause();

          }


          return;

        }


        if (
          videoEstavaTocando &&
          !finalAtivo
        ) {

          video
            .play()
            .then(
              acompanharVideo
            )
            .catch(
              () => {}
            );

        }


        if (
          musicaEstavaTocando &&
          audioDisponivel
        ) {

          musica
            .play()
            .catch(
              () => {}
            );

        }


        videoEstavaTocando =
          false;


        musicaEstavaTocando =
          false;

      }


      /* ==================================================
         EVENTOS
      ================================================== */

      abrirConvite.addEventListener(
        "click",
        iniciarConvite
      );


      pular.addEventListener(
        "click",
        mostrarFinal
      );


      video.addEventListener(
        "ended",
        mostrarFinal
      );


      video.addEventListener(
        "playing",
        esconderCapa
      );


      hotspotLocalizacao.addEventListener(
        "click",
        () => {

          abrirPagina(
            paginaLocalizacao
          );

        }
      );


      hotspotConfirmacao.addEventListener(
        "click",
        () => {

          abrirPagina(
            paginaConfirmacao
          );

        }
      );


      hotspotPresentes.addEventListener(
        "click",
        () => {

          abrirPagina(
            paginaPresentes
          );

        }
      );


      voltarLocalizacao.addEventListener(
        "click",
        fecharPaginas
      );


      voltarConfirmacao.addEventListener(
        "click",
        fecharPaginas
      );


      voltarPresentes.addEventListener(
        "click",
        fecharPaginas
      );


      abrirLocalizacao.addEventListener(
        "click",
        () => {

          window.location.href =
            CONFIG.linkLocalizacao;

        }
      );


      abrirWhatsapp.addEventListener(
        "click",
        irWhatsapp
      );


      copiarPixBtn.addEventListener(
        "click",
        copiarPix
      );


      controleSom.addEventListener(
        "click",
        alternarSom
      );


      document.addEventListener(
        "visibilitychange",
        visibilidade
      );


      /* ==================================================
         BLOQUEIOS CASUAIS
      ================================================== */

      document.addEventListener(
        "contextmenu",
        event => {

          event.preventDefault();

        }
      );


      document.addEventListener(
        "dragstart",
        event => {

          event.preventDefault();

        }
      );


    })();

  </script>


</body>

</html>

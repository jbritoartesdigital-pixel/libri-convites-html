          dados.height;

      }


      posicionar(
        hotspotLocalizacao,
        CONFIG.hotspotsFinal.localizacao
      );


      posicionar(
        hotspotConfirmacao,
        CONFIG.hotspotsFinal.confirmacao
      );


      posicionar(
        hotspotPresentes,
        CONFIG.hotspotsFinal.presentes
      );


      posicionar(
        voltarLocalizacao,
        CONFIG.localizacao.voltar
      );


      posicionar(
        abrirLocalizacao,
        CONFIG.localizacao.abrir
      );


      posicionar(
        voltarConfirmacao,
        CONFIG.confirmacao.voltar
      );


      posicionar(
        abrirWhatsapp,
        CONFIG.confirmacao.abrir
      );


      posicionar(
        voltarPresentes,
        CONFIG.presentes.voltar
      );


      posicionar(
        copiarPixBtn,
        CONFIG.presentes.pix
      );


      /* ==================================================
         ÁUDIO SILENCIOSO
      ================================================== */

      function iniciarMusicaSilenciosa() {

        musica.volume =
          0.001;


        const tentativa =
          musica.play();


        if (
          tentativa &&
          typeof tentativa.catch ===
          "function"
        ) {

          tentativa.catch(
            () => {

              audioDisponivel =
                false;

            }
          );

        }

      }


      /* ==================================================
         CAPA
      ================================================== */

      function esconderCapa() {

        if (
          capaTela
            .classList
            .contains(
              "saindo"
            )
        ) {

          return;

        }


        capaTela
          .classList
          .add(
            "saindo"
          );


        setTimeout(
          () => {

            capaTela.style.visibility =
              "hidden";

          },
          200
        );

      }


      /* ==================================================
         ABRIR CONVITE
      ================================================== */

      async function iniciarConvite() {

        if (
          conviteAberto
        ) {

          return;

        }


        conviteAberto =
          true;


        videoTela.style.visibility =
          "visible";


        videoTela
          .classList
          .remove(
            "saindo"
          );


        videoTela
          .classList
          .add(
            "ativo"
          );


        iniciarMusicaSilenciosa();


        try {

          await video.play();

        }

        catch (_) {

          finalizarVideo();

          esconderCapa();

          return;

        }


        esconderCapa();


        pular
          .classList
          .add(
            "visivel"
          );


        clearTimeout(
          timerPular
        );


        timerPular =
          setTimeout(
            () => {

              pular
                .classList
                .remove(
                  "visivel"
                );

            },
            CONFIG.tempoPular
          );


        acompanharFinalVideo();

      }


      /* ==================================================
         TRANSIÇÃO SEM PRETO
      ================================================== */

      function acompanharFinalVideo() {

        cancelAnimationFrame(
          rafFim
        );


        const verificar =
          () => {

            if (
              finalizando ||
              finalAtivo
            ) {

              return;

            }


            if (
              Number.isFinite(
                video.duration
              )
              &&
              video.duration > 0
            ) {

              const restante =
                video.duration
                -
                video.currentTime;


              /*
                 Começamos ANTES do último frame.
                 O vídeo continua rodando durante o fade.
              */

              if (
                restante > 0
                &&
                restante <= 0.40
              ) {

                finalizarVideo();

                return;

              }

            }


            rafFim =
              requestAnimationFrame(
                verificar
              );

          };


        rafFim =
          requestAnimationFrame(
            verificar
          );

      }


      function finalizarVideo() {

        if (
          finalizando ||
          finalAtivo
        ) {

          return;

        }


        finalizando =
          true;


        clearTimeout(
          timerPular
        );


        cancelAnimationFrame(
          rafFim
        );


        pular
          .classList
          .remove(
            "visivel"
          );


        /*
           O card já está visível atrás.
           Aqui só ativamos os botões.
        */

        finalTela
          .classList
          .add(
            "ativo"
          );


        /*
           Fazemos o VÍDEO sumir suavemente.
           Não pausamos antes.
        */

        videoTela
          .classList
          .add(
            "saindo"
          );


        const tempoVideo =
          Number.isFinite(
            video.currentTime
          )
            ?
            video.currentTime
            :
            0;


        setTimeout(
          () => {

            video.pause();


            videoTela
              .classList
              .remove(
                "ativo"
              );


            videoTela
              .classList
              .remove(
                "saindo"
              );


            videoTela.style.visibility =
              "hidden";


            finalAtivo =
              true;


            finalizando =
              false;


            continuarMusica(
              tempoVideo
            );


            if (
              audioDisponivel
            ) {

              controleSom
                .classList
                .add(
                  "visivel"
                );

            }

          },
          250
        );

      }


      /* ==================================================
         CONTINUAR MÚSICA
      ================================================== */

      function continuarMusica(
        tempoVideo
      ) {

        if (
          !audioDisponivel
        ) {

          return;

        }


        let tempo =
          Math.max(
            0,
            tempoVideo
            +
            CONFIG.inicioMusica
          );


        if (
          Number.isFinite(
            musica.duration
          )
          &&
          musica.duration > 0
        ) {

          tempo %=
            musica.duration;

        }


        try {

          musica.currentTime =
            tempo;

        }

        catch (_) {}


        musica.volume =
          somLigado
            ?
            CONFIG.volumeMusica
            :
            0;


        musica
          .play()
          .catch(
            () => {

              audioDisponivel =
                false;


              controleSom
                .classList
                .remove(
                  "visivel"
                );

            }
          );

      }


      /* ==================================================
         PÁGINAS
      ================================================== */

      function fecharPaginas() {

        paginaLocalizacao
          .classList
          .remove(
            "ativa"
          );


        paginaConfirmacao
          .classList
          .remove(
            "ativa"
          );


        paginaPresentes
          .classList
          .remove(
            "ativa"
          );


        if (
          finalAtivo &&
          audioDisponivel
        ) {

          controleSom
            .classList
            .add(
              "visivel"
            );

        }

      }


      function abrirPagina(
        pagina
      ) {

        paginaLocalizacao
          .classList
          .remove(
            "ativa"
          );


        paginaConfirmacao
          .classList
          .remove(
            "ativa"
          );


        paginaPresentes
          .classList
          .remove(
            "ativa"
          );


        pagina
          .classList
          .add(
            "ativa"
          );


        controleSom
          .classList
          .remove(
            "visivel"
          );

      }


      /* ==================================================
         WHATSAPP
      ================================================== */

      function irWhatsapp() {

        const url =

          "https://wa.me/"

          +

          CONFIG.numeroWhatsapp

          +

          "?text="

          +

          encodeURIComponent(
            CONFIG.mensagemWhatsapp
          );


        window.location.href =
          url;

      }


      /* ==================================================
         PIX
      ================================================== */

      function mostrarAvisoPix() {

        avisoPix
          .classList
          .add(
            "visivel"
          );


        clearTimeout(
          timerPix
        );


        timerPix =
          setTimeout(
            () => {

              avisoPix
                .classList
                .remove(
                  "visivel"
                );

            },
            2200
          );

      }


      function copiarFallback(
        texto
      ) {

        const campo =
          document.createElement(
            "textarea"
          );


        campo.value =
          texto;


        campo.style.position =
          "fixed";


        campo.style.opacity =
          "0";


        document.body.appendChild(
          campo
        );


        campo.focus();

        campo.select();


        let sucesso =
          false;


        try {

          sucesso =
            document.execCommand(
              "copy"
            );

        }

        catch (_) {}


        campo.remove();


        return sucesso;

      }


      async function copiarPix() {

        try {

          if (
            navigator.clipboard
            &&
            window.isSecureContext
          ) {

            await navigator
              .clipboard
              .writeText(
                CONFIG.chavePix
              );


            mostrarAvisoPix();


            return;

          }

        }

        catch (_) {}


        if (
          copiarFallback(
            CONFIG.chavePix
          )
        ) {

          mostrarAvisoPix();

        }

        else {

          window.prompt(
            "Copie a chave Pix:",
            CONFIG.chavePix
          );

        }

      }


      /* ==================================================
         SOM
      ================================================== */

      function alternarSom() {

        somLigado =
          !somLigado;


        musica.volume =
          somLigado
            ?
            CONFIG.volumeMusica
            :
            0;


        controleSom
          .classList
          .toggle(
            "mudo",
            !somLigado
          );

      }


      /* ==================================================
         VISIBILIDADE
      ================================================== */

      function tratarVisibilidade() {

        if (
          document.hidden
        ) {

          videoEstavaTocando =
            !video.paused
            &&
            !finalAtivo
            &&
            !finalizando;


          musicaEstavaTocando =
            !musica.paused;


          if (
            videoEstavaTocando
          ) {

            video.pause();

          }


          if (
            musicaEstavaTocando
          ) {

            musica.pause();

          }


          return;

        }


        if (
          videoEstavaTocando
          &&
          !finalAtivo
        ) {

          video
            .play()
            .then(
              acompanharFinalVideo
            )
            .catch(
              () => {}
            );

        }


        if (
          musicaEstavaTocando
          &&
          audioDisponivel
        ) {

          musica
            .play()
            .catch(
              () => {}
            );

        }


        videoEstavaTocando =
          false;


        musicaEstavaTocando =
          false;

      }


      /* ==================================================
         EVENTOS
      ================================================== */

      abrirConvite
        .addEventListener(
          "click",
          iniciarConvite
        );


      pular
        .addEventListener(
          "click",
          finalizarVideo
        );


      video
        .addEventListener(
          "playing",
          esconderCapa
        );


      video
        .addEventListener(
          "timeupdate",
          () => {

            if (
              finalizando ||
              finalAtivo
            ) {

              return;

            }


            if (
              Number.isFinite(
                video.duration
              )
              &&
              video.duration > 0
            ) {

              const restante =
                video.duration
                -
                video.currentTime;


              if (
                restante <= 0.40
              ) {

                finalizarVideo();

              }

            }

          }
        );


      video
        .addEventListener(
          "ended",
          finalizarVideo
        );


      hotspotLocalizacao
        .addEventListener(
          "click",
          event => {

            event.preventDefault();

            event.stopPropagation();


            abrirPagina(
              paginaLocalizacao
            );

          }
        );


      hotspotConfirmacao
        .addEventListener(
          "click",
          event => {

            event.preventDefault();

            event.stopPropagation();


            /*
               A imagem já está carregada com v=5.
            */

            abrirPagina(
              paginaConfirmacao
            );

          }
        );


      hotspotPresentes
        .addEventListener(
          "click",
          event => {

            event.preventDefault();

            event.stopPropagation();


            abrirPagina(
              paginaPresentes
            );

          }
        );


      voltarLocalizacao
        .addEventListener(
          "click",
          fecharPaginas
        );


      voltarConfirmacao
        .addEventListener(
          "click",
          fecharPaginas
        );


      voltarPresentes
        .addEventListener(
          "click",
          fecharPaginas
        );


      abrirLocalizacao
        .addEventListener(
          "click",
          () => {

            window.location.href =
              CONFIG.linkLocalizacao;

          }
        );


      abrirWhatsapp
        .addEventListener(
          "click",
          irWhatsapp
        );


      copiarPixBtn
        .addEventListener(
          "click",
          copiarPix
        );


      controleSom
        .addEventListener(
          "click",
          alternarSom
        );


      document
        .addEventListener(
          "visibilitychange",
          tratarVisibilidade
        );


      /* ==================================================
         BLOQUEIOS CASUAIS
      ================================================== */

      document
        .addEventListener(
          "contextmenu",
          event => {

            event.preventDefault();

          }
        );


      document
        .addEventListener(
          "dragstart",
          event => {

            event.preventDefault();

          }
        );


    })();

  </script>


</body>

</html>

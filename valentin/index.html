          .decode()
          .catch(
            () => {}
          );

      }


      /* ==================================================
         HOTSPOTS
      ================================================== */

      function posicionar(
        elemento,
        dados
      ) {

        elemento.style.left =
          dados.left;


        elemento.style.top =
          dados.top;


        elemento.style.width =
          dados.width;


        elemento.style.height =
          dados.height;

      }


      posicionar(
        hotspotLocalizacao,
        CONFIG.hotspotsFinal.localizacao
      );


      posicionar(
        hotspotConfirmacao,
        CONFIG.hotspotsFinal.confirmacao
      );


      posicionar(
        hotspotPresentes,
        CONFIG.hotspotsFinal.presentes
      );


      posicionar(
        voltarLocalizacao,
        CONFIG.hotspotsPaginas.voltarLocalizacao
      );


      posicionar(
        abrirMapa,
        CONFIG.hotspotsPaginas.abrirMapa
      );


      posicionar(
        voltarConfirmacao,
        CONFIG.hotspotsPaginas.voltarConfirmacao
      );


      posicionar(
        confirmarWhatsapp,
        CONFIG.hotspotsPaginas.confirmarWhatsapp
      );


      posicionar(
        voltarPresentes,
        CONFIG.hotspotsPaginas.voltarPresentes
      );


      posicionar(
        copiarPix,
        CONFIG.hotspotsPaginas.copiarPix
      );


      /* ==================================================
         CAPA
      ================================================== */

      function esconderCapa() {

        if (
          capaTela
            .classList
            .contains(
              "saindo"
            )
        ) {

          return;

        }


        capaTela
          .classList
          .add(
            "saindo"
          );


        setTimeout(
          () => {

            capaTela.style.visibility =
              "hidden";

          },
          200
        );

      }


      /* ==================================================
         TEMPO CORRESPONDENTE DA MÚSICA
      ================================================== */

      function tempoEsperadoMusica() {

        let esperado =
          Math.max(
            0,
            video.currentTime
            +
            CONFIG.inicioMusica
          );


        if (
          Number.isFinite(
            musica.duration
          )
          &&
          musica.duration > 0
        ) {

          esperado %=
            musica.duration;

        }


        return esperado;

      }


      /* ==================================================
         MÚSICA CONTÍNUA

         Inicia NO MESMO TOQUE da abertura.
         Durante o vídeo fica praticamente inaudível.
      ================================================== */

      function iniciarMusicaSilenciosa() {

        musica.volume =
          0.001;


        try {

          musica.currentTime =
            Math.max(
              0,
              CONFIG.inicioMusica
            );

        }

        catch (_) {}


        const tentativa =
          musica.play();


        if (
          tentativa
          &&
          typeof tentativa.catch ===
          "function"
        ) {

          tentativa.catch(
            () => {

              audioDisponivel =
                false;


              controleSom
                .classList
                .remove(
                  "visivel"
                );

            }
          );

        }

      }


      /* ==================================================
         SINCRONIA DURANTE O VÍDEO

         Pode corrigir enquanto a música está escondida.
         Nunca faz seek na entrada do card.
      ================================================== */

      function manterSincronia() {

        if (
          !audioDisponivel
          ||
          finalAtivo
          ||
          finalizando
          ||
          video.paused
          ||
          musica.paused
        ) {

          return;

        }


        const agora =
          performance.now();


        if (
          agora
          -
          ultimoAjusteSincronia
          <
          1000
        ) {

          return;

        }


        ultimoAjusteSincronia =
          agora;


        const esperado =
          tempoEsperadoMusica();


        const diferenca =
          Math.abs(
            musica.currentTime
            -
            esperado
          );


        /*
           Só corrige se houver drift relevante.
           Como está em 0.001, ninguém percebe.
        */

        if (
          diferenca >
          0.35
        ) {

          try {

            musica.currentTime =
              esperado;

          }

          catch (_) {}

        }

      }


      /* ==================================================
         CROSSFADE DE ÁUDIO

         vídeo ↓
         MP3 ↑

         Sem seek.
         Sem novo play().
         Sem microcorte.
      ================================================== */

      function transicaoSuaveAudio(
        aoFinalizar
      ) {

        cancelAnimationFrame(
          rafAudio
        );


        if (
          !audioDisponivel
          ||
          musica.paused
        ) {

          aoFinalizar();

          return;

        }


        const duracao =
          Math.max(
            120,
            CONFIG.transicaoAudio
          );


        const inicio =
          performance.now();


        const volumeVideoInicial =
          video.volume;


        const volumeMusicaInicial =
          musica.volume;


        const volumeMusicaFinal =
          somLigado
            ?
            CONFIG.volumeMusica
            :
            0;


        const animar =
          agora => {

            const progresso =
              Math.min(
                1,
                (
                  agora
                  -
                  inicio
                )
                /
                duracao
              );


            const suave =
              progresso
              *
              progresso
              *
              (
                3
                -
                2
                *
                progresso
              );


            video.volume =
              Math.max(
                0,
                volumeVideoInicial
                *
                (
                  1
                  -
                  suave
                )
              );


            musica.volume =
              volumeMusicaInicial
              +
              (
                volumeMusicaFinal
                -
                volumeMusicaInicial
              )
              *
              suave;


            if (
              progresso <
              1
            ) {

              rafAudio =
                requestAnimationFrame(
                  animar
                );


              return;

            }


            video.volume =
              0;


            musica.volume =
              volumeMusicaFinal;


            aoFinalizar();

          };


        rafAudio =
          requestAnimationFrame(
            animar
          );

      }


      /* ==================================================
         ABRIR CONVITE
      ================================================== */

      async function iniciarConvite() {

        if (
          conviteAberto
        ) {

          return;

        }


        conviteAberto =
          true;


        videoTela.style.visibility =
          "visible";


        videoTela
          .classList
          .remove(
            "saindo"
          );


        videoTela
          .classList
          .add(
            "ativo"
          );


        /*
           Música e vídeo nascem
           no mesmo gesto do usuário.
        */

        iniciarMusicaSilenciosa();


        video.volume =
          1;


        try {

          await video.play();

        }

        catch (_) {

          finalizarVideo();

          esconderCapa();

          return;

        }


        esconderCapa();


        pular
          .classList
          .add(
            "visivel"
          );


        clearTimeout(
          timerPular
        );


        timerPular =
          setTimeout(
            () => {

              pular
                .classList
                .remove(
                  "visivel"
                );

            },
            CONFIG.tempoPular
          );


        acompanharFinal();

      }


      /* ==================================================
         MONITORAR FINAL
      ================================================== */

      function acompanharFinal() {

        cancelAnimationFrame(
          rafFim
        );


        const verificar =
          () => {

            if (
              finalizando
              ||
              finalAtivo
            ) {

              return;

            }


            manterSincronia();


            if (
              Number.isFinite(
                video.duration
              )
              &&
              video.duration >
              0
            ) {

              const restante =
                video.duration
                -
                video.currentTime;


              /*
                 Começa a troca antes do último frame.
              */

              if (
                restante >
                0
                &&
                restante <=
                0.45
              ) {

                finalizarVideo();

                return;

              }

            }


            rafFim =
              requestAnimationFrame(
                verificar
              );

          };


        rafFim =
          requestAnimationFrame(
            verificar
          );

      }


      /* ==================================================
         VÍDEO → CARD
         SEM PRETO + SEM CORTE DE MÚSICA
      ================================================== */

      function finalizarVideo() {

        if (
          finalizando
          ||
          finalAtivo
        ) {

          return;

        }


        finalizando =
          true;


        clearTimeout(
          timerPular
        );


        cancelAnimationFrame(
          rafFim
        );


        pular
          .classList
          .remove(
            "visivel"
          );


        /*
           O card JÁ está pronto atrás.
           Ativamos os botões.
        */

        finalTela
          .classList
          .add(
            "ativo"
          );


        /*
           Vídeo começa o fade visual.
        */

        videoTela
          .classList
          .add(
            "saindo"
          );


        /*
           NÃO fazemos:
           musica.currentTime = ...
           musica.play()

           O MP3 simplesmente continua.
        */

        transicaoSuaveAudio(
          () => {

            video.pause();


            videoTela
              .classList
              .remove(
                "ativo"
              );


            videoTela
              .classList
              .remove(
                "saindo"
              );


            videoTela.style.visibility =
              "hidden";


            video.volume =
              1;


            finalAtivo =
              true;


            finalizando =
              false;


            if (
              audioDisponivel
            ) {

              controleSom
                .classList
                .add(
                  "visivel"
                );

            }

          }
        );

      }


      /* ==================================================
         PÁGINAS INTERNAS
      ================================================== */

      function fecharPaginas() {

        paginaLocalizacao
          .classList
          .remove(
            "ativa"
          );


        paginaConfirmacao
          .classList
          .remove(
            "ativa"
          );


        paginaPresentes
          .classList
          .remove(
            "ativa"
          );


        if (
          finalAtivo
          &&
          audioDisponivel
        ) {

          controleSom
            .classList
            .add(
              "visivel"
            );

        }

      }


      function abrirPagina(
        pagina
      ) {

        fecharPaginas();


        pagina
          .classList
          .add(
            "ativa"
          );


        /*
           Música continua normalmente,
           só escondemos o ícone.
        */

        controleSom
          .classList
          .remove(
            "visivel"
          );

      }


      /* ==================================================
         LINKS
      ================================================== */

      function abrirLink(
        link
      ) {

        if (
          !link
        ) {

          return;

        }


        window.location.href =
          link;

      }


      function abrirWhatsApp() {

        const link =
          "https://wa.me/"
          +
          CONFIG.numeroWhatsapp
          +
          "?text="
          +
          encodeURIComponent(
            CONFIG.mensagemWhatsapp
          );


        abrirLink(
          link
        );

      }


      /* ==================================================
         SOM
      ================================================== */

      function alternarSom() {

        if (
          !audioDisponivel
        ) {

          return;

        }


        somLigado =
          !somLigado;


        musica.volume =
          somLigado
            ?
            CONFIG.volumeMusica
            :
            0;


        controleSom
          .classList
          .toggle(
            "mudo",
            !somLigado
          );

      }


      /* ==================================================
         PIX
      ================================================== */

      function mostrarAvisoPix() {

        avisoPix
          .classList
          .add(
            "visivel"
          );


        clearTimeout(
          timerAvisoPix
        );


        timerAvisoPix =
          setTimeout(
            () => {

              avisoPix
                .classList
                .remove(
                  "visivel"
                );

            },
            2200
          );

      }


      function copiarFallback(
        texto
      ) {

        const textarea =
          document.createElement(
            "textarea"
          );


        textarea.value =
          texto;


        textarea.setAttribute(
          "readonly",
          ""
        );


        textarea.style.position =
          "fixed";


        textarea.style.opacity =
          "0";


        textarea.style.pointerEvents =
          "none";


        document.body.appendChild(
          textarea
        );


        textarea.select();


        textarea.setSelectionRange(
          0,
          textarea.value.length
        );


        let sucesso =
          false;


        try {

          sucesso =
            document.execCommand(
              "copy"
            );

        }

        catch (_) {

          sucesso =
            false;

        }


        textarea.remove();


        return sucesso;

      }


      async function copiarChavePix() {

        const chave =
          CONFIG.chavePix;


        try {

          if (
            navigator.clipboard
            &&
            window.isSecureContext
          ) {

            await navigator.clipboard
              .writeText(
                chave
              );


            mostrarAvisoPix();


            return;

          }

        }

        catch (_) {}


        const sucesso =
          copiarFallback(
            chave
          );


        if (
          sucesso
        ) {

          mostrarAvisoPix();


          return;

        }


        window.prompt(
          "Copie a chave Pix:",
          chave
        );

      }


      /* ==================================================
         VISIBILIDADE
      ================================================== */

      function tratarVisibilidade() {

        if (
          document.hidden
        ) {

          videoEstavaTocando =
            !video.paused
            &&
            !finalAtivo
            &&
            !finalizando;


          musicaEstavaTocando =
            !musica.paused;


          if (
            videoEstavaTocando
          ) {

            video.pause();

          }


          if (
            musicaEstavaTocando
          ) {

            musica.pause();

          }


          return;

        }


        if (
          videoEstavaTocando
          &&
          !finalAtivo
        ) {

          video
            .play()
            .then(
              acompanharFinal
            )
            .catch(
              () => {}
            );

        }


        if (
          musicaEstavaTocando
          &&
          audioDisponivel
        ) {

          musica
            .play()
            .catch(
              () => {}
            );

        }


        videoEstavaTocando =
          false;


        musicaEstavaTocando =
          false;

      }


      /* ==================================================
         EVENTOS
      ================================================== */

      abrirConvite
        .addEventListener(
          "click",
          iniciarConvite
        );


      pular
        .addEventListener(
          "click",
          finalizarVideo
        );


      video
        .addEventListener(
          "playing",
          esconderCapa
        );


      video
        .addEventListener(
          "timeupdate",
          () => {

            if (
              finalizando
              ||
              finalAtivo
            ) {

              return;

            }


            manterSincronia();


            if (
              Number.isFinite(
                video.duration
              )
              &&
              video.duration >
              0
              &&
              (
                video.duration
                -
                video.currentTime
              )
              <=
              0.45
            ) {

              finalizarVideo();

            }

          }
        );


      video
        .addEventListener(
          "ended",
          finalizarVideo
        );


      video
        .addEventListener(
          "error",
          () => {

            if (
              conviteAberto
              &&
              !finalAtivo
            ) {

              finalizarVideo();

              esconderCapa();

            }

          }
        );


      musica
        .addEventListener(
          "error",
          () => {

            audioDisponivel =
              false;


            controleSom
              .classList
              .remove(
                "visivel"
              );

          }
        );


      /* ==================================================
         CARD FINAL
      ================================================== */

      hotspotLocalizacao
        .addEventListener(
          "click",
          () => {

            abrirPagina(
              paginaLocalizacao
            );

          }
        );


      hotspotConfirmacao
        .addEventListener(
          "click",
          () => {

            abrirPagina(
              paginaConfirmacao
            );

          }
        );


      hotspotPresentes
        .addEventListener(
          "click",
          () => {

            abrirPagina(
              paginaPresentes
            );

          }
        );


      /* ==================================================
         VOLTAR
      ================================================== */

      voltarLocalizacao
        .addEventListener(
          "click",
          fecharPaginas
        );


      voltarConfirmacao
        .addEventListener(
          "click",
          fecharPaginas
        );


      voltarPresentes
        .addEventListener(
          "click",
          fecharPaginas
        );


      /* ==================================================
         AÇÕES DAS PÁGINAS
      ================================================== */

      abrirMapa
        .addEventListener(
          "click",
          () => {

            abrirLink(
              CONFIG.linkLocalizacao
            );

          }
        );


      confirmarWhatsapp
        .addEventListener(
          "click",
          abrirWhatsApp
        );


      copiarPix
        .addEventListener(
          "click",
          copiarChavePix
        );


      /* ==================================================
         SOM
      ================================================== */

      controleSom
        .addEventListener(
          "click",
          alternarSom
        );


      /* ==================================================
         SAIR / VOLTAR DE OUTRO APP
      ================================================== */

      document
        .addEventListener(
          "visibilitychange",
          tratarVisibilidade
        );


      window
        .addEventListener(
          "pageshow",
          event => {

            if (
              event.persisted
              &&
              finalAtivo
              &&
              audioDisponivel
            ) {

              musica.volume =
                somLigado
                  ?
                  CONFIG.volumeMusica
                  :
                  0;


              musica
                .play()
                .catch(
                  () => {}
                );

            }

          }
        );


      /* ==================================================
         BLOQUEIOS CASUAIS
      ================================================== */

      document
        .addEventListener(
          "contextmenu",
          event => {

            event.preventDefault();

          }
        );


      document
        .addEventListener(
          "dragstart",
          event => {

            event.preventDefault();

          }
        );


    })();

  </script>

</body>

</html>
